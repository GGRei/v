name: Path Testing CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - 'vlib/v3/**'
      - '**.md'
      - '**.yml'
      - '!**/paths_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'
  pull_request:
    paths-ignore:
      - 'vlib/v3/**'
      - '**.md'
      - '**.yml'
      - '!**/paths_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'

concurrency:
  group: paths-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  space-paths-linux:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: '你好 my $path, @с интервали'
      - name: Build V
        run: |
          # shellcheck disable=SC2016
          echo '你好 my $path, @с интервали'
          ls -la
          # shellcheck disable=SC2016
          cd '你好 my $path, @с интервали'
          ls -la
          make
      - name: v doctor
        run: |
          # shellcheck disable=SC2016
          cd '你好 my $path, @с интервали'
          ./v doctor
      - name: v tests
        run: |
          # shellcheck disable=SC2016
          cd '你好 my $path, @с интервали'
          ./v test vlib/builtin vlib/os

  space-paths-macos:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: '你好 my $path, @с интервали'
          persist-credentials: false
      - name: Build V
        run: |
          # shellcheck disable=SC2016
          echo '你好 my $path, @с интервали'
          ls -la
          # shellcheck disable=SC2016
          cd '你好 my $path, @с интервали'
          ls -la
          make
          ## prebuild cmd/tools/builders/js_builder, to minimise the
          ## chances of a sporadic "Killed" when running the tests later
          ./v -b js run examples/hello_world.v
      - name: v doctor
        run: |
          # shellcheck disable=SC2016
          cd '你好 my $path, @с интервали'
          ./v doctor
      - name: v tests
        run: |
          # shellcheck disable=SC2016
          cd '你好 my $path, @с интервали'
          ./v test vlib/builtin vlib/os

  space-paths-windows:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 30
    ## NB: the following paths do not work for now:
    ##### MY_V_PATH: '你好 my $path, @с интервали'
    ##### MY_V_PATH: 'path with some $punctuation, and some spaces '
    ## tcc has a problem interpreting paths with non latin letters in them,
    ## by default, but that can be solved with passing -Bthirdparty/tcc
    ## but after that V fails self building with:
    ####### builder error: cannot write to folder
    ####### D:\a\v\v\你好 my $path, @с интервали: No such file or directory
    ## and that happens even for gcc builds, not just tcc ones
    steps:
      - uses: actions/checkout@v7
        with:
          path: 'path with some $punctuation, and some spaces'
          persist-credentials: false
      - name: Build V
        run: |
          echo 'path with some $punctuation, and some spaces'
          dir
          cd 'path with some $punctuation, and some spaces'
          dir
          .\makev.bat -tcc
      - name: v doctor
        run: |
          cd 'path with some $punctuation, and some spaces'
          ./v doctor
      - name: v tests
        run: |
          cd 'path with some $punctuation, and some spaces'
          ./v test vlib/builtin vlib/os

  dangling-symlink-windows:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Dangling file symlink acceptance (${{ matrix.cc }})
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cc:
          - tcc
          - gcc
          - msvc
    env:
      PROBE_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure MSVC
        if: matrix.cc == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build V with the selected native compiler
        timeout-minutes: 10
        shell: pwsh
        run: |
          & .\makev.bat "-$env:PROBE_CC"
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat failed for $env:PROBE_CC"
          }
          & .\v.exe version
          if ($LASTEXITCODE -ne 0) {
            throw 'v.exe version failed'
          }

      - name: Prepare acceptance probes
        timeout-minutes: 2
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "dangling-symlink-$env:PROBE_CC"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          "PROBE_DIR=$probeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          #define _CRT_SECURE_NO_WARNINGS
          #define UNICODE
          #define _UNICODE
          #define _WIN32_WINNT 0x0A00

          #include <errno.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/types.h>
          #include <sys/stat.h>
          #include <windows.h>

          #ifndef SYMBOLIC_LINK_FLAG_ALLOW_UNPRIVILEGED_CREATE
          #define SYMBOLIC_LINK_FLAG_ALLOW_UNPRIVILEGED_CREATE 0x2
          #endif

          #ifndef IO_REPARSE_TAG_SYMLINK
          #define IO_REPARSE_TAG_SYMLINK 0xA000000C
          #endif

          #if defined(__TINYC__)
          #define PROBE_COMPILER "tcc"
          #elif defined(_MSC_VER)
          #define PROBE_COMPILER "msvc"
          #elif defined(__GNUC__)
          #define PROBE_COMPILER "gcc"
          #else
          #define PROBE_COMPILER "unknown"
          #endif

          #define FILETIME_TICKS_PER_SECOND 10000000ULL
          #define FILETIME_UNIX_EPOCH 116444736000000000ULL

          struct link_case {
              const char *label;
              const wchar_t *link_path;
              const wchar_t *target_path;
              long long link_time_base;
          };

          static FILETIME unix_seconds_to_filetime(long long seconds) {
              ULARGE_INTEGER value;
              FILETIME result;
              value.QuadPart = ((ULONGLONG)seconds * FILETIME_TICKS_PER_SECOND)
                  + FILETIME_UNIX_EPOCH;
              result.dwLowDateTime = value.LowPart;
              result.dwHighDateTime = value.HighPart;
              return result;
          }

          static long long filetime_to_unix_seconds(FILETIME value) {
              ULARGE_INTEGER ticks;
              ticks.LowPart = value.dwLowDateTime;
              ticks.HighPart = value.dwHighDateTime;
              return (long long)((ticks.QuadPart - FILETIME_UNIX_EPOCH)
                  / FILETIME_TICKS_PER_SECOND);
          }

          static int set_path_times(const wchar_t *path, long long base,
              DWORD flags) {
              HANDLE handle;
              FILETIME creation = unix_seconds_to_filetime(base + 1);
              FILETIME access = unix_seconds_to_filetime(base + 2);
              FILETIME write = unix_seconds_to_filetime(base + 3);
              int ok;

              handle = CreateFileW(path, FILE_WRITE_ATTRIBUTES,
                  FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE, NULL,
                  OPEN_EXISTING, flags, NULL);
              if (handle == INVALID_HANDLE_VALUE) {
                  printf("SET_TIMES open_ok=0 error=%lu\n",
                      (unsigned long)GetLastError());
                  return 0;
              }
              ok = SetFileTime(handle, &creation, &access, &write) != 0;
              if (!ok) {
                  printf("SET_TIMES set_ok=0 error=%lu\n",
                      (unsigned long)GetLastError());
              }
              CloseHandle(handle);
              return ok;
          }

          static int create_target(const wchar_t *path, const char *content,
              DWORD content_size, long long time_base) {
              HANDLE handle;
              DWORD written = 0;
              int write_ok;

              handle = CreateFileW(path, GENERIC_WRITE,
                  FILE_SHARE_READ | FILE_SHARE_WRITE | FILE_SHARE_DELETE, NULL,
                  CREATE_ALWAYS, FILE_ATTRIBUTE_NORMAL, NULL);
              if (handle == INVALID_HANDLE_VALUE) {
                  printf("TARGET create_ok=0 error=%lu\n",
                      (unsigned long)GetLastError());
                  return 0;
              }
              write_ok = WriteFile(handle, content, content_size, &written, NULL) != 0
                  && written == content_size;
              CloseHandle(handle);
              return write_ok && set_path_times(path, time_base, 0);
          }

          static int create_link(const struct link_case *item) {
              int create_ok = CreateSymbolicLinkW(item->link_path,
                  item->target_path,
                  SYMBOLIC_LINK_FLAG_ALLOW_UNPRIVILEGED_CREATE) != 0;
              if (!create_ok) {
                  printf("LINK case=%s create_ok=0 error=%lu\n", item->label,
                      (unsigned long)GetLastError());
                  return 0;
              }
              return set_path_times(item->link_path, item->link_time_base,
                  FILE_FLAG_OPEN_REPARSE_POINT);
          }

          static void print_find(const struct link_case *item) {
              WIN32_FIND_DATAW data;
              HANDLE handle;
              DWORD error;
              unsigned long long size;

              memset(&data, 0, sizeof(data));
              SetLastError(ERROR_SUCCESS);
              handle = FindFirstFileW(item->link_path, &data);
              if (handle == INVALID_HANDLE_VALUE) {
                  error = GetLastError();
                  printf("FIND case=%s rc=-1 error=%lu\n", item->label,
                      (unsigned long)error);
                  return;
              }
              size = ((unsigned long long)data.nFileSizeHigh << 32)
                  | (unsigned long long)data.nFileSizeLow;
              printf("FIND case=%s rc=0 attrs=0x%08lX tag=0x%08lX size=%llu"
                  " atime=%lld mtime=%lld ctime=%lld"
                  " raw_a=%08lX:%08lX raw_m=%08lX:%08lX raw_c=%08lX:%08lX\n",
                  item->label, (unsigned long)data.dwFileAttributes,
                  (unsigned long)data.dwReserved0, size,
                  filetime_to_unix_seconds(data.ftLastAccessTime),
                  filetime_to_unix_seconds(data.ftLastWriteTime),
                  filetime_to_unix_seconds(data.ftCreationTime),
                  (unsigned long)data.ftLastAccessTime.dwHighDateTime,
                  (unsigned long)data.ftLastAccessTime.dwLowDateTime,
                  (unsigned long)data.ftLastWriteTime.dwHighDateTime,
                  (unsigned long)data.ftLastWriteTime.dwLowDateTime,
                  (unsigned long)data.ftCreationTime.dwHighDateTime,
                  (unsigned long)data.ftCreationTime.dwLowDateTime);
              FindClose(handle);
          }

          static void print_wstat(const struct link_case *item) {
              struct _stat64 data;
              int result;
              int saved_errno;

              memset(&data, 0, sizeof(data));
              errno = 0;
              result = _wstat64(item->link_path, &data);
              saved_errno = errno;
              printf("WSTAT case=%s rc=%d errno=%d mode=0x%04X exec=%d"
                  " size=%lld atime=%lld mtime=%lld ctime=%lld\n",
                  item->label, result, saved_errno, (unsigned int)data.st_mode,
                  (data.st_mode & _S_IEXEC) != 0, (long long)data.st_size,
                  (long long)data.st_atime, (long long)data.st_mtime,
                  (long long)data.st_ctime);
          }

          static int validate(const char *name, int condition) {
              printf("CHECK %-34s %s\n", name, condition ? "PASS" : "FAIL");
              return condition ? 0 : 1;
          }

          int main(void) {
              const wchar_t *target_txt = L"metadata_target.txt";
              const wchar_t *target_exe = L"metadata_target.exe";
              const wchar_t *missing_target = L"metadata_missing_target";
              struct link_case cases[] = {
                  {"valid_exe_to_txt", L"metadata_valid.exe", target_txt, 1640995200LL},
                  {"valid_com_to_txt", L"metadata_valid.com", target_txt, 1640995300LL},
                  {"valid_bat_to_txt", L"metadata_valid.bat", target_txt, 1640995400LL},
                  {"valid_cmd_to_txt", L"metadata_valid.cmd", target_txt, 1640995500LL},
                  {"valid_txt_to_exe", L"metadata_valid.txt", target_exe, 1672531200LL},
                  {"dangling_exe", L"metadata_dangling.exe", missing_target, 1704067200LL},
                  {"dangling_com", L"metadata_dangling.com", missing_target, 1704067300LL},
                  {"dangling_bat", L"metadata_dangling.bat", missing_target, 1704067400LL},
                  {"dangling_cmd", L"metadata_dangling.cmd", missing_target, 1704067500LL},
                  {"dangling_txt", L"metadata_dangling.txt", missing_target, 1704067600LL}
              };
              size_t case_count = sizeof(cases) / sizeof(cases[0]);
              size_t index;
              int failures = 0;

              for (index = 0; index < case_count; ++index) {
                  DeleteFileW(cases[index].link_path);
              }
              DeleteFileW(target_txt);
              DeleteFileW(target_exe);
              DeleteFileW(missing_target);

              printf("METADATA compiler=%s\n", PROBE_COMPILER);
              failures += validate("target txt fixture",
                  create_target(target_txt, "TXT", 3, 1577836800LL));
              failures += validate("target exe fixture",
                  create_target(target_exe, "EXE!!", 5, 1609459200LL));
              failures += validate("missing target fixture",
                  GetFileAttributesW(missing_target) == INVALID_FILE_ATTRIBUTES);

              for (index = 0; index < case_count; ++index) {
                  failures += validate(cases[index].label, create_link(&cases[index]));
              }

              {
                  struct link_case target_txt_case = {
                      "target_txt", target_txt, target_txt, 0
                  };
                  struct link_case target_exe_case = {
                      "target_exe", target_exe, target_exe, 0
                  };
                  print_find(&target_txt_case);
                  print_wstat(&target_txt_case);
                  print_find(&target_exe_case);
                  print_wstat(&target_exe_case);
              }

              for (index = 0; index < case_count; ++index) {
                  print_find(&cases[index]);
                  print_wstat(&cases[index]);
              }

              printf("METADATA SUMMARY failures=%d\n", failures);
              for (index = 0; index < case_count; ++index) {
                  DeleteFileW(cases[index].link_path);
              }
              DeleteFileW(target_txt);
              DeleteFileW(target_exe);
              return failures == 0 ? 0 : 1;
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $probeDir 'native_probe.c')

          @'
          module main

          import os

          fn probe_wildcard_lstat(label string, path string) {
              println('WILDCARD CALL case=${label} path="${path}"')
              if wildcard_stat := os.lstat(path) {
                  println('WILDCARD RESULT case=${label} ok=1 mode=${wildcard_stat.mode} type=${wildcard_stat.get_filetype()}')
                  println('WILDCARD VERDICT case=${label} false_stat=1 result=FALSE_STAT_RETURNED')
              } else {
                  println('WILDCARD RESULT case=${label} ok=0 error="${err.msg()}"')
                  println('WILDCARD VERDICT case=${label} false_stat=0 result=ORIGINAL_ERROR_PRESERVED')
              }
          }

          fn probe_extended_exact_lstat(path string) {
              println('EXTENDED CALL case=exact path="${path}"')
              if exact_stat := os.lstat(path) {
                  println('EXTENDED RESULT case=exact ok=1 mode=${exact_stat.mode} type=${exact_stat.get_filetype()}')
                  println('EXTENDED VERDICT case=exact result=EXACT_PATH_RESOLVED')
              } else {
                  println('EXTENDED RESULT case=exact ok=0 error="${err.msg()}"')
                  println('EXTENDED VERDICT case=exact result=EXACT_PATH_REJECTED')
              }
          }

          fn main() {
              link_path := 'native_dangling_file_link'
              absent_path := 'native_absent_control'
              wildcard_dir := 'wildcard_lstat_dir'
              wildcard_link := os.join_path(wildcard_dir, 'only_dangling_link')
              wildcard_star_pattern := os.join_path(wildcard_dir, '*')
              wildcard_question_pattern := os.join_path(wildcard_dir, 'only_dangling_lin?')
              absolute_wildcard_dir := os.join_path(os.getwd(), wildcard_dir)
              extended_prefix := '\\\\?\\'
              extended_exact_path := extended_prefix + os.join_path(absolute_wildcard_dir,
                  os.file_name(wildcard_link))
              extended_wildcard_pattern := extended_prefix + os.join_path(absolute_wildcard_dir,
                  'only_dangling_lin?')
              os.rm(absent_path) or {}
              os.rmdir_all(wildcard_dir) or {}
              defer {
                  os.rm(link_path) or {}
                  os.rm(absent_path) or {}
                  os.rm(wildcard_link) or {}
                  os.rmdir(wildcard_dir) or {}
              }

              mut failures := []string{}
              os.mkdir(wildcard_dir) or {
                  eprintln('WILDCARD SETUP mkdir ok=0 error="${err.msg()}"')
                  exit(1)
              }
              os.symlink('missing_target', wildcard_link) or {
                  eprintln('WILDCARD SETUP symlink ok=0 error="${err.msg()}"')
                  exit(1)
              }
              entries := os.ls(wildcard_dir) or {
                  eprintln('WILDCARD SETUP ls ok=0 error="${err.msg()}"')
                  exit(1)
              }
              setup_ok := entries == [os.file_name(wildcard_link)] && os.is_link(wildcard_link)
              println('WILDCARD SETUP dir="${wildcard_dir}" entries=${entries} only_dangling_file_symlink=${setup_ok}')
              if !setup_ok {
                  eprintln('WILDCARD SETUP invalid fixture')
                  exit(1)
              }

              if lstat_result := os.lstat(link_path) {
                  is_regular := lstat_result.get_filetype() == .regular
                  println('VAPI os.lstat dangling ok=1 mode=${lstat_result.mode} type=${lstat_result.get_filetype()}')
                  if is_regular {
                      println('CHECK os.lstat dangling regular PASS')
                  } else {
                      println('CHECK os.lstat dangling regular FAIL')
                      failures << 'os.lstat dangling regular'
                  }
              } else {
                  println('VAPI os.lstat dangling ok=0 error="${err.msg()}"')
                  println('CHECK os.lstat dangling regular FAIL')
                  failures << 'os.lstat dangling regular'
              }

              if absent_lstat := os.lstat(absent_path) {
                  println('VAPI os.lstat absent ok=1 mode=${absent_lstat.mode} type=${absent_lstat.get_filetype()}')
                  println('CHECK os.lstat absent control FAIL')
                  failures << 'os.lstat absent control'
              } else {
                  println('VAPI os.lstat absent ok=0 error="${err.msg()}"')
                  println('CHECK os.lstat absent control PASS')
              }

              println('WILDCARD MATRIX compiler=${os.getenv('PROBE_CC')}')
              probe_wildcard_lstat('star', wildcard_star_pattern)
              probe_wildcard_lstat('question_mark', wildcard_question_pattern)
              probe_extended_exact_lstat(extended_exact_path)
              probe_wildcard_lstat('extended_question_mark', extended_wildcard_pattern)

              println('VAPI SUMMARY failures=${failures.len}')
              if failures.len != 0 {
                  eprintln('VAPI FAILURES ${failures.join(', ')}')
                  exit(1)
              }
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $probeDir 'v_probe.v')

      - name: Compile and run native Win32 acceptance
        id: native_probe
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $source = Join-Path $env:PROBE_DIR 'native_probe.c'
          $exe = Join-Path $env:PROBE_DIR 'native_probe.exe'
          $object = Join-Path $env:PROBE_DIR 'native_probe.obj'
          switch ($env:PROBE_CC) {
            'tcc' {
              & .\thirdparty\tcc\tcc.exe -Bthirdparty\tcc -Wall -Werror -o $exe $source
            }
            'gcc' {
              & gcc.exe -std=c11 -Wall -Wextra -Werror -o $exe $source
            }
            'msvc' {
              & cl.exe /nologo /TC /W4 /WX "/Fo$object" "/Fe$exe" $source
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "native probe compilation failed for $env:PROBE_CC"
          }
          Push-Location $env:PROBE_DIR
          try {
            & $exe
            if ($LASTEXITCODE -ne 0) {
              throw "native Win32 acceptance failed for $env:PROBE_CC"
            }
          } finally {
            Pop-Location
          }

      - name: Compile and run V os.lstat acceptance
        id: v_probe
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $source = Join-Path $env:PROBE_DIR 'v_probe.v'
          $exe = Join-Path $env:PROBE_DIR 'v_probe.exe'
          & .\v.exe -cc $env:PROBE_CC -no-retry-compilation -showcc -o $exe $source
          if ($LASTEXITCODE -ne 0) {
            throw "V probe compilation failed for $env:PROBE_CC"
          }
          Push-Location $env:PROBE_DIR
          try {
            & $exe
            if ($LASTEXITCODE -ne 0) {
              throw "V os.lstat acceptance failed for $env:PROBE_CC"
            }
          } finally {
            Pop-Location
          }

      - name: Run dangling symlink regression test (GCC/MSVC)
        id: regression_test
        if: ${{ always() && matrix.cc != 'tcc' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:VTEST_ONLY_FN = 'test_exists_symlink_dangling'
          & .\v.exe -cc $env:PROBE_CC -no-retry-compilation test vlib/os/os_test.c.v
          if ($LASTEXITCODE -ne 0) {
            throw "dangling symlink regression test failed for $env:PROBE_CC"
          }

      - name: Record TCC os_test deferral
        id: tcc_regression_deferral
        if: ${{ always() && matrix.cc == 'tcc' }}
        shell: pwsh
        run: |
          Write-Host "v_probe=${{ steps.v_probe.outcome }}"
          Write-Host 'TCC lstat without compilation fallback is covered by native_probe and v_probe.'
          Write-Host 'The os_test.c.v regression command is deferred to the separate tccbin _fseeki64 workstream.'

      - name: Report acceptance outcome
        if: always()
        shell: pwsh
        run: |
          Write-Host "compiler=$env:PROBE_CC"
          Write-Host "native_probe=${{ steps.native_probe.outcome }}"
          Write-Host "v_probe=${{ steps.v_probe.outcome }}"
          Write-Host "regression_test=${{ steps.regression_test.outcome }}"
          Write-Host "tcc_regression_deferral=${{ steps.tcc_regression_deferral.outcome }}"
          $failed = (
            '${{ steps.native_probe.outcome }}' -ne 'success' -or
            '${{ steps.v_probe.outcome }}' -ne 'success'
          )
          if ($env:PROBE_CC -eq 'tcc') {
            $failed = $failed -or '${{ steps.tcc_regression_deferral.outcome }}' -ne 'success'
          } else {
            $failed = $failed -or '${{ steps.regression_test.outcome }}' -ne 'success'
          }
          if ($failed) {
            throw "dangling symlink acceptance failed for $env:PROBE_CC"
          }
