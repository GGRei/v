name: Temporary macOS AppKit V3 CGen lines

on:
  push:
    branches:
      - diag/appkit-v3-cgen-lines-20260819

permissions:
  contents: read

concurrency:
  group: appkit-v3-cgen-lines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appkit-v3-cgen-lines:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      VFLAGS: -cc clang
    steps:
      - uses: actions/checkout@v7
      - name: Build V
        run: make
      - name: Generate and inspect AppKit V3 C lines
        env:
          V_MACOS_V3_NO_FALLBACK: '1'
        shell: bash
        run: |
          set -euo pipefail
          cgen_path="$RUNNER_TEMP/appkit_v3_cgen_lines.c"
          trap 'rm -f "$cgen_path"' EXIT
          set +e
          ./v -os macos -d gg_multiwindow -d sokol_metal \
            -path "$PWD/vlib|@vlib|@vmodules" \
            -o "$cgen_path" \
            vlib/x/multiwindow/multiwindow_test.v
          cgen_rc=$?
          set -e
          python3 - "$cgen_rc" "$cgen_path" <<'PY'
          import base64
          import hashlib
          import pathlib
          import sys

          rc = int(sys.argv[1])
          path = pathlib.Path(sys.argv[2])
          data = path.read_bytes() if path.is_file() else b''
          digest = hashlib.sha256(data).hexdigest() if data else 'absent'
          record_needle = b'AppKitWindowRecord'
          helper_needle = b'appkit_queued_event_from_native'
          record_matches = []
          helper_matches = []
          for number, raw in enumerate(data.splitlines(), 1):
              if record_needle in raw:
                  record_matches.append((number, raw))
              if helper_needle in raw:
                  helper_matches.append((number, raw))
          print(f'MULTIWINDOW_APPKIT_V3_CGEN_META rc={rc} size={len(data)} sha256={digest}')

          def emit_matches(category, matches):
              emitted = min(len(matches), 40)
              for index, (number, raw) in enumerate(matches[:emitted], 1):
                  payload = raw[:1024]
                  encoded = base64.b64encode(payload).decode('ascii')
                  truncated = int(len(raw) > len(payload))
                  print(
                      'MULTIWINDOW_APPKIT_V3_CGEN_LINE '
                      f'category={category} index={index} line={number} len={len(raw)} '
                      f'truncated={truncated} base64={encoded}'
                  )
              print(
                  'MULTIWINDOW_APPKIT_V3_CGEN_SUMMARY '
                  f'category={category} lines={len(matches)} emitted={emitted} '
                  f'omitted={len(matches) - emitted}'
              )

          emit_matches('record', record_matches)
          emit_matches('helper', helper_matches)
          if rc != 0 or not data or not record_matches or not helper_matches:
              raise SystemExit(rc if rc != 0 else 1)
          PY
