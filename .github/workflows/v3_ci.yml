name: V3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vlib/v3/**'
  pull_request:
    paths:
      - 'vlib/v3/**'

concurrency:
  group: v3-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Install Objective-C compiler
        run: |
          .github/workflows/disable_azure_mirror.sh
          ./v retry -- sudo apt update
          ./v retry -- sudo apt install --quiet -y gobjc
      - name: Test v3
        run: ./v run vlib/v3/test_all.vsh

  v3-macos-clang:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Test macOS V3 routing and native Clang linking
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          clang_path="$(command -v clang)"
          clangxx_path="$(command -v clang++)"
          clang_version="$("$clang_path" --version)"
          clangxx_version="$("$clangxx_path" --version)"
          printf '%s\n' "$clang_version" "$clangxx_version"
          [[ "$clang_version" == *clang* && "$clang_version" != *clang-cl* ]]
          [[ "$clangxx_version" == *clang* && "$clangxx_version" != *clang-cl* ]]
          unset CFLAGS LDFLAGS VFLAGS
          export VJOBS=1
          export VTMP="$RUNNER_TEMP/v3 macos spaced tmp"
          mkdir -p "$VTMP"

          run_audited_test() {
            local label="$1"
            local expected_files="$2"
            shift 2
            local log="$RUNNER_TEMP/${label}.log"
            "$@" 2>&1 | tee "$log"
            grep -Fq "${expected_files} passed, ${expected_files} total" "$log"
          }

          assert_exact_test_definitions() {
            local source="$1"
            shift
            [[ -f "$source" ]]
            local name count
            for name in "$@"; do
              count="$(awk -v expected="fn ${name}() {" '$0 == expected { count++ } END { print count + 0 }' "$source")"
              if [[ "$count" != 1 ]]; then
                printf 'expected exactly one definition of %s in %s, found %s\n' "$name" "$source" "$count" >&2
                return 1
              fi
            done
          }

          common=(
            ./v -old-compiler -gc none
            -cc "$clang_path" -c++ "$clangxx_path"
            -no-retry-compilation -path vlib -enable-globals -silent test
          )
          routing_tests=(
            test_macos_v3_relevant_command_selects_user_compilation_and_tests
          )
          assert_exact_test_definitions cmd/v/macos_v3_test.v "${routing_tests[@]}"
          run_audited_test macos-v3-routing 1 \
            "${common[@]}" \
            -run-only "${routing_tests[0]}" \
            cmd/v/macos_v3_test.v
          driver_tests=(
            test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance
            test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c
            test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c
          )
          driver_run_only="$(IFS=,; printf '%s' "${driver_tests[*]}")"
          assert_exact_test_definitions vlib/v3/tests/driver_cli_test.v "${driver_tests[@]}"
          run_audited_test macos-v3-native-link 1 \
            "${common[@]}" \
            -run-only "$driver_run_only" \
            vlib/v3/tests/driver_cli_test.v

          git diff --exit-code
          git diff --cached --exit-code
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

  v3-windows-gnu:
    name: V3 Windows GNU (${{ matrix.lane }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ucrt64-gcc
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64-gcc
            prefix: ucrt64
            cc: gcc
            cxx: g++
            family: gcc
          - lane: ucrt64-clang
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64-clang
            prefix: ucrt64
            cc: clang
            cxx: clang++
            family: clang
          - lane: clang64-clang
            msystem: CLANG64
            package: mingw-w64-clang-x86_64-clang
            prefix: clang64
            cc: clang
            cxx: clang++
            family: clang
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V with the ambient Windows GCC bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = (@(Get-Command gcc.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $version = (& $gcc --version 2>&1 | Out-String)
          Write-Host $version
          if ($LASTEXITCODE -ne 0 -or
              ($version -notmatch '(?i)(gcc|free software foundation|mingw)') -or
              ($version -match '(?i)clang')) {
            throw "ambient bootstrap compiler is not GCC: $gcc"
          }
          .\makev.bat -gcc
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat -gcc failed with exit code $LASTEXITCODE"
          }
      - name: Install the selected native GNU toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: minimal
          cache: false
          install: ${{ matrix.package }}
      - name: Test V1 and V3 with native Windows paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $git = (@(Get-Command git.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $toolBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.prefix }}\bin'
          $ccPath = Join-Path $toolBin '${{ matrix.cc }}.exe'
          $cxxPath = Join-Path $toolBin '${{ matrix.cxx }}.exe'
          $env:Path = "$toolBin;$env:SystemRoot\System32;$env:SystemRoot"

          function Assert-ExactCompiler([string] $Name, [string] $Expected, [string] $Family) {
            if (-not (Test-Path -LiteralPath $Expected -PathType Leaf)) {
              throw "missing selected compiler: $Expected"
            }
            $applications = @(Get-Command "$Name.exe" -CommandType Application -All -ErrorAction Stop)
            if ($applications.Count -ne 1) {
              throw "compiler lookup cardinality mismatch: Name=$Name Count=$($applications.Count)"
            }
            $resolved = $applications[0].Source
            if (-not [string]::Equals(
                [IO.Path]::GetFullPath($resolved),
                [IO.Path]::GetFullPath($Expected),
                [StringComparison]::OrdinalIgnoreCase)) {
              throw "$Name resolved to $resolved instead of $Expected"
            }
            $version = (& $Expected --version 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $version
            if ($code -ne 0) {
              throw "$Expected --version failed with exit code $code"
            }
            if ($Family -eq 'clang') {
              if ($version -notmatch '(?i)clang' -or $version -match '(?i)clang-cl') {
                throw "$Expected is not a GNU-style Clang driver"
              }
            } elseif (($version -notmatch '(?i)(gcc|free software foundation|mingw)') -or
                ($version -match '(?i)clang')) {
              throw "$Expected is not a GCC-family driver"
            }
          }

          Assert-ExactCompiler '${{ matrix.cc }}' $ccPath '${{ matrix.family }}'
          Assert-ExactCompiler '${{ matrix.cxx }}' $cxxPath '${{ matrix.family }}'
          foreach ($name in @('CFLAGS', 'LDFLAGS', 'VFLAGS')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:VJOBS = '1'
          $env:VTMP = Join-Path $env:RUNNER_TEMP 'v3 windows spaced tmp'
          [void] (New-Item -ItemType Directory -Force -Path $env:VTMP)

          $common = @(
            '-old-compiler', '-gc', 'none',
            '-cc', $ccPath, '-c++', $cxxPath,
            '-no-retry-compilation', '-path', 'vlib', '-enable-globals', '-silent', 'test'
          )
          function Invoke-AuditedVTest(
            [string] $Label,
            [int] $ExpectedFiles,
            [string[]] $Tail,
            [string] $ForbiddenText = ''
          ) {
            $log = Join-Path $env:RUNNER_TEMP "$Label.log"
            $allArguments = $common + $Tail
            & .\v.exe @allArguments 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "$Label failed with exit code $code"
            }
            $text = [IO.File]::ReadAllText($log)
            $summary = "$ExpectedFiles passed, $ExpectedFiles total"
            if (-not $text.Contains($summary)) {
              throw "$Label did not execute the expected file count: $summary"
            }
            if ($ForbiddenText -and $text.Contains($ForbiddenText)) {
              throw "$Label contained forbidden skip text: $ForbiddenText"
            }
          }

          function Assert-ExactTestDefinitions([string] $Path, [string[]] $Names) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $Path
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "missing test source: $sourcePath"
            }
            $lines = [IO.File]::ReadAllLines($sourcePath)
            foreach ($name in $Names) {
              $signature = "fn $name() {"
              $count = @($lines | Where-Object { $_ -ceq $signature }).Count
              if ($count -ne 1) {
                throw "expected exactly one definition of $name in $Path, found $count"
              }
            }
          }

          Invoke-AuditedVTest -Label v1-native-link -ExpectedFiles 1 -Tail @(
            'vlib/v/builder/linker_directive_integration_test.v'
          ) -ForbiddenText 'skipping #linker c++ integration'
          Invoke-AuditedVTest -Label v3-pure-requirements -ExpectedFiles 3 -Tail @(
            'vlib/v3/pref/pref_test.v',
            'vlib/v3/driver/c_compiler_flags_test.v',
            'vlib/v3/modulecache/modulecache_test.v'
          )
          $fastcTests = @(
            'test_literal_membership_materializes_candidates_before_comparison',
            'test_cpp_linker_directive_is_rejected_before_fastc_emits_c'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/gen/fastc/fastc_test.v' -Names $fastcTests
          Invoke-AuditedVTest -Label v3-fastc-rejection -ExpectedFiles 1 -Tail @(
            '-run-only', ($fastcTests -join ','),
            'vlib/v3/gen/fastc/fastc_test.v'
          )
          $cacheCompilerTests = @(
            'test_v3_cache_compiler_keeps_family_and_uses_resolved_executable_for_probes'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/driver/cache_prune_test.v' -Names $cacheCompilerTests
          Invoke-AuditedVTest -Label v3-cache-compiler -ExpectedFiles 1 -Tail @(
            '-run-only', ($cacheCompilerTests -join ','),
            'vlib/v3/driver/cache_prune_test.v'
          )
          $driverTests = @(
            'test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance',
            'test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c',
            'test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/tests/driver_cli_test.v' -Names $driverTests
          Invoke-AuditedVTest -Label v3-driver-link -ExpectedFiles 1 -Tail @(
            '-run-only',
            ($driverTests -join ','),
            'vlib/v3/tests/driver_cli_test.v'
          )

          & $git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'tracked files changed during the Windows GNU tests'
          }
          & $git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'the index changed during the Windows GNU tests'
          }
          $status = (& $git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status.Length -ne 0) {
            throw "the worktree is not clean after the Windows GNU tests: $status"
          }

  v3-windows-msvc-negative:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build V with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cl = (@(Get-Command cl.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $clangCl = (@(Get-Command clang-cl.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          Write-Host "cl.exe: $cl"
          Write-Host "clang-cl.exe: $clangCl"
          $clangClVersion = (& $clangCl --version 2>&1 | Out-String)
          Write-Host $clangClVersion
          if ($LASTEXITCODE -ne 0 -or $clangClVersion -notmatch '(?i)clang') {
            throw 'clang-cl.exe preflight failed'
          }
          .\makev.bat -msvc
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat -msvc failed with exit code $LASTEXITCODE"
          }
          $tcc = Join-Path $env:GITHUB_WORKSPACE 'thirdparty\tcc\tcc.exe'
          if (-not (Test-Path -LiteralPath $tcc -PathType Leaf)) {
            throw "missing bundled TinyCC executable: $tcc"
          }
          $tccVersion = (& $tcc -v 2>&1 | Out-String)
          $tccCode = $LASTEXITCODE
          Write-Host $tccVersion
          if ($tccCode -ne 0 -or
              [string]::IsNullOrWhiteSpace($tccVersion) -or
              $tccVersion -notmatch '(?i)(tiny c compiler|tcc version)') {
            throw "bundled TinyCC preflight failed with exit code $tccCode"
          }
      - name: Test unsupported MSVC-family linker modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $git = (@(Get-Command git.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          foreach ($name in @('CFLAGS', 'LDFLAGS', 'VFLAGS')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:VJOBS = '1'
          $env:VTMP = Join-Path $env:RUNNER_TEMP 'v3 msvc spaced tmp'
          [void] (New-Item -ItemType Directory -Force -Path $env:VTMP)
          $common = @(
            '-old-compiler', '-gc', 'none', '-cc', 'msvc',
            '-no-retry-compilation', '-path', 'vlib', '-enable-globals', '-silent', 'test'
          )
          function Invoke-AuditedVTest([string] $Label, [string[]] $Tail) {
            $log = Join-Path $env:RUNNER_TEMP "$Label.log"
            $allArguments = $common + $Tail
            & .\v.exe @allArguments 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "$Label failed with exit code $code"
            }
            $text = [IO.File]::ReadAllText($log)
            if (-not $text.Contains('1 passed, 1 total')) {
              throw "$Label did not execute exactly one test file"
            }
          }

          function Assert-ExactTestDefinitions([string] $Path, [string[]] $Names) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $Path
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "missing test source: $sourcePath"
            }
            $lines = [IO.File]::ReadAllLines($sourcePath)
            foreach ($name in $Names) {
              $signature = "fn $name() {"
              $count = @($lines | Where-Object { $_ -ceq $signature }).Count
              if ($count -ne 1) {
                throw "expected exactly one definition of $name in $Path, found $count"
              }
            }
          }

          $prefTests = @(
            'test_static_pkgconfig_mode_rejects_unsupported_drivers_and_lookalikes',
            'test_static_pkgconfig_mode_excludes_clang_msvc_driver_dialect'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/pref/pref_test.v' -Names $prefTests
          Invoke-AuditedVTest -Label msvc-static-pkgconfig-negative -Tail @(
            '-run-only',
            ($prefTests -join ','),
            'vlib/v3/pref/pref_test.v'
          )
          $cflagsTests = @(
            'test_v3_cpp_linker_default_driver_follows_c_driver_family'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/driver/c_compiler_flags_test.v' -Names $cflagsTests
          Invoke-AuditedVTest -Label msvc-cpp-driver-family -Tail @(
            '-run-only', ($cflagsTests -join ','),
            'vlib/v3/driver/c_compiler_flags_test.v'
          )
          $driverTests = @(
            'test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/tests/driver_cli_test.v' -Names $driverTests
          Invoke-AuditedVTest -Label msvc-driver-cli-negative -Tail @(
            '-run-only', ($driverTests -join ','),
            'vlib/v3/tests/driver_cli_test.v'
          )

          & $git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'tracked files changed during the MSVC tests'
          }
          & $git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'the index changed during the MSVC tests'
          }
          $status = (& $git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status.Length -ne 0) {
            throw "the worktree is not clean after the MSVC tests: $status"
          }

  issue74-v3-linux:
    name: Issue 74 V3 causal tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Run Issue 74 V3 owners
        shell: bash
        run: |
          set -euo pipefail
          unset CFLAGS LDFLAGS VFLAGS
          export VJOBS=1
          export VTMP="$RUNNER_TEMP/issue74 v3 linux tmp"
          export ISSUE74_FASTC_REPEAT2_DIAG=1
          mkdir -p "$VTMP"
          gcc_version="$(gcc --version 2>&1)"; gpp_version="$(g++ --version 2>&1)"
          clang_version="$(clang --version 2>&1)"; clangpp_version="$(clang++ --version 2>&1)"
          [[ "$gcc_version" =~ GCC|gcc|Free[[:space:]]Software[[:space:]]Foundation|MinGW && "$gcc_version" != *clang* ]]
          [[ "$gpp_version" =~ GCC|gcc|Free[[:space:]]Software[[:space:]]Foundation|MinGW && "$gpp_version" != *clang* ]]
          [[ "$clang_version" == *clang* && "$clang_version" != *clang-cl* ]]
          [[ "$clangpp_version" == *clang* && "$clangpp_version" != *clang-cl* ]]

          assert_defs() {
            local file="$1"; shift
            local name count
            for name in "$@"; do
              count="$(awk -v expected="fn ${name}() {" '$0 == expected { n++ } END { print n + 0 }' "$file")"
              [[ "$count" == 1 ]] || { echo "definition count ${file}:${name}=${count}" >&2; return 1; }
            done
          }
          run_owner() {
            local label="$1" file="$2"; shift 2
            local names=("$@") csv log text
            assert_defs "$file" "${names[@]}"
            csv="$(IFS=,; printf '%s' "${names[*]}")"
            log="$RUNNER_TEMP/${label}.log"
            ./v -old-compiler -gc none -no-retry-compilation -path vlib -enable-globals \
              -silent test -run-only "$csv" "$file" 2>&1 | tee "$log"
            text="$(<"$log")"
            [[ "$text" == *"1 passed, 1 total"* ]]
            [[ "$text" != *"no tests found"* && "$text" != *"skipping #linker c++"* ]]
          }

          run_owner v3-pref vlib/v3/pref/pref_test.v \
            test_static_pkgconfig_compiler_owned_names_are_exactly_reserved \
            test_static_pkgconfig_mode_and_canonical_value_matrix \
            test_static_pkgconfig_mode_rejects_unsupported_drivers_and_lookalikes \
            test_static_pkgconfig_mode_excludes_clang_msvc_driver_dialect \
            test_static_pkgconfig_reresolution_replaces_compiler_owned_state \
            test_static_pkgconfig_file_define_selects_only_the_internal_variant
          run_owner v3-cflags vlib/v3/driver/c_compiler_flags_test.v \
            test_v3_user_ldflags_are_final_and_do_not_change_dynamic_plan_when_absent \
            test_v3_object_mode_ignores_link_only_user_flags \
            test_v3_pkgconfig_mode_has_a_distinct_cache_salt \
            test_v3_tcc_fast_link_never_bypasses_static_mode_or_user_ldflags \
            test_v3_cpp_linker_wraps_only_implicit_c_sources \
            test_v3_cpp_linker_response_file_is_private_and_length_driven \
            test_v3_native_source_compile_flags_keep_only_the_selected_language_standard \
            test_v3_cpp_source_flags_keep_compile_inputs_and_drop_link_flags \
            test_v3_cpp_linker_default_driver_follows_c_driver_family \
            test_v3_cgen_metadata_roundtrips_native_link_requirements
          run_owner v3-source-directives vlib/v3/gen/c/source_directive_test.v \
            test_pkgconfig_dynamic_argv_is_historically_byte_for_byte_unchanged \
            test_pkgconfig_global_static_mode_inserts_one_static_option \
            test_local_pkgconfig_static_option_does_not_require_global_static_mode
          run_owner v3-preamble vlib/v3/gen/c/preamble_test.v \
            test_headerless_windows_tcc_uses_one_compat_header_and_sdk_declarations \
            test_headerless_windows_non_tcc_keeps_local_sdk_fallbacks
          run_owner v3-fastc-units vlib/v3/gen/fastc/fastc_test.v \
            test_literal_membership_materializes_candidates_before_comparison \
            test_selfhost_double_pointer_index_preserves_one_pointer_level \
            test_selfhost_double_pointer_index_keeps_one_pointer_level \
            test_source_resolver_uses_compiler_owned_file_defines \
            test_fastc_initial_entry_path_canonicalizes_only_building_v_entries \
            test_selfhost_append_to_nested_array \
            test_selfhost_append_array_result_to_struct_field \
            test_selfhost_map_assignment_with_propagated_result \
            test_cpp_linker_directive_is_rejected_before_fastc_emits_c
          run_owner v3-cache-compiler vlib/v3/driver/cache_prune_test.v \
            test_v3_cache_compiler_keeps_family_and_uses_resolved_executable_for_probes
          run_owner v3-modulecache-units vlib/v3/modulecache/modulecache_test.v \
            test_cached_directive_text_preserves_cpp_linker_requirement \
            test_linker_cache_selector_is_conditional_on_source_directives
          run_owner v3-fastc-backend vlib/v3/tests/fastc_backend_test.v \
            test_v_self_accepts_fastc_backend \
            test_fastc_backend_parses_directly_to_c_without_ast_fallback
          run_owner v3-module-cache-integration vlib/v3/tests/module_cache_test.v \
            test_pkgconfig_mode_cache_isolated_across_dynamic_static_dynamic_sequence \
            test_cpp_linker_requirement_survives_import_cache_true_false_true_sequence
          run_owner v3-driver-cli vlib/v3/tests/driver_cli_test.v \
            test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance \
            test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c \
            test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c

          git diff --exit-code
          git diff --cached --exit-code
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
      - name: Collect FastC repeat-2 C evidence
        id: collect-fastc-repeat2
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          search_root="$RUNNER_TEMP/issue74 v3 linux tmp"
          stage="$RUNNER_TEMP/issue74-fastc-repeat2-c20"
          [[ -n "$RUNNER_TEMP" && -d "$search_root" && ! -L "$search_root" ]]
          runner_real="$(realpath -e -- "$RUNNER_TEMP")"
          search_real="$(realpath -e -- "$search_root")"
          [[ "$search_real" == "$runner_real"/* ]]
          [[ ! -e "$stage" && ! -L "$stage" ]]

          mapfile -d '' candidates < <(find "$search_root" -xdev -type f \
            -name '.v.self-new.*.0.c' -path '*/v_self_fastc_*/isolated_vroot/*' -print0)
          [[ "${#candidates[@]}" -eq 1 ]]
          source_c="${candidates[0]}"
          [[ -f "$source_c" && ! -L "$source_c" && "$(stat -c %h "$source_c")" == 1 ]]
          [[ "$(basename "$(dirname "$source_c")")" == isolated_vroot ]]
          [[ "$(basename "$(dirname "$(dirname "$source_c")")")" =~ ^v_self_fastc_[0-9]+$ ]]
          [[ "$(basename "$source_c")" =~ ^\.v\.self-new\.[0-9]+\.0\.c$ ]]
          source_real="$(realpath -e -- "$source_c")"
          [[ "$source_real" == "$search_real"/* ]]
          source_size="$(stat -c %s "$source_c")"
          [[ "$source_size" -ge 1 && "$source_size" -lt 8388608 ]]

          umask 077
          mkdir "$stage"
          cp -- "$source_c" "$stage/repeat1.c"
          [[ -f "$stage/repeat1.c" && ! -L "$stage/repeat1.c" && "$(stat -c %h "$stage/repeat1.c")" == 1 ]]
          source_sha="$(sha256sum "$source_c" | awk '{print $1}')"
          copied_sha="$(sha256sum "$stage/repeat1.c" | awk '{print $1}')"
          [[ "$source_sha" == "$copied_sha" && "$(stat -c %s "$stage/repeat1.c")" == "$source_size" ]]
          printf 'repeat1.c,%s,%s\n' "$source_size" "$copied_sha" > "$stage/inventory.txt"

          awk -v symbol=v3__gen__fastc__Parser_parse_if -v max_lines=320 -v max_bytes=65536 '
            $0 ~ ("^[A-Za-z_].* " symbol "\\(.*\\) \\{$") { starts++; if (starts > 1) exit 42; active=1 }
            active { line=$0 ORS; if (lines >= max_lines || bytes + length(line) > max_bytes) exit 43;
              printf "%s", line; lines++; bytes+=length(line); opens+=gsub(/\{/, "{"); closes+=gsub(/\}/, "}");
              if (opens > 0 && opens == closes) { done=1; active=0 } }
            END { if (starts != 1 || !done) exit 44 }
          ' "$stage/repeat1.c" > "$stage/parser-parse-if.txt"
          sed -n '23846,23942p' "$stage/repeat1.c" > "$stage/line-23894.txt"
          owner_log="$RUNNER_TEMP/v3-fastc-backend.log"
          [[ -f "$owner_log" && ! -L "$owner_log" ]]
          awk '/src\.c:[0-9]+: (at|by) |RUNTIME ERROR/ { if (lines < 64) print; lines++ }
            END { if (lines < 1) exit 1 }' "$owner_log" > "$stage/stack.txt"
          for evidence in inventory.txt parser-parse-if.txt line-23894.txt stack.txt; do
            [[ -s "$stage/$evidence" && ! -L "$stage/$evidence" && "$(stat -c %h "$stage/$evidence")" == 1 ]]
          done
          [[ "$(stat -c %s "$stage/parser-parse-if.txt")" -le 65536 ]]
          [[ "$(stat -c %s "$stage/line-23894.txt")" -le 32768 ]]
          [[ "$(stat -c %s "$stage/stack.txt")" -le 16384 ]]
      - name: Upload FastC repeat-2 C evidence
        if: failure() && steps.collect-fastc-repeat2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: issue74-fastc-repeat2-c20
          path: ${{ runner.temp }}/issue74-fastc-repeat2-c20
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup FastC repeat-2 diagnostic files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          search_root="$RUNNER_TEMP/issue74 v3 linux tmp"
          stage="$RUNNER_TEMP/issue74-fastc-repeat2-c20"
          [[ -n "$RUNNER_TEMP" && "$search_root" == "$RUNNER_TEMP/issue74 v3 linux tmp" ]]
          [[ "$stage" == "$RUNNER_TEMP/issue74-fastc-repeat2-c20" ]]
          rm -rf -- "$search_root" "$stage"
