name: V3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vlib/v3/**'
  pull_request:
    paths:
      - 'vlib/v3/**'

concurrency:
  group: v3-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Install Objective-C compiler
        run: |
          .github/workflows/disable_azure_mirror.sh
          ./v retry -- sudo apt update
          ./v retry -- sudo apt install --quiet -y gobjc
      - name: Test v3
        run: ./v run vlib/v3/test_all.vsh

  v3-macos-clang:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Test macOS V3 routing and native Clang linking
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          clang_path="$(command -v clang)"
          clangxx_path="$(command -v clang++)"
          clang_version="$("$clang_path" --version)"
          clangxx_version="$("$clangxx_path" --version)"
          printf '%s\n' "$clang_version" "$clangxx_version"
          [[ "$clang_version" == *clang* && "$clang_version" != *clang-cl* ]]
          [[ "$clangxx_version" == *clang* && "$clangxx_version" != *clang-cl* ]]
          unset CFLAGS LDFLAGS VFLAGS
          export VJOBS=1
          export VTMP="$RUNNER_TEMP/v3 macos spaced tmp"
          mkdir -p "$VTMP"

          run_audited_test() {
            local label="$1"
            local expected_files="$2"
            shift 2
            local log="$RUNNER_TEMP/${label}.log"
            "$@" 2>&1 | tee "$log"
            grep -Fq "${expected_files} passed, ${expected_files} total" "$log"
          }

          assert_exact_test_definitions() {
            local source="$1"
            shift
            [[ -f "$source" ]]
            local name count
            for name in "$@"; do
              count="$(awk -v expected="fn ${name}() {" '$0 == expected { count++ } END { print count + 0 }' "$source")"
              if [[ "$count" != 1 ]]; then
                printf 'expected exactly one definition of %s in %s, found %s\n' "$name" "$source" "$count" >&2
                return 1
              fi
            done
          }

          common=(
            ./v -old-compiler -gc none
            -cc "$clang_path" -c++ "$clangxx_path"
            -no-retry-compilation -path vlib -enable-globals -silent test
          )
          routing_tests=(
            test_macos_v3_relevant_command_selects_user_compilation_and_tests
          )
          assert_exact_test_definitions cmd/v/macos_v3_test.v "${routing_tests[@]}"
          run_audited_test macos-v3-routing 1 \
            "${common[@]}" \
            -run-only "${routing_tests[0]}" \
            cmd/v/macos_v3_test.v
          driver_tests=(
            test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance
            test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c
            test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c
          )
          driver_run_only="$(IFS=,; printf '%s' "${driver_tests[*]}")"
          assert_exact_test_definitions vlib/v3/tests/driver_cli_test.v "${driver_tests[@]}"
          run_audited_test macos-v3-native-link 1 \
            "${common[@]}" \
            -run-only "$driver_run_only" \
            vlib/v3/tests/driver_cli_test.v

          git diff --exit-code
          git diff --cached --exit-code
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

  v3-windows-gnu:
    name: V3 Windows GNU (${{ matrix.lane }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ucrt64-gcc
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64-gcc
            prefix: ucrt64
            cc: gcc
            cxx: g++
            family: gcc
          - lane: ucrt64-clang
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64-clang
            prefix: ucrt64
            cc: clang
            cxx: clang++
            family: clang
          - lane: clang64-clang
            msystem: CLANG64
            package: mingw-w64-clang-x86_64-clang
            prefix: clang64
            cc: clang
            cxx: clang++
            family: clang
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V with the ambient Windows GCC bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = (@(Get-Command gcc.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $version = (& $gcc --version 2>&1 | Out-String)
          Write-Host $version
          if ($LASTEXITCODE -ne 0 -or
              ($version -notmatch '(?i)(gcc|free software foundation|mingw)') -or
              ($version -match '(?i)clang')) {
            throw "ambient bootstrap compiler is not GCC: $gcc"
          }
          .\makev.bat -gcc
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat -gcc failed with exit code $LASTEXITCODE"
          }
      - name: Install the selected native GNU toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: minimal
          cache: false
          install: ${{ matrix.package }}
      - name: Test V1 and V3 with native Windows paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $git = (@(Get-Command git.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $toolBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.prefix }}\bin'
          $ccPath = Join-Path $toolBin '${{ matrix.cc }}.exe'
          $cxxPath = Join-Path $toolBin '${{ matrix.cxx }}.exe'
          $env:Path = "$toolBin;$env:SystemRoot\System32;$env:SystemRoot"

          function Assert-ExactCompiler([string] $Name, [string] $Expected, [string] $Family) {
            if (-not (Test-Path -LiteralPath $Expected -PathType Leaf)) {
              throw "missing selected compiler: $Expected"
            }
            $applications = @(Get-Command "$Name.exe" -CommandType Application -All -ErrorAction Stop)
            if ($applications.Count -ne 1) {
              throw "compiler lookup cardinality mismatch: Name=$Name Count=$($applications.Count)"
            }
            $resolved = $applications[0].Source
            if (-not [string]::Equals(
                [IO.Path]::GetFullPath($resolved),
                [IO.Path]::GetFullPath($Expected),
                [StringComparison]::OrdinalIgnoreCase)) {
              throw "$Name resolved to $resolved instead of $Expected"
            }
            $version = (& $Expected --version 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $version
            if ($code -ne 0) {
              throw "$Expected --version failed with exit code $code"
            }
            if ($Family -eq 'clang') {
              if ($version -notmatch '(?i)clang' -or $version -match '(?i)clang-cl') {
                throw "$Expected is not a GNU-style Clang driver"
              }
            } elseif (($version -notmatch '(?i)(gcc|free software foundation|mingw)') -or
                ($version -match '(?i)clang')) {
              throw "$Expected is not a GCC-family driver"
            }
          }

          Assert-ExactCompiler '${{ matrix.cc }}' $ccPath '${{ matrix.family }}'
          Assert-ExactCompiler '${{ matrix.cxx }}' $cxxPath '${{ matrix.family }}'
          foreach ($name in @('CFLAGS', 'LDFLAGS', 'VFLAGS')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:VJOBS = '1'
          $env:VTMP = Join-Path $env:RUNNER_TEMP 'v3 windows spaced tmp'
          [void] (New-Item -ItemType Directory -Force -Path $env:VTMP)

          $common = @(
            '-old-compiler', '-gc', 'none',
            '-cc', $ccPath, '-c++', $cxxPath,
            '-no-retry-compilation', '-path', 'vlib', '-enable-globals', '-silent', 'test'
          )
          function Invoke-AuditedVTest(
            [string] $Label,
            [int] $ExpectedFiles,
            [string[]] $Tail,
            [string] $ForbiddenText = ''
          ) {
            $log = Join-Path $env:RUNNER_TEMP "$Label.log"
            $allArguments = $common + $Tail
            & .\v.exe @allArguments 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "$Label failed with exit code $code"
            }
            $text = [IO.File]::ReadAllText($log)
            $summary = "$ExpectedFiles passed, $ExpectedFiles total"
            if (-not $text.Contains($summary)) {
              throw "$Label did not execute the expected file count: $summary"
            }
            if ($ForbiddenText -and $text.Contains($ForbiddenText)) {
              throw "$Label contained forbidden skip text: $ForbiddenText"
            }
          }

          function Assert-ExactTestDefinitions([string] $Path, [string[]] $Names) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $Path
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "missing test source: $sourcePath"
            }
            $lines = [IO.File]::ReadAllLines($sourcePath)
            foreach ($name in $Names) {
              $signature = "fn $name() {"
              $count = @($lines | Where-Object { $_ -ceq $signature }).Count
              if ($count -ne 1) {
                throw "expected exactly one definition of $name in $Path, found $count"
              }
            }
          }

          Invoke-AuditedVTest -Label v1-native-link -ExpectedFiles 1 -Tail @(
            'vlib/v/builder/linker_directive_integration_test.v'
          ) -ForbiddenText 'skipping #linker c++ integration'
          Invoke-AuditedVTest -Label v3-pure-requirements -ExpectedFiles 3 -Tail @(
            'vlib/v3/pref/pref_test.v',
            'vlib/v3/driver/c_compiler_flags_test.v',
            'vlib/v3/modulecache/modulecache_test.v'
          )
          $fastcTests = @(
            'test_literal_membership_materializes_candidates_before_comparison',
            'test_cpp_linker_directive_is_rejected_before_fastc_emits_c'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/gen/fastc/fastc_test.v' -Names $fastcTests
          Invoke-AuditedVTest -Label v3-fastc-rejection -ExpectedFiles 1 -Tail @(
            '-run-only', ($fastcTests -join ','),
            'vlib/v3/gen/fastc/fastc_test.v'
          )
          $cacheCompilerTests = @(
            'test_v3_cache_compiler_keeps_family_and_uses_resolved_executable_for_probes'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/driver/cache_prune_test.v' -Names $cacheCompilerTests
          Invoke-AuditedVTest -Label v3-cache-compiler -ExpectedFiles 1 -Tail @(
            '-run-only', ($cacheCompilerTests -join ','),
            'vlib/v3/driver/cache_prune_test.v'
          )
          $driverTests = @(
            'test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance',
            'test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c',
            'test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/tests/driver_cli_test.v' -Names $driverTests
          Invoke-AuditedVTest -Label v3-driver-link -ExpectedFiles 1 -Tail @(
            '-run-only',
            ($driverTests -join ','),
            'vlib/v3/tests/driver_cli_test.v'
          )

          & $git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'tracked files changed during the Windows GNU tests'
          }
          & $git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'the index changed during the Windows GNU tests'
          }
          $status = (& $git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status.Length -ne 0) {
            throw "the worktree is not clean after the Windows GNU tests: $status"
          }

  v3-windows-msvc-negative:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build V with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cl = (@(Get-Command cl.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $clangCl = (@(Get-Command clang-cl.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          Write-Host "cl.exe: $cl"
          Write-Host "clang-cl.exe: $clangCl"
          $clangClVersion = (& $clangCl --version 2>&1 | Out-String)
          Write-Host $clangClVersion
          if ($LASTEXITCODE -ne 0 -or $clangClVersion -notmatch '(?i)clang') {
            throw 'clang-cl.exe preflight failed'
          }
          .\makev.bat -msvc
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat -msvc failed with exit code $LASTEXITCODE"
          }
          $tcc = Join-Path $env:GITHUB_WORKSPACE 'thirdparty\tcc\tcc.exe'
          if (-not (Test-Path -LiteralPath $tcc -PathType Leaf)) {
            throw "missing bundled TinyCC executable: $tcc"
          }
          $tccVersion = (& $tcc -v 2>&1 | Out-String)
          $tccCode = $LASTEXITCODE
          Write-Host $tccVersion
          if ($tccCode -ne 0 -or
              [string]::IsNullOrWhiteSpace($tccVersion) -or
              $tccVersion -notmatch '(?i)(tiny c compiler|tcc version)') {
            throw "bundled TinyCC preflight failed with exit code $tccCode"
          }
      - name: Test unsupported MSVC-family linker modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $git = (@(Get-Command git.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          foreach ($name in @('CFLAGS', 'LDFLAGS', 'VFLAGS')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:VJOBS = '1'
          $env:VTMP = Join-Path $env:RUNNER_TEMP 'v3 msvc spaced tmp'
          [void] (New-Item -ItemType Directory -Force -Path $env:VTMP)
          $common = @(
            '-old-compiler', '-gc', 'none', '-cc', 'msvc',
            '-no-retry-compilation', '-path', 'vlib', '-enable-globals', '-silent', 'test'
          )
          function Invoke-AuditedVTest([string] $Label, [string[]] $Tail) {
            $log = Join-Path $env:RUNNER_TEMP "$Label.log"
            $allArguments = $common + $Tail
            & .\v.exe @allArguments 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "$Label failed with exit code $code"
            }
            $text = [IO.File]::ReadAllText($log)
            if (-not $text.Contains('1 passed, 1 total')) {
              throw "$Label did not execute exactly one test file"
            }
          }

          function Assert-ExactTestDefinitions([string] $Path, [string[]] $Names) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $Path
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "missing test source: $sourcePath"
            }
            $lines = [IO.File]::ReadAllLines($sourcePath)
            foreach ($name in $Names) {
              $signature = "fn $name() {"
              $count = @($lines | Where-Object { $_ -ceq $signature }).Count
              if ($count -ne 1) {
                throw "expected exactly one definition of $name in $Path, found $count"
              }
            }
          }

          $prefTests = @(
            'test_static_pkgconfig_mode_rejects_unsupported_drivers_and_lookalikes',
            'test_static_pkgconfig_mode_excludes_clang_msvc_driver_dialect'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/pref/pref_test.v' -Names $prefTests
          Invoke-AuditedVTest -Label msvc-static-pkgconfig-negative -Tail @(
            '-run-only',
            ($prefTests -join ','),
            'vlib/v3/pref/pref_test.v'
          )
          $cflagsTests = @(
            'test_v3_cpp_linker_default_driver_follows_c_driver_family'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/driver/c_compiler_flags_test.v' -Names $cflagsTests
          Invoke-AuditedVTest -Label msvc-cpp-driver-family -Tail @(
            '-run-only', ($cflagsTests -join ','),
            'vlib/v3/driver/c_compiler_flags_test.v'
          )
          $driverTests = @(
            'test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/tests/driver_cli_test.v' -Names $driverTests
          Invoke-AuditedVTest -Label msvc-driver-cli-negative -Tail @(
            '-run-only', ($driverTests -join ','),
            'vlib/v3/tests/driver_cli_test.v'
          )

          & $git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'tracked files changed during the MSVC tests'
          }
          & $git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'the index changed during the MSVC tests'
          }
          $status = (& $git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status.Length -ne 0) {
            throw "the worktree is not clean after the MSVC tests: $status"
          }

  issue74-v3-linux:
    name: Issue 74 V3 causal tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Run Issue 74 V3 owners
        shell: bash
        run: |
          set -euo pipefail
          unset CFLAGS LDFLAGS VFLAGS
          export VJOBS=1
          export VTMP="$RUNNER_TEMP/issue74 v3 linux tmp"
          mkdir -p "$VTMP"
          gcc_version="$(gcc --version 2>&1)"; gpp_version="$(g++ --version 2>&1)"
          clang_version="$(clang --version 2>&1)"; clangpp_version="$(clang++ --version 2>&1)"
          [[ "$gcc_version" =~ GCC|gcc|Free[[:space:]]Software[[:space:]]Foundation|MinGW && "$gcc_version" != *clang* ]]
          [[ "$gpp_version" =~ GCC|gcc|Free[[:space:]]Software[[:space:]]Foundation|MinGW && "$gpp_version" != *clang* ]]
          [[ "$clang_version" == *clang* && "$clang_version" != *clang-cl* ]]
          [[ "$clangpp_version" == *clang* && "$clangpp_version" != *clang-cl* ]]

          assert_defs() {
            local file="$1"; shift
            local name count
            for name in "$@"; do
              count="$(awk -v expected="fn ${name}() {" '$0 == expected { n++ } END { print n + 0 }' "$file")"
              [[ "$count" == 1 ]] || { echo "definition count ${file}:${name}=${count}" >&2; return 1; }
            done
          }
          run_owner() {
            local label="$1" file="$2"; shift 2
            local names=("$@") csv log text
            assert_defs "$file" "${names[@]}"
            csv="$(IFS=,; printf '%s' "${names[*]}")"
            log="$RUNNER_TEMP/${label}.log"
            ./v -old-compiler -gc none -no-retry-compilation -path vlib -enable-globals \
              -silent test -run-only "$csv" "$file" 2>&1 | tee "$log"
            text="$(<"$log")"
            [[ "$text" == *"1 passed, 1 total"* ]]
            [[ "$text" != *"no tests found"* && "$text" != *"skipping #linker c++"* ]]
          }

          run_owner v3-pref vlib/v3/pref/pref_test.v \
            test_static_pkgconfig_compiler_owned_names_are_exactly_reserved \
            test_static_pkgconfig_mode_and_canonical_value_matrix \
            test_static_pkgconfig_mode_rejects_unsupported_drivers_and_lookalikes \
            test_static_pkgconfig_mode_excludes_clang_msvc_driver_dialect \
            test_static_pkgconfig_reresolution_replaces_compiler_owned_state \
            test_static_pkgconfig_file_define_selects_only_the_internal_variant
          run_owner v3-cflags vlib/v3/driver/c_compiler_flags_test.v \
            test_v3_user_ldflags_are_final_and_do_not_change_dynamic_plan_when_absent \
            test_v3_object_mode_ignores_link_only_user_flags \
            test_v3_pkgconfig_mode_has_a_distinct_cache_salt \
            test_v3_tcc_fast_link_never_bypasses_static_mode_or_user_ldflags \
            test_v3_cpp_linker_wraps_only_implicit_c_sources \
            test_v3_cpp_linker_response_file_is_private_and_length_driven \
            test_v3_native_source_compile_flags_keep_only_the_selected_language_standard \
            test_v3_cpp_source_flags_keep_compile_inputs_and_drop_link_flags \
            test_v3_cpp_linker_default_driver_follows_c_driver_family \
            test_v3_cgen_metadata_roundtrips_native_link_requirements
          run_owner v3-source-directives vlib/v3/gen/c/source_directive_test.v \
            test_pkgconfig_dynamic_argv_is_historically_byte_for_byte_unchanged \
            test_pkgconfig_global_static_mode_inserts_one_static_option \
            test_local_pkgconfig_static_option_does_not_require_global_static_mode
          run_owner v3-preamble vlib/v3/gen/c/preamble_test.v \
            test_headerless_windows_tcc_uses_one_compat_header_and_sdk_declarations \
            test_headerless_windows_non_tcc_keeps_local_sdk_fallbacks
          run_owner v3-fastc-units vlib/v3/gen/fastc/fastc_test.v \
            test_literal_membership_materializes_candidates_before_comparison \
            test_selfhost_double_pointer_index_preserves_one_pointer_level \
            test_selfhost_double_pointer_index_keeps_one_pointer_level \
            test_source_resolver_uses_compiler_owned_file_defines \
            test_fastc_initial_entry_path_canonicalizes_only_building_v_entries \
            test_selfhost_append_to_nested_array \
            test_selfhost_append_array_result_to_struct_field \
            test_selfhost_map_assignment_with_propagated_result \
            test_cpp_linker_directive_is_rejected_before_fastc_emits_c
          run_owner v3-cache-compiler vlib/v3/driver/cache_prune_test.v \
            test_v3_cache_compiler_keeps_family_and_uses_resolved_executable_for_probes
          run_owner v3-modulecache-units vlib/v3/modulecache/modulecache_test.v \
            test_cached_directive_text_preserves_cpp_linker_requirement \
            test_linker_cache_selector_is_conditional_on_source_directives
          c14_dir="$RUNNER_TEMP/issue74-fastc-c14"
          c18_context_dir="$RUNNER_TEMP/issue74-fastc-c18-context"
          umask 077
          [[ -n "$RUNNER_TEMP" && "$c14_dir" == "$RUNNER_TEMP/issue74-fastc-c14" ]]
          [[ "$c18_context_dir" == "$RUNNER_TEMP/issue74-fastc-c18-context" ]]
          [[ ! -e "$c14_dir" && ! -L "$c14_dir" ]]
          [[ ! -e "$c18_context_dir" && ! -L "$c18_context_dir" ]]
          mkdir "$c14_dir" "$c18_context_dir"
          [[ -d "$c14_dir" && ! -L "$c14_dir" && "$(stat -c %a "$c14_dir")" == 700 ]]
          [[ -d "$c18_context_dir" && ! -L "$c18_context_dir" && "$(stat -c %a "$c18_context_dir")" == 700 ]]
          (
            export V3_FASTC_C14_DIR="$c14_dir"
            export V3_FASTC_C18_CONTEXT_DIR="$c18_context_dir"
            run_owner v3-fastc-backend vlib/v3/tests/fastc_backend_test.v \
              test_v_self_accepts_fastc_backend \
              test_fastc_backend_parses_directly_to_c_without_ast_fallback
          )
          run_owner v3-module-cache-integration vlib/v3/tests/module_cache_test.v \
            test_pkgconfig_mode_cache_isolated_across_dynamic_static_dynamic_sequence \
            test_cpp_linker_requirement_survives_import_cache_true_false_true_sequence
          run_owner v3-driver-cli vlib/v3/tests/driver_cli_test.v \
            test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance \
            test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c \
            test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c

          git diff --exit-code
          git diff --cached --exit-code
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Collect bounded FastC C14 evidence
        id: c14_collect
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          raw="$RUNNER_TEMP/issue74-fastc-c14"
          stage="$RUNNER_TEMP/issue74-fastc-c14-upload"
          c14_collect_error() {
            rc=$?
            trap - ERR
            set +e
            printf 'collector rc=%s line=%s\n' "$rc" "${BASH_LINENO[0]:-0}" >&2
            count=0
            for dir in "$raw" "$stage"; do
              label="$(basename "$dir")"
              if [[ -d "$dir" && ! -L "$dir" ]]; then
                while IFS= read -r -d '' file; do
                  count=$((count + 1))
                  if [[ "$count" -eq 17 ]]; then
                    printf 'entries/... truncated\n' >&2
                    break 2
                  fi
                  printf '%s/%q size=%s\n' "$label" "$(basename "$file")" "$(stat -c %s "$file" 2>/dev/null)" >&2
                done < <(find "$dir" -mindepth 1 -maxdepth 1 -print0)
              fi
            done
            exit "$rc"
          }
          trap c14_collect_error ERR
          [[ -n "$RUNNER_TEMP" && "$raw" == "$RUNNER_TEMP/issue74-fastc-c14" ]]
          [[ -d "$raw" && ! -L "$raw" && ! -e "$stage" && ! -L "$stage" ]]
          a_fixed=(repeat-1-of-2-sources.txt repeat-1-of-2-declared.txt repeat-2-of-2-sources.txt repeat-2-of-2-declared.txt repeat-2-of-2-error.txt gen1.c gen1.meta)
          b_fixed=(selfhost.c selfhost.meta)
          mapfile -t actual < <(find "$raw" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          [[ "${#actual[@]}" -ge 1 && "${#actual[@]}" -le 22 ]]
          a_count=0
          b_count=0
          c18_count=0
          c18_name=''
          c18_pid=''
          trace_names=()
          for name in "${actual[@]}"; do
            case " ${a_fixed[*]} " in *" $name "*) a_count=$((a_count + 1)); continue ;; esac
            case " ${b_fixed[*]} " in *" $name "*) b_count=$((b_count + 1)); continue ;; esac
            if [[ "$name" =~ ^c18-error-([0-9]+)\.txt$ ]]; then
              c18_count=$((c18_count + 1))
              [[ "$c18_count" -eq 1 ]]
              c18_name="$name"
              c18_pid="${BASH_REMATCH[1]}"
              continue
            fi
            if [[ "$name" =~ ^trace-([0-9]+)-(0[1-9]|1[0-2])\.txt$ ]]; then
              trace_names+=("$name")
              continue
            fi
            false
          done
          a_present=0
          b_present=0
          if [[ "$a_count" -eq 7 ]]; then
            a_complete=1
            for name in "${a_fixed[@]}"; do
              if [[ " ${actual[*]} " != *" $name "* ]]; then a_complete=0; fi
            done
            if [[ "$a_complete" -eq 1 ]]; then a_present=1; fi
          fi
          if [[ "$b_count" -eq 2 && "${#trace_names[@]}" -ge 1 && "${#trace_names[@]}" -le 12 ]]; then
            b_complete=1
            for name in "${b_fixed[@]}"; do
              if [[ " ${actual[*]} " != *" $name "* ]]; then b_complete=0; fi
            done
            if [[ "$b_complete" -eq 1 ]]; then b_present=1; fi
          fi
          total_c=0
          for name in "${actual[@]}"; do
            file="$raw/$name"
            [[ -f "$file" && ! -L "$file" && "$(stat -c %h "$file")" == 1 ]]
            size="$(stat -c %s "$file")"
            case "$name" in
              c18-error-*.txt) [[ "$size" -ge 1 && "$size" -le 65536 ]] ;;
              trace-*.txt) [[ "$size" -ge 1 && "$size" -le 1024 ]] ;;
              *.txt) [[ "$size" -ge 1 && "$size" -le 4096 ]] ;;
              *.meta) [[ "$size" -ge 1 && "$size" -le 256 ]] ;;
              *.c) [[ "$size" -ge 1 && "$size" -le 8388608 ]]; total_c=$((total_c + size)) ;;
              *) false ;;
            esac
          done
          [[ "$total_c" -lt 16777216 ]]
          [[ " ${actual[*]} " == *" gen1.c "* || " ${actual[*]} " == *" selfhost.c "* ]]
          umask 077
          mkdir "$stage"
          mkdir "$stage/raw"
          [[ -d "$stage" && ! -L "$stage" && "$(stat -c %a "$stage")" == 700 ]]
          [[ -d "$stage/raw" && ! -L "$stage/raw" && "$(stat -c %a "$stage/raw")" == 700 ]]
          inventory_tmp="$stage/.inventory.tmp"
          : > "$inventory_tmp"
          for name in "${actual[@]}"; do
            source_file="$raw/$name"
            copied_file="$stage/raw/$name"
            cp -- "$source_file" "$copied_file"
            [[ -f "$copied_file" && ! -L "$copied_file" && "$(stat -c %h "$copied_file")" == 1 ]]
            [[ "$(stat -c %s "$source_file")" == "$(stat -c %s "$copied_file")" ]]
            source_sha="$(sha256sum "$source_file" | awk '{print $1}')"
            copied_sha="$(sha256sum "$copied_file" | awk '{print $1}')"
            [[ "$source_sha" == "$copied_sha" ]]
            printf '%s,%s,%s\n' "$name" "$(stat -c %s "$copied_file")" "$copied_sha" >> "$inventory_tmp"
          done
          [[ -s "$inventory_tmp" && "$(stat -c %s "$inventory_tmp")" -le 65536 ]]
          mv "$inventory_tmp" "$stage/inventory.txt"
          [[ -f "$stage/inventory.txt" && ! -L "$stage/inventory.txt" && "$(stat -c %h "$stage/inventory.txt")" == 1 ]]
          field() { awk -F= -v key="$2" '$1==key {print substr($0,length(key)+2)}' "$1"; }
          status_tmp="$stage/.evidence-status.tmp"
          : > "$status_tmp"
          status() { printf '%s=%s\n' "$1" "$2" >> "$status_tmp"; }
          has_key() { awk -F= -v key="$2" '$1==key {found=1} END {exit !found}' "$1"; }
          pid_relation() {
            label="$1"
            left="$2"
            right="$3"
            if [[ ! -f "$left" || ! -f "$right" ]]; then
              status "$label" missing
            elif [[ "$(field "$left" pid)" =~ ^[0-9]+$ && "$(field "$left" pid)" == "$(field "$right" pid)" ]]; then
              status "$label" pass
            else
              status "$label" fail
            fi
          }
          if [[ "$a_present" -eq 1 ]]; then status component_a complete; elif [[ "$a_count" -gt 0 ]]; then status component_a partial; else status component_a missing; fi
          if [[ "$b_present" -eq 1 ]]; then status component_b complete; elif [[ "$b_count" -gt 0 || "${#trace_names[@]}" -gt 0 ]]; then status component_b partial; else status component_b missing; fi
          if [[ "$c18_count" -eq 1 ]]; then
            status component_c18 present
            c18_file="$raw/$c18_name"
            if [[ "$(head -n 1 "$c18_file")" == schema=c18-error-v1
              && "$(field "$c18_file" snapshot_pid)" == "$c18_pid"
              && "$(field "$c18_file" context_pid)" == "$c18_pid"
              && "$(field "$c18_file" context_ppid)" =~ ^[0-9]+$
              && "$(field "$c18_file" pid)" == "$c18_pid"
              && "$(field "$c18_file" context_size)" =~ ^[0-9]+$
              && "$(field "$c18_file" error_size)" =~ ^[0-9]+$
              && "$(field "$c18_file" raw)" == IError
              && "$(field "$c18_file" path)" == os.v
              && "$(field "$c18_file" module)" == os
              && "$(field "$c18_file" typekey)" == os.IError
              && "$(field "$c18_file" source_count)" =~ ^[0-9]+$
              && "$(field "$c18_file" source_hash)" =~ ^[0-9]+$
              && "$(field "$c18_file" source_indices)" == *:chan_option_result.v:*
              && "$(field "$c18_file" source_indices)" == *:os.v:os*
              && "$(field "$c18_file" args_count)" =~ ^[0-9]+$
              && "$(field "$c18_file" args_recorded)" =~ ^[0-9]+$
              && "$(field "$c18_file" args_total_bytes)" =~ ^[0-9]+$
              && "$(field "$c18_file" args_encoded_bytes)" =~ ^[0-9]+$
              && "$(field "$c18_file" jobs)" =~ ^[0-9]+$
              && "$(field "$c18_file" bounds)" =~ ^[0-9]+(,[0-9]+)+$
              && "$(grep -Ec '^partial-[0-9]+:count=[0-9]+:hash=[0-9]+:IError=(true|false):builtin\.IError=(true|false)$' "$c18_file")" -ge 1
              && "$(grep -Ec '^merged-[0-9]+:count=[0-9]+:hash=[0-9]+:IError=(true|false):builtin\.IError=(true|false)$' "$c18_file")" -ge 1
              && "$(grep -c '^schema=c18-context-v1$' "$c18_file")" -eq 1
              && "$(grep -c '^phase=repeat-2-of-2$' "$c18_file")" -eq 2
              && "$(grep -c '^---context---$' "$c18_file")" -eq 1
              && "$(grep -c '^---error---$' "$c18_file")" -eq 1 ]]; then
              status c18_snapshot_schema pass
            else
              status c18_snapshot_schema fail
            fi
          else
            status component_c18 missing
            status c18_snapshot_schema missing
          fi
          for file in "${a_fixed[@]}"; do
            if [[ " ${actual[*]} " != *" $file "* ]]; then
              status "${file}_metadata" missing
              status "${file}_schema" missing
              continue
            fi
            if [[ "$file" == gen1.c ]]; then
              continue
            fi
            case "$file" in
              repeat-1-*) expected_phase=repeat-1-of-2 ;;
              repeat-2-*) expected_phase=repeat-2-of-2 ;;
              gen1.meta) expected_phase=repeat-1-of-2 ;;
              *) expected_phase='' ;;
            esac
            pid_value="$(field "$raw/$file" pid)"
            phase_value="$(field "$raw/$file" phase)"
            if [[ "$pid_value" =~ ^[0-9]+$ && "$phase_value" == "$expected_phase" ]]; then
              status "${file}_metadata" pass
            else
              status "${file}_metadata" fail
            fi
            mapfile -t file_keys < <(awk -F= '{print $1}' "$raw/$file" | sort)
            case "$file" in
              *-sources.txt)
                if has_key "$raw/$file" pid && has_key "$raw/$file" phase && has_key "$raw/$file" count && has_key "$raw/$file" hash; then status "${file}_schema" pass; else status "${file}_schema" fail; fi
                ;;
              *-declared.txt)
                if [[ "${file_keys[*]}" == "IError builtin.IError chunk count hash phase pid type_source worker" ]]; then status "${file}_schema" pass; else status "${file}_schema" fail; fi
                ;;
              *-error.txt)
                if [[ "${file_keys[*]}" == "IError builtin.IError declared_count declared_hash map_match matching_keys module path phase pid pos raw typekey" ]]; then status "${file}_schema" pass; else status "${file}_schema" fail; fi
                ;;
              *.meta)
                if [[ "${file_keys[*]}" == "phase pid" ]]; then status "${file}_schema" pass; else status "${file}_schema" fail; fi
                ;;
            esac
          done
          declared="$raw/repeat-2-of-2-declared.txt"
          if [[ -f "$declared" ]]; then
            mapfile -t declared_keys < <(awk -F= '{print $1}' "$declared" | sort)
            if [[ "${declared_keys[*]}" == "IError builtin.IError chunk count hash phase pid type_source worker"
              && "$(field "$declared" worker)" == merged && "$(field "$declared" chunk)" == all
              && "$(field "$declared" count)" =~ ^[0-9]+$ && "$(field "$declared" hash)" =~ ^[0-9]+$
              && "$(field "$declared" IError)" =~ ^(true|false)$
              && "$(field "$declared" builtin.IError)" =~ ^(true|false)$ ]]; then
              status repeat2_declared_schema pass
            else
              status repeat2_declared_schema fail
            fi
          else
            status repeat2_declared_schema missing
          fi
          pid_relation repeat1_sources_declared_pid "$raw/repeat-1-of-2-sources.txt" "$raw/repeat-1-of-2-declared.txt"
          pid_relation repeat1_sources_gen1_meta_pid "$raw/repeat-1-of-2-sources.txt" "$raw/gen1.meta"
          pid_relation repeat2_sources_declared_pid "$raw/repeat-2-of-2-sources.txt" "$declared"
          pid_relation repeat2_sources_error_pid "$raw/repeat-2-of-2-sources.txt" "$raw/repeat-2-of-2-error.txt"
          if [[ -f "$raw/selfhost.meta" ]]; then
            b_meta_pid="$(field "$raw/selfhost.meta" pid)"
            if [[ "$b_meta_pid" =~ ^[0-9]+$ && "$(field "$raw/selfhost.meta" phase)" == selfhost-build ]]; then status selfhost_metadata pass; else status selfhost_metadata fail; fi
          else
            status selfhost_metadata missing
          fi
          stages=(entry after-next name-branch name-read in-branch before-collection after-collection collection-normalized element-ready loop-emitted body-done complete)
          trace_pid=''
          trace_total=0
          trace_validation=pass
          for index in "${!trace_names[@]}"; do
            ordinal=$((index + 1))
            step="$(printf '%02d' "$ordinal")"
            name="${trace_names[$index]}"
            if [[ ! "$name" =~ ^trace-([0-9]+)-${step}\.txt$ ]]; then trace_validation=fail; continue; fi
            pid="${BASH_REMATCH[1]}"
            if [[ -n "$trace_pid" && "$pid" != "$trace_pid" ]]; then trace_validation=fail; fi
            trace_pid="$pid"
            file="$raw/$name"
            size="$(stat -c %s "$file")"
            trace_total=$((trace_total + size))
            mapfile -t keys < <(awk -F= '{print $1}' "$file" | sort)
            if [[ "${keys[*]}" != "basename current_function last_expression_tokens last_expression_type literal_hash literal_len locals module out_len phase pid scanner_pos stage step token token_name"
              || "$(field "$file" pid)" != "$pid" || "$(field "$file" phase)" != parse-for-runtime
              || "$(field "$file" step)" != "$step" || "$(field "$file" stage)" != "${stages[$index]}"
              || "$(field "$file" basename)" != valid.v || ! "$(field "$file" scanner_pos)" =~ ^[0-9]+$
              || ! "$(field "$file" token)" =~ ^[0-9]+$ || ! "$(field "$file" literal_len)" =~ ^[0-9]+$
              || ! "$(field "$file" literal_hash)" =~ ^[0-9]+$ || ! "$(field "$file" last_expression_tokens)" =~ ^[0-9]+$
              || ! "$(field "$file" locals)" =~ ^[0-9]+$ || ! "$(field "$file" out_len)" =~ ^[0-9]+$
              || "$(field "$file" last_expression_type | wc -c)" -gt 129 ]]; then
              trace_validation=fail
            fi
          done
          if [[ "${#trace_names[@]}" -eq 0 ]]; then status traces missing; else status traces "$trace_validation"; fi
          extract_definition() {
            awk -v symbol="$2" -v max_lines="$3" -v max_bytes="$4" '
              $0 ~ ("^[A-Za-z_].* " symbol "\\(.*\\) \\{$") { starts++; if(starts>1) exit 42; active=1 }
              active { line=$0 ORS; if(bytes+length(line)>max_bytes || lines>=max_lines) exit 43; printf "%s",line; bytes+=length(line); lines++; opens+=gsub(/\{/,"{"); closes+=gsub(/\}/,"}"); if(opens>0 && opens==closes){done=1; active=0} }
              END { if(starts!=1 || !done) exit 44 }
            ' "$1"
          }
          extract_definition_prefix() {
            awk -v symbol="$2" -v max_lines="$3" -v max_bytes="$4" '
              $0 ~ ("^[A-Za-z_].* " symbol "\\(.*\\) \\{$") { starts++; if(starts>1) exit 42; active=1 }
              active { line=$0 ORS; if(lines>=max_lines || bytes+length(line)>max_bytes){active=0; next}; printf "%s",line; bytes+=length(line); lines++ }
              END { if(starts!=1 || lines<1) exit 44 }
            ' "$1"
          }
          if [[ -f "$raw/gen1.c" ]]; then
            a_excerpt_tmp="$stage/.a-excerpt.tmp"
            if extract_definition "$raw/gen1.c" v3__gen__fastc__fastc_collect_declaration_indexes 220 16384 > "$a_excerpt_tmp" \
              && extract_definition "$raw/gen1.c" v3__gen__fastc__fastc_collect_declaration_chunk 220 16384 >> "$a_excerpt_tmp" \
              && extract_definition "$raw/gen1.c" v3__gen__fastc__fastc_merge_declaration_partial 220 16384 >> "$a_excerpt_tmp" \
              && [[ -s "$a_excerpt_tmp" && "$(stat -c %s "$a_excerpt_tmp")" -le 49152 ]]; then
              mv "$a_excerpt_tmp" "$stage/a-excerpt.txt"
              status extraction_a pass
            else
              rm -f -- "$a_excerpt_tmp"
              status extraction_a fail
            fi
          else
            status extraction_a missing
          fi
          if [[ -f "$raw/selfhost.c" ]]; then
            b_excerpt_tmp="$stage/.b-excerpt.tmp"
            if extract_definition_prefix "$raw/selfhost.c" v3__gen__fastc__Parser_parse_for 500 65536 > "$b_excerpt_tmp" \
              && [[ -s "$b_excerpt_tmp" && "$(stat -c %s "$b_excerpt_tmp")" -le 65536 ]]; then
              mv "$b_excerpt_tmp" "$stage/b-excerpt.txt"
              status extraction_b pass
            else
              rm -f -- "$b_excerpt_tmp"
              status extraction_b fail
            fi
          else
            status extraction_b missing
          fi
          if [[ "${#trace_names[@]}" -gt 0 ]]; then
            b_trace_tmp="$stage/.b-trace.tmp"
            : > "$b_trace_tmp"
            for name in "${trace_names[@]}"; do cat "$raw/$name" >> "$b_trace_tmp"; done
            if [[ -s "$b_trace_tmp" && "$(stat -c %s "$b_trace_tmp")" -le 12288 ]]; then
              mv "$b_trace_tmp" "$stage/b-trace.txt"
              status trace_excerpt pass
            else
              rm -f -- "$b_trace_tmp"
              status trace_excerpt fail
            fi
          else
            status trace_excerpt missing
          fi
          [[ -s "$status_tmp" && "$(stat -c %s "$status_tmp")" -le 65536 ]]
          mv "$status_tmp" "$stage/evidence-status.txt"
          [[ -f "$stage/evidence-status.txt" && ! -L "$stage/evidence-status.txt" && "$(stat -c %h "$stage/evidence-status.txt")" == 1 ]]
          mapfile -t staged < <(find "$stage" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          for name in "${staged[@]}"; do
            case "$name" in
              raw|inventory.txt|evidence-status.txt|a-excerpt.txt|b-excerpt.txt|b-trace.txt) ;;
              *) false ;;
            esac
          done
          [[ " ${staged[*]} " == *" raw "* && " ${staged[*]} " == *" inventory.txt "* && " ${staged[*]} " == *" evidence-status.txt "* ]]
          mapfile -t copied < <(find "$stage/raw" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          [[ "${copied[*]}" == "${actual[*]}" ]]
          staged_c=0
          for name in "${copied[@]}"; do
            file="$stage/raw/$name"
            [[ -f "$file" && ! -L "$file" && "$(stat -c %h "$file")" == 1 ]]
            size="$(stat -c %s "$file")"
            case "$name" in
              c18-error-*.txt) [[ "$size" -ge 1 && "$size" -le 65536 ]] ;;
              trace-*.txt) [[ "$size" -ge 1 && "$size" -le 1024 ]] ;;
              *.txt) [[ "$size" -ge 1 && "$size" -le 4096 ]] ;;
              *.meta) [[ "$size" -ge 1 && "$size" -le 256 ]] ;;
              *.c) [[ "$size" -ge 1 && "$size" -le 8388608 ]]; staged_c=$((staged_c + size)) ;;
              *) false ;;
            esac
          done
          [[ "$staged_c" -lt 16777216 ]]
          for file in "$stage"/*.txt; do
            [[ -f "$file" && ! -L "$file" && "$(stat -c %h "$file")" == 1 ]]
            case "$(basename "$file")" in
              inventory.txt|evidence-status.txt) [[ "$(stat -c %s "$file")" -ge 1 && "$(stat -c %s "$file")" -le 65536 ]] ;;
              a-excerpt.txt) [[ "$(stat -c %s "$file")" -ge 1 && "$(stat -c %s "$file")" -le 49152 ]] ;;
              b-excerpt.txt) [[ "$(stat -c %s "$file")" -ge 1 && "$(stat -c %s "$file")" -le 65536 ]] ;;
              b-trace.txt) [[ "$(stat -c %s "$file")" -ge 1 && "$(stat -c %s "$file")" -le 12288 ]] ;;
            esac
          done

      - name: Upload bounded FastC C14 evidence
        if: failure() && steps.c14_collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: issue74-fastc-c14
          path: ${{ runner.temp }}/issue74-fastc-c14-upload
          retention-days: 7
          if-no-files-found: error

      - name: Clean FastC C14 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/issue74-fastc-c14"
          stage="$RUNNER_TEMP/issue74-fastc-c14-upload"
          context="$RUNNER_TEMP/issue74-fastc-c18-context"
          [[ -n "$RUNNER_TEMP" ]]
          [[ "$raw" == "$RUNNER_TEMP/issue74-fastc-c14" && "$stage" == "$RUNNER_TEMP/issue74-fastc-c14-upload" && "$context" == "$RUNNER_TEMP/issue74-fastc-c18-context" ]]
          rm -rf -- "$raw" "$stage" "$context"
