name: V3 CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'vlib/v3/**'
  pull_request:
    paths:
      - 'vlib/v3/**'

concurrency:
  group: v3-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Install Objective-C compiler
        run: |
          .github/workflows/disable_azure_mirror.sh
          ./v retry -- sudo apt update
          ./v retry -- sudo apt install --quiet -y gobjc
      - name: Test v3
        run: ./v run vlib/v3/test_all.vsh

  v3-macos-clang:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Test macOS V3 routing and native Clang linking
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          clang_path="$(command -v clang)"
          clangxx_path="$(command -v clang++)"
          clang_version="$("$clang_path" --version)"
          clangxx_version="$("$clangxx_path" --version)"
          printf '%s\n' "$clang_version" "$clangxx_version"
          [[ "$clang_version" == *clang* && "$clang_version" != *clang-cl* ]]
          [[ "$clangxx_version" == *clang* && "$clangxx_version" != *clang-cl* ]]
          unset CFLAGS LDFLAGS VFLAGS
          export VJOBS=1
          export VTMP="$RUNNER_TEMP/v3 macos spaced tmp"
          mkdir -p "$VTMP"

          run_audited_test() {
            local label="$1"
            local expected_files="$2"
            shift 2
            local log="$RUNNER_TEMP/${label}.log"
            local code tee_code summary_count pipeline_status
            set +e
            "$@" 2>&1 | tee "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            code="${pipeline_status[0]}"
            tee_code="${pipeline_status[1]}"
            set -e
            [[ "$code" == 0 ]] || { echo "$label failed with exit code $code" >&2; return 1; }
            [[ "$tee_code" == 0 ]] || { echo "$label log write failed with exit code $tee_code" >&2; return 1; }
            summary_count="$(awk -v needle="${expected_files} passed, ${expected_files} total" '{ rest=$0; while ((at=index(rest, needle)) > 0) { count++; rest=substr(rest, at + length(needle)) } } END { print count + 0 }' "$log")"
            [[ "$summary_count" == 1 ]] || { echo "$label summary count=$summary_count" >&2; return 1; }
            if grep -Eqi '(^|[^[:alnum:]_])0[[:space:]]+total([^[:alnum:]_]|$)|no tests found|skipped|skipping|panic' "$log"; then
              echo "$label emitted a forbidden no-op/failure marker" >&2
              return 1
            fi
          }

          assert_exact_test_definitions() {
            local source="$1"
            shift
            [[ -f "$source" ]]
            local name count
            for name in "$@"; do
              count="$(awk -v expected="fn ${name}() {" '$0 == expected { count++ } END { print count + 0 }' "$source")"
              if [[ "$count" != 1 ]]; then
                printf 'expected exactly one definition of %s in %s, found %s\n' "$name" "$source" "$count" >&2
                return 1
              fi
            done
          }

          common=(
            ./v -old-compiler -gc none
            -cc "$clang_path" -c++ "$clangxx_path"
            -no-retry-compilation -path vlib -enable-globals -silent test
          )
          routing_tests=(
            test_macos_v3_relevant_command_selects_user_compilation_and_tests
          )
          assert_exact_test_definitions cmd/v/macos_v3_test.v "${routing_tests[@]}"
          run_audited_test macos-v3-routing 1 \
            "${common[@]}" \
            -run-only "${routing_tests[0]}" \
            cmd/v/macos_v3_test.v
          driver_tests=(
            test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance
            test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c
            test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c
          )
          driver_run_only="$(IFS=,; printf '%s' "${driver_tests[*]}")"
          assert_exact_test_definitions vlib/v3/tests/driver_cli_test.v "${driver_tests[@]}"
          run_audited_test macos-v3-native-link 1 \
            "${common[@]}" \
            -run-only "$driver_run_only" \
            vlib/v3/tests/driver_cli_test.v
          c_v_header_tests=(
            test_c_v_ordinary_header_owns_externs_in_serial_and_scoped_codegen
          )
          assert_exact_test_definitions vlib/v3/tests/c_v_header_owned_extern_test.v "${c_v_header_tests[@]}"
          run_audited_test macos-v3-c-v-header-owned-extern 1 \
            "${common[@]}" \
            -run-only "${c_v_header_tests[0]}" \
            vlib/v3/tests/c_v_header_owned_extern_test.v
          preinclude_tests=(
            test_preinclude_uncertain_macro_keeps_c_extern_prototype
          )
          assert_exact_test_definitions vlib/v3/tests/preinclude_uncertain_macro_test.v "${preinclude_tests[@]}"
          run_audited_test macos-v3-preinclude-extern 1 \
            "${common[@]}" \
            -run-only "${preinclude_tests[0]}" \
            vlib/v3/tests/preinclude_uncertain_macro_test.v

          git diff --exit-code
          git diff --cached --exit-code
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

  v3-windows-gnu:
    name: V3 Windows GNU (${{ matrix.lane }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ucrt64-gcc
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64-gcc
            pkgconf_package: mingw-w64-ucrt-x86_64-pkgconf
            prefix: ucrt64
            cc: gcc
            cxx: g++
            family: gcc
          - lane: ucrt64-clang
            msystem: UCRT64
            package: mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld
            pkgconf_package: mingw-w64-ucrt-x86_64-pkgconf
            prefix: ucrt64
            cc: clang
            cxx: clang++
            family: clang
          - lane: clang64-clang
            msystem: CLANG64
            package: mingw-w64-clang-x86_64-clang
            pkgconf_package: mingw-w64-clang-x86_64-pkgconf
            prefix: clang64
            cc: clang
            cxx: clang++
            family: clang
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V with the ambient Windows GCC bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = (@(Get-Command gcc.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $version = (& $gcc --version 2>&1 | Out-String)
          Write-Host $version
          if ($LASTEXITCODE -ne 0 -or
              ($version -notmatch '(?i)(gcc|free software foundation|mingw)') -or
              ($version -match '(?i)clang')) {
            throw "ambient bootstrap compiler is not GCC: $gcc"
          }
          .\makev.bat -gcc
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat -gcc failed with exit code $LASTEXITCODE"
          }
      - name: Install the selected native GNU toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: minimal
          cache: false
          install: ${{ matrix.package }} ${{ matrix.pkgconf_package }}
      - name: Test V1 and V3 with native Windows paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $git = (@(Get-Command git.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          $toolBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.prefix }}\bin'
          $ccPath = Join-Path $toolBin '${{ matrix.cc }}.exe'
          $cxxPath = Join-Path $toolBin '${{ matrix.cxx }}.exe'
          $pkgConfigPath = Join-Path $toolBin 'pkg-config.exe'
          $env:Path = "$toolBin;$env:SystemRoot\System32;$env:SystemRoot"
          if ('${{ matrix.lane }}' -eq 'ucrt64-clang') {
            $lldPath = Join-Path $toolBin 'ld.lld.exe'
            if (-not (Test-Path -LiteralPath $lldPath -PathType Leaf)) {
              throw "missing selected LLVM linker: $lldPath"
            }
            $lldVersion = (& $lldPath --version 2>&1 | Out-String)
            $lldCode = $LASTEXITCODE
            Write-Host "$lldPath`n$lldVersion"
            if ($lldCode -ne 0 -or $lldVersion -notmatch '(?i)\bLLD\b') {
              throw "selected LLVM linker preflight failed: exit=$lldCode path=$lldPath"
            }
          }

          function Assert-ExactCompiler([string] $Name, [string] $Expected, [string] $Family) {
            if (-not (Test-Path -LiteralPath $Expected -PathType Leaf)) {
              throw "missing selected compiler: $Expected"
            }
            $applications = @(Get-Command "$Name.exe" -CommandType Application -All -ErrorAction Stop)
            if ($applications.Count -ne 1) {
              throw "compiler lookup cardinality mismatch: Name=$Name Count=$($applications.Count)"
            }
            $resolved = $applications[0].Source
            if (-not [string]::Equals(
                [IO.Path]::GetFullPath($resolved),
                [IO.Path]::GetFullPath($Expected),
                [StringComparison]::OrdinalIgnoreCase)) {
              throw "$Name resolved to $resolved instead of $Expected"
            }
            $version = (& $Expected --version 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Write-Host $version
            if ($code -ne 0) {
              throw "$Expected --version failed with exit code $code"
            }
            if ($Family -eq 'clang') {
              if ($version -notmatch '(?i)clang' -or $version -match '(?i)clang-cl') {
                throw "$Expected is not a GNU-style Clang driver"
              }
            } elseif (($version -notmatch '(?i)(gcc|free software foundation|mingw)') -or
                ($version -match '(?i)clang')) {
              throw "$Expected is not a GCC-family driver"
            }
          }

          Assert-ExactCompiler '${{ matrix.cc }}' $ccPath '${{ matrix.family }}'
          Assert-ExactCompiler '${{ matrix.cxx }}' $cxxPath '${{ matrix.family }}'
          if (-not (Test-Path -LiteralPath $pkgConfigPath -PathType Leaf)) {
            throw "missing selected pkg-config executable: $pkgConfigPath"
          }
          $pkgConfigApplications = @(Get-Command pkg-config.exe -CommandType Application -All -ErrorAction Stop)
          if ($pkgConfigApplications.Count -ne 1) {
            throw "pkg-config lookup cardinality mismatch: Count=$($pkgConfigApplications.Count)"
          }
          $resolvedPkgConfig = $pkgConfigApplications[0].Source
          if (-not [string]::Equals(
              [IO.Path]::GetFullPath($resolvedPkgConfig),
              [IO.Path]::GetFullPath($pkgConfigPath),
              [StringComparison]::OrdinalIgnoreCase)) {
            throw "pkg-config resolved to $resolvedPkgConfig instead of $pkgConfigPath"
          }
          $pkgConfigVersion = (& $pkgConfigPath --version 2>&1 | Out-String)
          $pkgConfigCode = $LASTEXITCODE
          Write-Host $pkgConfigVersion
          if ($pkgConfigCode -ne 0 -or [string]::IsNullOrWhiteSpace($pkgConfigVersion) -or
              $pkgConfigVersion -notmatch '[0-9]') {
            throw "pkg-config preflight failed with exit code $pkgConfigCode"
          }
          foreach ($name in @('CFLAGS', 'LDFLAGS', 'VFLAGS')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:VJOBS = '1'
          $env:VTMP = Join-Path $env:RUNNER_TEMP 'v3 windows spaced tmp'
          [void] (New-Item -ItemType Directory -Force -Path $env:VTMP)

          $v1Common = @(
            '-old-compiler', '-cc', $ccPath, '-c++', $cxxPath,
            '-no-retry-compilation', '-silent', 'test'
          )
          $v3Common = @(
            '-old-compiler', '-gc', 'none', '-cc', $ccPath, '-c++', $cxxPath,
            '-no-retry-compilation', '-path', 'vlib', '-enable-globals', '-silent', 'test'
          )
          function Run-Owner(
            [string] $Label,
            [string] $Path,
            [string[]] $Names,
            [string[]] $Common
          ) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $Path
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "missing test source: $sourcePath"
            }
            $lines = [IO.File]::ReadAllLines($sourcePath)
            foreach ($name in $Names) {
              $signature = "fn $name() {"
              $count = @($lines | Where-Object { $_ -ceq $signature }).Count
              if ($count -ne 1) {
                throw "expected exactly one definition of $name in $Path, found $count"
              }
            }
            $log = Join-Path $env:RUNNER_TEMP "$Label.log"
            $allArguments = $Common + @('-run-only', ($Names -join ','), $Path)
            & .\v.exe @allArguments 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "$Label failed with exit code $code"
            }
            $text = [IO.File]::ReadAllText($log)
            $summary = '1 passed, 1 total'
            if (([regex]::Matches($text, [regex]::Escape($summary))).Count -ne 1) {
              throw "$Label summary cardinality mismatch: $summary"
            }
            if ($text -match '(?im)\b0\s+total\b|no tests found|skipped|skipping|panic') {
              throw "$Label emitted a forbidden no-op/failure marker"
            }
          }

          Run-Owner -Label v1-native-link -Path 'vlib/v/builder/linker_directive_integration_test.v' -Common $v1Common -Names @(
            'test_cpp_linker_real_drivers_keep_c_inputs_and_supply_their_runtime',
            'test_cpp_linker_compile_only_paths_do_not_probe_the_cpp_driver',
            'test_cpp_linker_cross_target_executable_reports_before_driver_selection')
          Run-Owner -Label v1-ecdsa-search-paths -Path 'vlib/v/ast/cflags_test.v' -Common $v1Common -Names @(
            'test_ecdsa_windows_search_flags_keep_independent_existing_paths')
          Run-Owner -Label v3-ecdsa-search-paths -Path 'vlib/v3/gen/c/target_test.v' -Common $v3Common -Names @(
            'test_ecdsa_windows_search_flags_keep_independent_existing_paths')
          Run-Owner -Label v3-fastcdriver -Path 'vlib/v3/fastcdriver/fastcdriver_test.v' -Common $v3Common -Names @(
            'test_fastc_is_v3_entry_accepts_exact_native_entry',
            'test_fastc_vroot_for_input_replaces_nonempty_only_when_building_v')
          Run-Owner -Label v3-pref -Path 'vlib/v3/pref/pref_test.v' -Common $v3Common -Names @(
            'test_static_pkgconfig_compiler_owned_names_are_exactly_reserved',
            'test_static_pkgconfig_mode_and_canonical_value_matrix',
            'test_static_pkgconfig_mode_rejects_unsupported_drivers_and_lookalikes',
            'test_static_pkgconfig_mode_excludes_clang_msvc_driver_dialect',
            'test_static_pkgconfig_reresolution_replaces_compiler_owned_state',
            'test_static_pkgconfig_file_define_selects_only_the_internal_variant',
            'test_pkgconfig_executable_candidate_requires_absolute_regular_executable_exe',
            'test_pkgconfig_executable_resolves_only_windows_exe',
            'test_comptime_pkgconfig_value_uses_pkgconfig_runner')
          Run-Owner -Label v3-parser-pkgconfig -Path 'vlib/v3/parser/comptime_pkgconfig_test.v' -Common $v3Common -Names @(
            'test_comptime_pkgconfig_function_keeps_dollar_prefix')
          Run-Owner -Label v3-pointer-voidptr -Path 'vlib/v3/tests/pointer_voidptr_compat_test.v' -Common $v3Common -Names @(
            'test_explicit_voidptr_slot_addresses_preserve_source_storage')
          Run-Owner -Label v3-cflags -Path 'vlib/v3/driver/c_compiler_flags_test.v' -Common $v3Common -Names @(
            'test_v3_user_ldflags_are_final_and_do_not_change_dynamic_plan_when_absent',
            'test_v3_object_mode_ignores_link_only_user_flags',
            'test_v3_pkgconfig_mode_has_a_distinct_cache_salt',
            'test_v3_tcc_fast_link_never_bypasses_static_mode_or_user_ldflags',
            'test_v3_cpp_linker_wraps_only_implicit_c_sources',
            'test_v3_cpp_linker_response_file_is_private_and_length_driven',
            'test_v3_native_source_compile_flags_keep_only_the_selected_language_standard',
            'test_v3_cpp_source_flags_keep_compile_inputs_and_drop_link_flags',
            'test_v3_cpp_linker_default_driver_follows_c_driver_family',
            'test_v3_cgen_metadata_roundtrips_native_link_requirements')
          Run-Owner -Label v3-source-directives -Path 'vlib/v3/gen/c/source_directive_test.v' -Common $v3Common -Names @(
            'test_cache_extern_declaration_avoids_tgmath_macro_expansion',
            'test_windows_unresolved_ordinary_winsock_headers_preserve_native_tag',
            'test_winsock_header_fallback_preserves_headerless_and_nonwindows_boundaries',
            'test_pkgconfig_dynamic_argv_is_historically_byte_for_byte_unchanged',
            'test_pkgconfig_global_static_mode_inserts_one_static_option',
            'test_local_pkgconfig_static_option_does_not_require_global_static_mode',
            'test_pkgconfig_flags_use_resolved_pkgconfig_runner',
            'test_c_v_ordinary_emitted_header_owns_only_same_file_c_externs',
            'test_c_v_header_ownership_excludes_nonordinary_and_nonheader_directives',
            'test_header_owned_c_extern_sources_reset_between_generations')
          Run-Owner -Label v3-parallel-extern-owner -Path 'vlib/v3/gen/c/parallel_worker_test.v' -Common $v3Common -Names @(
            'test_c_extern_scan_worker_clones_header_owned_sources')
          Run-Owner -Label v3-sokol-objective-c -Path 'vlib/v3/gen/c/names_test.v' -Common $v3Common -Names @(
            'test_sokol_gfx_header_does_not_select_objective_c_on_windows_backends')
          Run-Owner -Label v3-sokol-windows-backends -Path 'vlib/sokol/gfx/windows_backend_flags_test.v' -Common $v3Common -Names @(
            'test_windows_sokol_backend_flags_are_exclusive_in_declaration',
            'test_windows_sokol_default_backend_cflags_remain_glcore',
            'test_windows_sokol_d3d11_backend_cflags_select_only_d3d11')
          Run-Owner -Label v3-preamble -Path 'vlib/v3/gen/c/preamble_test.v' -Common $v3Common -Names @(
            'test_headerless_windows_tcc_uses_one_compat_header_and_sdk_declarations',
            'test_headerless_windows_emits_or_aliases_exact_filetime_platform_struct',
            'test_headerless_windows_tcc_preserves_only_atomic_header_sdk_functions',
            'test_windows_headers_guard_conditional_nls_and_vista_externs',
            'test_windows_system_libc_owns_exact_header_backed_extern_sets',
            'test_windows_system_libc_headers_define_fixed_crt_and_vista_contract',
            'test_unresolved_windows_header_does_not_replace_central_system_ownership',
            'test_system_libc_windows_tcc_atomic_header_does_not_preserve_sdk_functions',
            'test_headerless_windows_non_tcc_keeps_local_sdk_fallbacks',
            'test_headerless_windows_non_tcc_without_builtins_keeps_aligned_externs_owned_by_source',
            'test_non_windows_preamble_does_not_emit_windows_abi_fallbacks')
          Run-Owner -Label v3-windows-native-c-types -Path 'vlib/v3/types/c_type_cache_identity_test.v' -Common $v3Common -Names @(
            'test_c_type_renders_windows_stat_tag_without_inventing_typedef')
          Run-Owner -Label v1-stdio -Path 'vlib/builtin/builtin_unbuffer_stdout_test.v' -Common $v1Common -Names @(
            'test_unbuffer_stdout')
          $waitHeaderCcEnvName = 'ISSUE74_V3_WAIT_HEADER_CC'
          $waitHeaderCxxEnvName = 'ISSUE74_V3_WAIT_HEADER_CXX'
          $waitHeaderCcEnvPath = "Env:$waitHeaderCcEnvName"
          $waitHeaderCxxEnvPath = "Env:$waitHeaderCxxEnvName"
          $oldWaitHeaderCcPresent = Test-Path -LiteralPath $waitHeaderCcEnvPath
          $oldWaitHeaderCxxPresent = Test-Path -LiteralPath $waitHeaderCxxEnvPath
          $oldWaitHeaderCc = if ($oldWaitHeaderCcPresent) { (Get-Item -LiteralPath $waitHeaderCcEnvPath).Value } else { $null }
          $oldWaitHeaderCxx = if ($oldWaitHeaderCxxPresent) { (Get-Item -LiteralPath $waitHeaderCxxEnvPath).Value } else { $null }
          try {
            Set-Item -LiteralPath $waitHeaderCcEnvPath -Value $ccPath
            Set-Item -LiteralPath $waitHeaderCxxEnvPath -Value $cxxPath
            Run-Owner -Label v3-windows-system-header-codegen -Path 'vlib/v3/tests/posix_wait_header_codegen_test.v' -Common $v3Common -Names @(
              'test_windows_system_headers_own_crt_externs_and_native_tags',
              'test_windows_ordinary_winsock_headers_preserve_ipv6_contract')
          } finally {
            if ($oldWaitHeaderCcPresent) {
              Set-Item -LiteralPath $waitHeaderCcEnvPath -Value $oldWaitHeaderCc
            } else {
              Remove-Item -LiteralPath $waitHeaderCcEnvPath -ErrorAction SilentlyContinue
            }
            if ($oldWaitHeaderCxxPresent) {
              Set-Item -LiteralPath $waitHeaderCxxEnvPath -Value $oldWaitHeaderCxx
            } else {
              Remove-Item -LiteralPath $waitHeaderCxxEnvPath -ErrorAction SilentlyContinue
            }
          }
          Run-Owner -Label v3-fastc -Path 'vlib/v3/gen/fastc/fastc_test.v' -Common $v3Common -Names @(
            'test_source_resolver_uses_compiler_owned_file_defines',
            'test_cpp_linker_directive_is_rejected_before_fastc_emits_c',
            'test_fastc_pkgconfig_flags_use_resolved_pkgconfig_runner')
          Run-Owner -Label v3-cache-compiler -Path 'vlib/v3/driver/cache_prune_test.v' -Common $v3Common -Names @(
            'test_v3_cache_compiler_keeps_family_and_uses_resolved_executable_for_probes')
          Run-Owner -Label v3-modulecache -Path 'vlib/v3/modulecache/modulecache_test.v' -Common $v3Common -Names @(
            'test_cached_file_line_uses_source_file_name',
            'test_cached_directive_text_preserves_cpp_linker_requirement',
            'test_linker_cache_selector_is_conditional_on_source_directives')
          Run-Owner -Label v3-output-suffix -Path 'vlib/v3/driver/implicit_import_test.v' -Common $v3Common -Names @(
            'test_c_executable_bin_file_uses_target_postfix')
          $testCcEnvName = 'ISSUE74_V3_DRIVER_TEST_CC'
          $testCxxEnvName = 'ISSUE74_V3_DRIVER_TEST_CXX'
          $testCcEnvPath = "Env:$testCcEnvName"
          $testCxxEnvPath = "Env:$testCxxEnvName"
          $oldTestCcPresent = Test-Path -LiteralPath $testCcEnvPath
          $oldTestCxxPresent = Test-Path -LiteralPath $testCxxEnvPath
          $oldTestCc = if ($oldTestCcPresent) { (Get-Item -LiteralPath $testCcEnvPath).Value } else { $null }
          $oldTestCxx = if ($oldTestCxxPresent) { (Get-Item -LiteralPath $testCxxEnvPath).Value } else { $null }
          try {
            Set-Item -LiteralPath $testCcEnvPath -Value $ccPath
            Set-Item -LiteralPath $testCxxEnvPath -Value $cxxPath
            Run-Owner -Label v3-driver-link -Path 'vlib/v3/tests/driver_cli_test.v' -Common $v3Common -Names @(
              'test_driver_resolves_pkgconfig_executable_for_standalone_v3',
              'test_driver_static_pkgconfig_fact_ldflags_and_dynamic_c_invariance',
              'test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c',
              'test_driver_cpp_linker_uses_final_cpp_driver_and_keeps_sources_c')
            Run-Owner -Label v3-fixed-array-declared-defaults -Path 'vlib/v3/tests/struct_init_embed_fixed_array_codegen_test.v' -Common $v3Common -Names @(
              'test_struct_init_embed_plus_fixed_array_sets_both',
              'test_struct_fixed_array_declared_defaults_survive_result_fallback')
            Run-Owner -Label v3-reader-homonym -Path 'vlib/v3/tests/interface_fn_parameter_test.v' -Common $v3Common -Names @(
              'test_interface_method_fn_parameter_uses_c_typedef',
              'test_homonymous_struct_does_not_replace_interface_method_signature')
            Run-Owner -Label v3-reverse-iterator-types -Path 'vlib/v3/tests/for_in_review_test.v' -Common $v3Common -Names @(
              'test_custom_iterator_pointer_for_in_uses_single_indirection',
              'test_reverse_iterator_preserves_parameter_and_recursive_field_element_types')
          } finally {
            if ($oldTestCcPresent) {
              Set-Item -LiteralPath $testCcEnvPath -Value $oldTestCc
            } else {
              Remove-Item -LiteralPath $testCcEnvPath -ErrorAction SilentlyContinue
            }
            if ($oldTestCxxPresent) {
              Set-Item -LiteralPath $testCxxEnvPath -Value $oldTestCxx
            } else {
              Remove-Item -LiteralPath $testCxxEnvPath -ErrorAction SilentlyContinue
            }
          }

          & $git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'tracked files changed during the Windows GNU tests'
          }
          & $git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'the index changed during the Windows GNU tests'
          }
          $status = (& $git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status.Length -ne 0) {
            throw "the worktree is not clean after the Windows GNU tests: $status"
          }
      - name: Preserve fixed-array reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-fixed-array-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/issue74-fixed-array-evidence/*.v
            ${{ runner.temp }}/issue74-fixed-array-evidence/*.c
            ${{ runner.temp }}/issue74-fixed-array-evidence/*.log
            ${{ runner.temp }}/issue74-fixed-array-evidence/*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Reader reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-reader-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/issue74-reader-evidence/*.c
            ${{ runner.temp }}/issue74-reader-evidence/*.log
            ${{ runner.temp }}/issue74-reader-evidence/*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve ReverseIterator reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-reverse-iterator-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/issue74-reverse-iterator-evidence/*.c
            ${{ runner.temp }}/issue74-reverse-iterator-evidence/*.log
            ${{ runner.temp }}/issue74-reverse-iterator-evidence/*.txt
          if-no-files-found: error
          retention-days: 7

  v3-windows-msvc-negative:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build V with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clApplications = @(Get-Command cl.exe -CommandType Application -All -ErrorAction Stop)
          if ($clApplications.Count -ne 1) {
            throw "MSVC compiler lookup cardinality mismatch: cl=$($clApplications.Count)"
          }
          $cl = $clApplications[0].Source
          $expectedCl = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\cl.exe'
          if (-not (Test-Path -LiteralPath $expectedCl -PathType Leaf) -or -not [string]::Equals([IO.Path]::GetFullPath($cl), [IO.Path]::GetFullPath($expectedCl), [StringComparison]::OrdinalIgnoreCase)) {
            throw "cl.exe resolved to $cl instead of $expectedCl"
          }
          $expectedClangCl = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin\clang-cl.exe'
          if (-not (Test-Path -LiteralPath $expectedClangCl -PathType Leaf)) {
            throw "missing canonical clang-cl.exe: $expectedClangCl"
          }
          $expectedClangClFullPath = [IO.Path]::GetFullPath($expectedClangCl)
          $clangClApplications = @(Get-Command clang-cl.exe -CommandType Application -All -ErrorAction Stop | Where-Object {
            [string]::Equals([IO.Path]::GetFullPath($_.Source), $expectedClangClFullPath, [StringComparison]::OrdinalIgnoreCase)
          })
          if ($clangClApplications.Count -ne 1) {
            throw "canonical clang-cl.exe lookup cardinality mismatch: Count=$($clangClApplications.Count) Expected=$expectedClangClFullPath"
          }
          $clangCl = $clangClApplications[0].Source
          if (-not [string]::Equals([IO.Path]::GetFullPath($clangCl), $expectedClangClFullPath, [StringComparison]::OrdinalIgnoreCase)) {
            throw "clang-cl.exe resolved to $clangCl instead of $expectedClangClFullPath"
          }
          Write-Host "cl.exe: $cl"
          Write-Host "clang-cl.exe: $clangCl"
          $clangClVersion = (& $clangCl --version 2>&1 | Out-String)
          Write-Host $clangClVersion
          if ($LASTEXITCODE -ne 0 -or $clangClVersion -notmatch '(?i)clang') {
            throw 'clang-cl.exe preflight failed'
          }
          .\makev.bat -msvc
          if ($LASTEXITCODE -ne 0) {
            throw "makev.bat -msvc failed with exit code $LASTEXITCODE"
          }
          $tcc = Join-Path $env:GITHUB_WORKSPACE 'thirdparty\tcc\tcc.exe'
          if (-not (Test-Path -LiteralPath $tcc -PathType Leaf)) {
            throw "missing bundled TinyCC executable: $tcc"
          }
          $tccVersion = (& $tcc -v 2>&1 | Out-String)
          $tccCode = $LASTEXITCODE
          Write-Host $tccVersion
          if ($tccCode -ne 0 -or
              [string]::IsNullOrWhiteSpace($tccVersion) -or
              $tccVersion -notmatch '(?i)(tiny c compiler|tcc version)') {
            throw "bundled TinyCC preflight failed with exit code $tccCode"
          }
      - name: Test unsupported MSVC-family linker modes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $git = (@(Get-Command git.exe -CommandType Application -All -ErrorAction Stop))[0].Source
          foreach ($name in @('CFLAGS', 'LDFLAGS', 'VFLAGS')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:VJOBS = '1'
          $env:VTMP = Join-Path $env:RUNNER_TEMP 'v3 msvc spaced tmp'
          [void] (New-Item -ItemType Directory -Force -Path $env:VTMP)
          $common = @(
            '-old-compiler', '-gc', 'none', '-cc', 'msvc',
            '-no-retry-compilation', '-path', 'vlib', '-enable-globals', '-silent', 'test'
          )
          function Invoke-AuditedVTest([string] $Label, [string[]] $Tail) {
            $log = Join-Path $env:RUNNER_TEMP "$Label.log"
            $allArguments = $common + $Tail
            & .\v.exe @allArguments 2>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              throw "$Label failed with exit code $code"
            }
            $text = [IO.File]::ReadAllText($log)
            if (([regex]::Matches($text, [regex]::Escape('1 passed, 1 total'))).Count -ne 1) {
              throw "$Label summary cardinality mismatch"
            }
            if ($text -match '(?im)\b0\s+total\b|no tests found|skipped|skipping|panic') {
              throw "$Label emitted a forbidden no-op/failure marker"
            }
          }

          function Assert-ExactTestDefinitions([string] $Path, [string[]] $Names) {
            $sourcePath = Join-Path $env:GITHUB_WORKSPACE $Path
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
              throw "missing test source: $sourcePath"
            }
            $lines = [IO.File]::ReadAllLines($sourcePath)
            foreach ($name in $Names) {
              $signature = "fn $name() {"
              $count = @($lines | Where-Object { $_ -ceq $signature }).Count
              if ($count -ne 1) {
                throw "expected exactly one definition of $name in $Path, found $count"
              }
            }
          }

          $fastcdriverTests = @(
            'test_fastc_is_v3_entry_accepts_exact_native_entry',
            'test_fastc_vroot_for_input_replaces_nonempty_only_when_building_v'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/fastcdriver/fastcdriver_test.v' -Names $fastcdriverTests
          Invoke-AuditedVTest -Label msvc-fastcdriver -Tail @(
            '-run-only', ($fastcdriverTests -join ','),
            'vlib/v3/fastcdriver/fastcdriver_test.v'
          )
          $prefTests = @(
            'test_static_pkgconfig_mode_rejects_unsupported_drivers_and_lookalikes',
            'test_static_pkgconfig_mode_excludes_clang_msvc_driver_dialect'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/pref/pref_test.v' -Names $prefTests
          Invoke-AuditedVTest -Label msvc-static-pkgconfig-negative -Tail @(
            '-run-only',
            ($prefTests -join ','),
            'vlib/v3/pref/pref_test.v'
          )
          $cflagsTests = @(
            'test_v3_user_ldflags_are_final_and_do_not_change_dynamic_plan_when_absent',
            'test_v3_object_mode_ignores_link_only_user_flags',
            'test_v3_cpp_linker_default_driver_follows_c_driver_family',
            'test_v3_cgen_metadata_roundtrips_native_link_requirements'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/driver/c_compiler_flags_test.v' -Names $cflagsTests
          Invoke-AuditedVTest -Label msvc-cpp-driver-family -Tail @(
            '-run-only', ($cflagsTests -join ','),
            'vlib/v3/driver/c_compiler_flags_test.v'
          )
          $msvcPathTests = @(
            'test_msvc_string_flags_evaluates_ecdsa_search_path_macros',
            'test_msvc_string_flags_path_macros_preserve_required_fallback_and_other_flags',
            'test_msvc_string_flags_uses_cached_thirdparty_obj_path',
            'test_msvc_string_flags_rewrites_obj_flags_through_cached_path',
            'test_msvc_string_flags_selects_windows_libcrypto_without_legacy_crypto_name',
            'test_msvc_ordered_pkgconfig_linker_args_keeps_dynamic_flags_on_legacy_path'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v/builder/msvc_windows_test.v' -Names $msvcPathTests
          Invoke-AuditedVTest -Label msvc-path-macros -Tail @(
            '-run-only', ($msvcPathTests -join ','),
            'vlib/v/builder/msvc_windows_test.v'
          )
          $preambleTests = @(
            'test_windows_preserved_sdk_headers_own_cross_file_externs',
            'test_headerless_windows_tcc_uses_one_compat_header_and_sdk_declarations',
            'test_headerless_windows_emits_or_aliases_exact_filetime_platform_struct',
            'test_headerless_windows_tcc_preserves_only_atomic_header_sdk_functions',
            'test_windows_headers_guard_conditional_nls_and_vista_externs',
            'test_windows_system_libc_owns_exact_header_backed_extern_sets',
            'test_windows_system_libc_headers_define_fixed_crt_and_vista_contract',
            'test_unresolved_windows_header_does_not_replace_central_system_ownership',
            'test_system_libc_windows_tcc_atomic_header_does_not_preserve_sdk_functions',
            'test_headerless_windows_non_tcc_keeps_local_sdk_fallbacks',
            'test_headerless_windows_non_tcc_without_builtins_keeps_aligned_externs_owned_by_source',
            'test_non_windows_preamble_does_not_emit_windows_abi_fallbacks'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/gen/c/preamble_test.v' -Names $preambleTests
          Invoke-AuditedVTest -Label msvc-preamble -Tail @(
            '-run-only', ($preambleTests -join ','),
            'vlib/v3/gen/c/preamble_test.v'
          )
          $nativeCTypeTests = @(
            'test_c_type_renders_windows_stat_tag_without_inventing_typedef'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/types/c_type_cache_identity_test.v' -Names $nativeCTypeTests
          Invoke-AuditedVTest -Label msvc-windows-native-c-types -Tail @(
            '-run-only', ($nativeCTypeTests -join ','),
            'vlib/v3/types/c_type_cache_identity_test.v'
          )
          $suffixTests = @(
            'test_c_executable_bin_file_uses_target_postfix'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/driver/implicit_import_test.v' -Names $suffixTests
          Invoke-AuditedVTest -Label msvc-output-suffix -Tail @(
            '-run-only', ($suffixTests -join ','),
            'vlib/v3/driver/implicit_import_test.v'
          )
          $driverTests = @(
            'test_driver_cpp_linker_directive_is_exact_and_non_link_outputs_stay_c'
          )
          Assert-ExactTestDefinitions -Path 'vlib/v3/tests/driver_cli_test.v' -Names $driverTests
          Invoke-AuditedVTest -Label msvc-driver-cli-negative -Tail @(
            '-run-only', ($driverTests -join ','),
            'vlib/v3/tests/driver_cli_test.v'
          )

          & $git diff --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'tracked files changed during the MSVC tests'
          }
          & $git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) {
            throw 'the index changed during the MSVC tests'
          }
          $status = (& $git status --porcelain=v1 --untracked-files=all | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status.Length -ne 0) {
            throw "the worktree is not clean after the MSVC tests: $status"
          }

  issue74-v3-linux:
    name: Issue 74 V3 causal tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        run: make -j4
      - name: Run Issue 74 V3 owners
        shell: bash
        run: |
          set -euo pipefail
          unset CFLAGS LDFLAGS VFLAGS
          export VJOBS=1
          export VTMP="$RUNNER_TEMP/issue74 v3 linux tmp"
          mkdir -p "$VTMP"
          gcc_path="$(command -v gcc)"; gpp_path="$(command -v g++)"
          gcc_version="$($gcc_path --version 2>&1)"; gpp_version="$($gpp_path --version 2>&1)"
          [[ "$gcc_version" =~ GCC|gcc|Free[[:space:]]Software[[:space:]]Foundation|MinGW && "$gcc_version" != *clang* ]]
          [[ "$gpp_version" =~ GCC|gcc|Free[[:space:]]Software[[:space:]]Foundation|MinGW && "$gpp_version" != *clang* ]]

          assert_defs() {
            local file="$1"; shift
            local name count
            for name in "$@"; do
              count="$(awk -v expected="fn ${name}() {" '$0 == expected { n++ } END { print n + 0 }' "$file")"
              [[ "$count" == 1 ]] || { echo "definition count ${file}:${name}=${count}" >&2; return 1; }
            done
          }
          run_owner() {
            local label="$1" file="$2"; shift 2
            local names=("$@") csv log code tee_code summary_count pipeline_status
            assert_defs "$file" "${names[@]}"
            csv="$(IFS=,; printf '%s' "${names[*]}")"
            log="$RUNNER_TEMP/${label}.log"
            set +e
            ./v -old-compiler -gc none -cc "$gcc_path" -c++ "$gpp_path" -no-retry-compilation -path vlib -enable-globals \
              -silent test -run-only "$csv" "$file" 2>&1 | tee "$log"
            pipeline_status=("${PIPESTATUS[@]}")
            code="${pipeline_status[0]}"
            tee_code="${pipeline_status[1]}"
            set -e
            [[ "$code" == 0 ]] || { echo "$label failed with exit code $code" >&2; return 1; }
            [[ "$tee_code" == 0 ]] || { echo "$label log write failed with exit code $tee_code" >&2; return 1; }
            summary_count="$(awk -v needle='1 passed, 1 total' '{ rest=$0; while ((at=index(rest, needle)) > 0) { count++; rest=substr(rest, at + length(needle)) } } END { print count + 0 }' "$log")"
            [[ "$summary_count" == 1 ]] || { echo "$label summary count=$summary_count" >&2; return 1; }
            if grep -Eqi '(^|[^[:alnum:]_])0[[:space:]]+total([^[:alnum:]_]|$)|no tests found|skipped|skipping|panic' "$log"; then
              echo "$label emitted a forbidden no-op/failure marker" >&2
              return 1
            fi
          }

          run_owner v3-pref vlib/v3/pref/pref_test.v \
            test_static_pkgconfig_compiler_owned_names_are_exactly_reserved \
            test_static_pkgconfig_mode_and_canonical_value_matrix \
            test_static_pkgconfig_mode_rejects_unsupported_drivers_and_lookalikes \
            test_static_pkgconfig_mode_excludes_clang_msvc_driver_dialect \
            test_static_pkgconfig_reresolution_replaces_compiler_owned_state \
            test_static_pkgconfig_file_define_selects_only_the_internal_variant \
            test_pkgconfig_executable_candidate_requires_absolute_regular_executable_exe \
            test_pkgconfig_executable_resolves_only_windows_exe \
            test_comptime_pkgconfig_value_uses_pkgconfig_runner
          run_owner v3-parser-pkgconfig vlib/v3/parser/comptime_pkgconfig_test.v \
