name: CI macOS

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      # vlib/v3/** is intentionally NOT ignored: V3 is the default compiler on
      # macOS, so changes to it must run this suite (with the fallback disabled).
      - '**.md'
      - '**.yml'
      - '!**/macos_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'
  pull_request:
    paths-ignore:
      # vlib/v3/** is intentionally NOT ignored: V3 is the default compiler on
      # macOS, so changes to it must run this suite (with the fallback disabled).
      - '**.md'
      - '**.yml'
      - '!**/macos_ci.yml'
      - 'cmd/tools/**'
      - '!cmd/tools/builders/**.v'

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  clang-macos:
    strategy:
      matrix:
        # V3 (vlib/v3, `-new-compiler`) is the default compiler on macOS, so
        # exercise it on every arm64 (Apple-silicon) runner image, not just one.
        os: [macos-14, macos-15, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 151
    env:
      VFLAGS: -cc clang
      VTEST_SHOW_LONGEST_BY_RUNTIME: 3
      VTEST_SHOW_LONGEST_BY_COMPTIME: 3
      VTEST_SHOW_LONGEST_BY_TOTALTIME: 3
      # V3 is the default compiler on macOS; disable the V3->V1 fallback for every
      # eligible V3 build so a regression fails CI directly. The `.vsh` runner is
      # intentionally compiled by V1; the canary below verifies V3 dispatch itself.
      V_MACOS_V3_NO_FALLBACK: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ matrix.os }}-${{ hashFiles('.github/workflows/macos_ci.yml', 'ci/macos_ci.vsh') }}
          restore-keys: |
            brew-${{ matrix.os }}-
      - name: Build V
        # `make` runs bootstrap helpers before the V3 canary; `.vsh` helpers intentionally
        # use V1, and other helpers may need the compatibility fallback. Clear the guard
        # for this bootstrap step; later eligible builds and the canary retain it.
        env:
          V_MACOS_V3_NO_FALLBACK: 0
        run: make -j4 && ./v symlink
      - name: Assert V3 is the default compiler (fail if V1 is silently used)
        run: |
          set -uo pipefail
          printf 'fn main() { println(6 * 7) }\n' > "$RUNNER_TEMP/v3_canary.v"
          V_MACOS_V3_NO_FALLBACK=1 ./v -v run "$RUNNER_TEMP/v3_canary.v" > "$RUNNER_TEMP/v3_canary.out" 2>&1 || true
          cat "$RUNNER_TEMP/v3_canary.out"
          grep -q 'V3 compiler in process' "$RUNNER_TEMP/v3_canary.out" || { echo '::error::V3 was NOT dispatched on macOS — the program was compiled by V1'; exit 1; }
          grep -qx '42' "$RUNNER_TEMP/v3_canary.out" || { echo '::error::the V3-compiled canary did not build/run correctly'; exit 1; }
          if grep -qiE 'retrying with .-old-compiler|compatibility fallback|used the stable compiler' "$RUNNER_TEMP/v3_canary.out"; then echo '::error::V3 silently fell back to V1'; exit 1; fi
          echo 'OK: V3 compiled and ran this program in-process on macOS, with the fallback disabled'
      - name: Pkg-config regressions (Clang, no static executable)
        run: |
          set -euo pipefail
          for test in \
            vlib/v/pkgconfig/pkgconfig_static_test.v \
            vlib/v/checker/pkgconfig_static_mode_test.v \
            vlib/v/checker/pkgconfig_cross_compile_test.v \
            vlib/v/builder/pkgconfig_link_segment_test.v
          do
            ./v -cc clang -no-retry-compilation test "$test"
          done
      - name: Legacy gg import multiwindow isolation
        run: ./v test vlib/gg/legacy_import_multiwindow_isolation_test.v
      - name: Prepare multiwindow process-tree watchdog
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/multiwindow_ci_watchdog.v" <<'EOF'
          module main

          import gg.testdata.multiwindow_probe_watchdog
          import os
          import time

          fn main() {
              run_ci_watchdog() or {
                  eprintln(err.msg())
                  exit(1)
              }
          }

          fn run_ci_watchdog() ! {
              if os.args.len < 4 {
                  return error('usage: multiwindow_ci_watchdog timeout-seconds expected-final-line executable [args...]')
              }
              timeout_seconds := os.args[1].int()
              if timeout_seconds <= 0 {
                  return error('multiwindow CI watchdog timeout must be positive')
              }
              expected_final_line := os.args[2]
              gate_path := os.join_path(os.temp_dir(), 'multiwindow_ci_gate_${os.getpid()}_${time.now().unix_nano()}')
              defer {
                  os.rm(gate_path) or {}
              }
              result := multiwindow_probe_watchdog.run(
                  executable: os.args[3]
                  args:       os.args[4..]
                  timeout:    timeout_seconds * time.second
                  start_file: gate_path
              )!
              if result.stdout != '' {
                  print(result.stdout)
              }
              if result.stderr != '' {
                  eprint(result.stderr)
              }
              if result.timed_out {
                  return error('multiwindow CI child timed out after ${timeout_seconds} seconds')
              }
              if !result.reaped {
                  return error('multiwindow CI child leader was not reaped')
              }
              if !result.confinement_empty {
                  return error('multiwindow CI child process confinement is not empty')
              }
              if result.forced_cleanup {
                  return error('multiwindow CI child required forced cleanup')
              }
              if result.exit_code != 0 {
                  return error('multiwindow CI child exited with ${result.exit_code}')
              }
              if expected_final_line == '-' {
                  return
              }
              mut actual_final_line := ''
              for line in result.stdout.split_into_lines() {
                  if line.trim_space() != '' {
                      actual_final_line = line.trim_space()
                  }
              }
              if actual_final_line != expected_final_line {
                  return error('multiwindow CI final record mismatch: expected `${expected_final_line}`, got `${actual_final_line}`')
              }
          }
          EOF
          ./v -cc clang -o "$RUNNER_TEMP/multiwindow_ci_watchdog" "$RUNNER_TEMP/multiwindow_ci_watchdog.v"
      - name: Native operation proof (explicit V1 compatibility gate)
        env:
          V_MACOS_V3_NO_FALLBACK: '1'
          VGG_MULTIWINDOW_RUNTIME_PROBES: '1'
          VGG_MULTIWINDOW_RUNTIME_BACKEND: appkit
          VGG_MULTIWINDOW_EXAMPLE_UNATTENDED: appkit
          V_MULTIWINDOW_PROBE_BACKEND: appkit
        run: |
          set -euo pipefail

          source='vlib/x/multiwindow/native_operation_proof_test.v'
          expected_source_sha256='56931b74007d11de80300c16979d0b8ae30345d1827aa64ffe1c7748d5bdfb4b'
          if [[ "${VFLAGS:-}" != '-cc clang' ]]; then
            echo "native operation V1 compatibility gate VFLAGS mismatch" >&2
            exit 1
          fi
          if [[ ! -s "$source" ]]; then
            echo "native operation V1 compatibility gate source is missing or empty" >&2
            exit 1
          fi
          actual_source_sha256="$(shasum -a 256 "$source" | awk '{print $1}')"
          if [[ "$actual_source_sha256" != "$expected_source_sha256" ]]; then
            echo "native operation V1 compatibility gate source hash mismatch" >&2
            exit 1
          fi
          source_test_count="$(grep -Ec '^fn test_[A-Za-z0-9_]+\(\) \{$' "$source")"
          if [[ "$source_test_count" != '53' ]]; then
            echo "native operation V1 compatibility gate source test count mismatch" >&2
            exit 1
          fi
          if [[ -n "${V_MACOS_V3_RETRY:-}" \
            || -n "${V_MACOS_V3_FALLBACK_FILE:-}" \
            || -n "${V_MACOS_V3_C_ERROR_DIR:-}" \
            || -n "${VTEST_ONLY:-}" \
            || -n "${VTEST_ONLY_FN:-}" \
            || -n "${VTEST_RUNNER:-}" \
            || -n "${V_MULTIWINDOW_NATIVE_PROOF_EGL_BAD_DISPLAY_CHILD:-}" \
            || -n "${V_MULTIWINDOW_NATIVE_PROOF_APPKIT_ORDINAL_EXHAUSTION_CHILD:-}" ]]; then
            echo "native operation V1 compatibility gate inherited selector mismatch" >&2
            exit 1
          fi

          "$RUNNER_TEMP/multiwindow_ci_watchdog" 300 - \
            ./v -old-compiler -no-retry-compilation -cc clang \
            -d gg_multiwindow -d sokol_metal test "$source"
          printf 'MULTIWINDOW_MACOS_NATIVE_OPERATION_PROOF status=PASS route=V1_COMPAT sha256=%s tests=%s\n' \
            "$actual_source_sha256" "$source_test_count"
      - name: Multiwindow Metal regressions and runtime probes
        # Some multiwindow tests still exercise V3-incompatible constructs. The
        # direct canary above remains strict; this lane also verifies fallback.
        env:
          V_MACOS_V3_NO_FALLBACK: 0
          VGG_MULTIWINDOW_RUNTIME_PROBES: '1'
          VGG_MULTIWINDOW_RUNTIME_BACKEND: appkit
          VGG_MULTIWINDOW_EXAMPLE_UNATTENDED: appkit
          V_MULTIWINDOW_PROBE_BACKEND: appkit
        run: |
          set -euo pipefail

          ./v -cc clang -d gg_multiwindow -d sokol_metal \
            -o /tmp/gg_multiwindow_metal examples/gg/multiwindow.v
          ./v -cc clang -d gg_multiwindow -d sokol_metal \
            -o /tmp/gg_multiwindow_render_runtime_metal examples/gg/multiwindow_render_runtime.v

          tests=(
            vlib/x/multiwindow/event_sequence_exhaustion_test.v
            vlib/x/multiwindow/event_terminal_delivery_test.v
            vlib/x/multiwindow/internal_fault_matrix_test.v
            vlib/x/multiwindow/multiwindow_test.v
            vlib/x/multiwindow/render_scheduler_test.v
            vlib/x/multiwindow/render_target_lease_test.v
            vlib/x/multiwindow/service_mock_test.v
            vlib/x/multiwindow/service_native_appkit_contract_red_test.v
            vlib/x/multiwindow/service_native_appkit_final_nonreadback_red_test.v
            vlib/x/multiwindow/service_native_appkit_nonreadback_test.v
            vlib/x/multiwindow/service_native_appkit_readback_metal_red_test.v
            vlib/x/multiwindow/teardown_contract_test.v
            vlib/sokol/gfx/metal_private_hook_contract_test.v
            vlib/gg/multiwindow_api_d_gg_multiwindow_test.v
            vlib/gg/multiwindow_appkit_readback_d_gg_multiwindow_test.v
            vlib/gg/multiwindow_buffer_cleanup_d_gg_multiwindow_test.v
            vlib/gg/multiwindow_render_fault_matrix_d_gg_multiwindow_test.v
            vlib/gg/multiwindow_render_runtime_contract_test.v
            vlib/gg/frame_pacing_test.v
            vlib/gg/draw_fns_api_test.v
            vlib/gg/draw_rect_empty_test.v
          )
          native_operation_proof='vlib/x/multiwindow/native_operation_proof_test.v'
          if [[ "${#tests[@]}" -ne 21 ]]; then
            echo "multiwindow Metal test inventory cardinality mismatch" >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            if [[ "$test" == "$native_operation_proof" ]]; then
              echo "native operation proof leaked into the strict V3 Metal inventory" >&2
              exit 1
            fi
          done
          for test in "${tests[@]}"; do
            "$RUNNER_TEMP/multiwindow_ci_watchdog" 300 - \
              ./v -cc clang -d gg_multiwindow -d sokol_metal test "$test"
          done

          "$RUNNER_TEMP/multiwindow_ci_watchdog" 300 - \
            ./v -cc clang test vlib/gg/multiwindow_services_contract_test.v

          "$RUNNER_TEMP/multiwindow_ci_watchdog" 120 \
            '{"example":"multiwindow_render_runtime","status":"PASS","cleanup":"complete"}' \
            /tmp/gg_multiwindow_render_runtime_metal

          "$RUNNER_TEMP/multiwindow_ci_watchdog" 120 \
            '{"example":"multiwindow","status":"PASS","cleanup":"complete"}' \
            /tmp/gg_multiwindow_metal
      - name: Test AppKit GLCore rejection guard
        run: ./v -d gg_multiwindow -d darwin_sokol_glcore33 test vlib/x/multiwindow/multiwindow_test.v
      - name: Test symlink
        run: v run ci/macos_ci.vsh test_symlink
      - name: v doctor
        run: v run ci/macos_ci.vsh v_doctor
      - name: Build v with -prealloc
        run: v run ci/macos_ci.vsh build_v_with_prealloc
      - name: Test cross compilation to Linux
        run: v run ci/macos_ci.vsh test_cross_compilation
      - name: Test inline assembly on macos
        run: v run ci/macos_ci.vsh test_inline_assembly
      - name: Build V with -cstrict
        run: v run ci/macos_ci.vsh build_with_cstrict
      - name: All code is formatted
        run: v run ci/macos_ci.vsh all_code_is_formatted
      - name: Run sanitizers
        run: v run ci/macos_ci.vsh run_sanitizers
      - name: Build V using V
        run: v run ci/macos_ci.vsh build_using_v
      - name: Verify `v test` works
        run: v run ci/macos_ci.vsh verify_v_test_works
      - name: Install iconv for encoding.iconv
        run: v run ci/macos_ci.vsh install_iconv
      - name: Test pure V math module
        run: v run ci/macos_ci.vsh test_pure_v_math_module
      - name: Self tests
        run: v run ci/macos_ci.vsh self_tests
      - name: Build examples
        run: v run ci/macos_ci.vsh build_examples
      - name: Build hello_world with -autofree
        run: v run ci/macos_ci.vsh build_hello_world_autofree
      - name: Build tetris with -autofree
        run: v run ci/macos_ci.vsh build_tetris_autofree
      - name: Build blog tutorial with -autofree
        run: v run ci/macos_ci.vsh build_blog_autofree
      - name: Build examples with -prod
        run: v run ci/macos_ci.vsh build_examples_prod
      - name: Build examples with V build with tcc
        run: v run ci/macos_ci.vsh build_examples_v_compiled_with_tcc
      ##      - name: V self compilation with -usecache
      ##        run: v run ci/macos_ci.vsh v_self_compilation_usecache
      - name: V self compilation with -parallel-cc
        run: v run ci/macos_ci.vsh v_self_compilation_parallel_cc
      - name: Test password input
        run: v run ci/macos_ci.vsh test_password_input
      - name: Test readline
        run: v run ci/macos_ci.vsh test_readline

  issue74-v1-macos-clang:
    name: Issue 74 V1 causal tests (macOS Clang)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build V
        env:
          V_MACOS_V3_NO_FALLBACK: 0
        run: make -j4
      - name: Run Issue 74 V1 owners
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          cc_path="$(command -v clang)"
          cpp_path="$(command -v clang++)"
          cc_version="$($cc_path --version)"
          cpp_version="$($cpp_path --version)"
          [[ "$cc_version" == *clang* && "$cc_version" != *clang-cl* ]]
          [[ "$cpp_version" == *clang* && "$cpp_version" != *clang-cl* ]]
          unset CFLAGS LDFLAGS VFLAGS
          export VJOBS=1
          export VTMP="$RUNNER_TEMP/issue74 v1 macos tmp"
          export VFLAGS="-old-compiler -cc ${cc_path} -c++ ${cpp_path} -no-retry-compilation"
          mkdir -p "$VTMP"
          export ISSUE74_MAC_ROUTE_LOG="$RUNNER_TEMP/issue74-mac-route.log"
          : > "$ISSUE74_MAC_ROUTE_LOG"

          assert_defs() {
            local file="$1"; shift
            local name count
            for name in "$@"; do
              count="$(awk -v expected="fn ${name}() {" '$0 == expected { n++ } END { print n + 0 }' "$file")"
              [[ "$count" == 1 ]] || { echo "definition count ${file}:${name}=${count}" >&2; return 1; }
            done
          }
          run_owner() {
            local label="$1" file="$2"; shift 2
            local names=("$@") csv log text
            assert_defs "$file" "${names[@]}"
            csv="$(IFS=,; printf '%s' "${names[*]}")"
            log="$RUNNER_TEMP/${label}.log"
            ./v -old-compiler -cc "$cc_path" -c++ "$cpp_path" -no-retry-compilation \
              -silent test -run-only "$csv" "$file" 2>&1 | tee "$log"
            text="$(<"$log")"
            [[ "$text" == *"1 passed, 1 total"* ]]
            [[ "$text" != *"no tests found"* && "$text" != *"skipping #linker c++"* ]]
          }

          run_owner macos-routing cmd/v/macos_v3_test.v \
            test_macos_v3_relevant_command_selects_user_compilation_and_tests \
            test_macos_v3_fastc_rejects_incompatible_preferences
          run_owner v1-cc vlib/v/builder/cc_test.v \
            test_cc_from_string_keeps_historical_clang_cl_classification \
            test_resolved_tcc_wrapper_recomputes_pkgconfig_mode_as_dynamic \
            test_resolved_gnu_wrappers_keep_pkgconfig_mode_static \
            test_cpp_linker_c_source_args_wrap_only_c_sources \
            test_cpp_linker_marker_removes_only_lto_and_c_language_standard_tokens \
            test_cpp_linker_rejects_msvc_driver_mode_from_environment_flags \
            test_cpp_linker_forces_generated_c_but_not_object_inputs \
            test_cpp_linker_driver_classifier_fails_closed_for_unknown_commands \
            test_cpp_linker_preserves_objective_c_for_generated_darwin_source \
            test_no_cpp_linker_keeps_legacy_objective_c_generated_source_args \
            test_cpp_linker_does_not_change_builds_without_directive
          run_owner v1-pkgconfig vlib/v/checker/pkgconfig_static_mode_test.v \
            test_static_pkgconfig_segment_stays_ordered_after_target
          run_owner v1-owned-values vlib/v/pref/compiler_owned_values_test.v \
            test_static_pkgconfig_compiler_owned_names_are_narrowly_reserved
          run_owner v1-pref vlib/v/pref/pref_test.v \
            test_static_pkgconfig_compiler_value_filters_reserved_conditional_files \
            test_pkgconfig_mode_salts_cache_without_salt_for_all_ldflags \
            test_msvc_style_clang_never_activates_static_pkgconfig_fact_or_file \
            test_gnu_style_clang_and_driver_mode_lookalike_keep_static_pkgconfig \
            test_static_pkgconfig_compiler_value_exact_token_matrix \
            test_static_pkgconfig_compiler_value_rejects_static_lookalikes \
            test_other_v_namespaced_compile_values_remain_user_controlled
          run_owner v1-comptime vlib/v/tests/comptime/comptime_static_pkgconfig_value_test.v \
            test_static_pkgconfig_compiler_value_is_canonical_in_a_dynamic_build \
            test_static_pkgconfig_compiler_owned_names_cannot_be_overridden
          run_owner v1-checker vlib/v/checker/linker_directive_test.v \
            test_linker_cplusplus_is_idempotent test_linker_cplusplus_in_inactive_branch_is_ignored \
            test_linker_rejects_every_value_except_exact_cplusplus
          run_owner v1-fake-link vlib/v/builder/pkgconfig_link_segment_test.v \
            test_cpp_linker_fake_driver_direct_rsp_prod_and_parallel_paths \
            test_cpp_linker_rejects_unsupported_or_missing_final_drivers
          run_owner v1-real-link vlib/v/builder/linker_directive_integration_test.v \
            test_cpp_linker_real_drivers_keep_c_inputs_and_supply_their_runtime \
            test_cpp_linker_compile_only_paths_do_not_probe_the_cpp_driver \
            test_cpp_linker_cross_target_executable_reports_before_driver_selection

          fmt_log="$RUNNER_TEMP/issue74-fmt.log"
          VTEST_ONLY=fmt_keep_test.v,linker_directive_keep.vv \
            ./v -old-compiler -cc "$cc_path" -no-retry-compilation -no-parallel -nocache -gc none -silent test \
              -run-only test_fmt vlib/v/fmt/fmt_keep_test.v 2>&1 | tee "$fmt_log"
          grep -Fq '1 passed, 1 total' "$fmt_log"
          ! grep -Fq 'no tests found with VTEST_ONLY' "$fmt_log"
          git diff --exit-code
          git diff --cached --exit-code
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
      - name: Show Issue 74 macOS route diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          route_log="$RUNNER_TEMP/issue74-mac-route.log"
          [[ -f "$route_log" ]]
          line_count="$(wc -l < "$route_log")"
          [[ "$line_count" -le 300 ]]
          cat "$route_log"
      - name: Upload Issue 74 macOS route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue74-macos-route-${{ github.run_id }}-${{ github.job }}
          path: ${{ runner.temp }}/issue74-mac-route.log
          if-no-files-found: error
          retention-days: 7
