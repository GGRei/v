            -ExpectedNativeTestSha256 '5301f2226a29a6169d31f3cdc2055235504ba9ca0cbfad9042c40a52fb0dcb85' `
            -ExpectedPublicTestSha256 'd08eafb919ae97b185fc480c22f6d990973396152e9a0b3a01035c3e9a30275c' `
            -ExpectedNoOptProbeSha256 '288f148ca15b6694481f117c03be5f80c4045baf76d3b0e90db61b5e0596741c' `
            -ExpectedServiceBackendSha256 '8515db375427e3b145052567582ead24a18c0b35fb286d15ff7d704d35ae240b' `
            -ExpectedWin32BackendSha256 '4b854e9dd019bb8193057c08aaa0a8185096f165afff99d7ed519c5442e0e52e' `
            -ExpectedWin32ServiceBackendSha256 'e2e05250d55fd3b0b2739ba592f96117e614ab19eb2f7a550258ee68ab9abd16' `
            -ExpectedWin32ServiceNativeSha256 '4e6c94be8b7ad24a33291ca19cd0d92097dd5b2d79315e1829caadb077e9ad73' `
            -ExpectedRedSurfaceSha256 '04b271a1ece4844a60a338358ec292d1e59448b962f6be7fb9c5765206678a7e' `
            -ExpectedGreenSurfaceSha256 '373ca007c31c803290297305fa6cee7390b2f5bfe90ac0a243c563a900b01e2d' `
