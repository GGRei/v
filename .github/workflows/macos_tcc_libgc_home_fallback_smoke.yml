            test "$(cat "$bundle/lib/libgc_build_source_hash.txt")" = 39b0d4ecf9bdc65a971e9423f4080d40814da6ce
            test "$(cat "$bundle/lib/libgc_build_libatomic_ops_source_hash.txt")" = d007246aa70fef4f9bfcb84bcc5e6a97653b3d86
            test "$(cat "$bundle/lib/libgc_build_recipe_version.txt")" = 2
            test "$(cat "$bundle/build_macosx_deployment_target.txt")" = 10.13
            test "$(stat -f '%z' "$bundle/bundle_checksums.txt")" -eq 477
            test "$(shasum -a 256 "$bundle/bundle_checksums.txt" | awk '{print $1}')" = \
              46ae1db98501ff724679eba6856c068f168df1565633a489d81d7b270391965f
            test "$(shasum -a 256 "$bundle/bundle_checksums.txt" | awk '{print $1}')" = \
