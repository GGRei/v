      - name: Compile and run explicit XDG and fresh HOME fallback smokes
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/part-c-smoke.env"
          source "$RUNNER_TEMP/tccbin-baseline.env"

          clean_env=(
            -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY
            -u http_proxy -u https_proxy -u all_proxy
          )
          while IFS= read -r variable; do
            case "$variable" in
              DYLD_*) clean_env+=(-u "$variable") ;;
            esac
          done < <(compgen -e)

          smoke_source="$RUNNER_TEMP/part-c-real-smoke.v"
          printf '%s\n' \
            'module main' \
            '' \
            'fn main() {' \
            '    mut values := []int{cap: 1024}' \
            '    for i in 0 .. 1024 {' \
            '        values << i' \
            '    }' \
            '    gc_collect()' \
            '    println("part-c-ok:${values[1023]}")' \
            '}' > "$smoke_source"
          if grep -Fq '#flag' "$smoke_source"; then
            echo '::error::the integrated Part C source must not contain manual linker flags'
            exit 1
          fi

          tcc="$VROOT/thirdparty/tcc/tcc.exe"
          smoke_binary="$RUNNER_TEMP/part-c-real-smoke"
          compile_log="$RUNNER_TEMP/part-c-real-smoke.compile.log"
          test -f "$tcc"
          test ! -L "$tcc"
          test -x "$tcc"
          set +e
          (
            cd "$VROOT"
            env "${clean_env[@]}" \
              XDG_DATA_HOME="$XDG" \
              VCACHE="$SMOKE_VCACHE" \
              GIT_ALLOW_PROTOCOL=file \
              ./v -cc tcc -gc boehm -showcc \
              -no-retry-compilation -no-rsp -nocache \
              -o "$smoke_binary" "$smoke_source"
          ) 2>&1 | tee "$compile_log"
          compile_status=${PIPESTATUS[0]}
          set -e
          test "$compile_status" -eq 0
          test -f "$smoke_binary"
          test ! -L "$smoke_binary"
          test -x "$smoke_binary"
          if grep -Eiq 'fallback|retry' "$compile_log"; then
            echo '::error::unexpected compiler fallback/retry indication'
            exit 1
          fi

          source_lib_dir="$VROOT/thirdparty/tcc/lib"
          source_dylib="$source_lib_dir/libgc.dylib"
          source_rpath="-Wl,-rpath,$source_lib_dir"
          store_dir="$XDG/v-tcc-libgc-v1/$TCCBIN_LIBGC_DYLIB_SHA256"
          store_dylib="$store_dir/libgc.dylib"
          store_rpath="-Wl,-rpath,$store_dir"
          env \
            TCC_EXPECTED="$tcc" \
            SOURCE_DYLIB="$source_dylib" \
            SOURCE_RPATH="$source_rpath" \
            STORE_DYLIB="$store_dylib" \
            STORE_RPATH="$store_rpath" \
            SMOKE_BINARY="$smoke_binary" \
            python3 - "$compile_log" <<'PY'
          import collections
          import os
          import pathlib
          import shlex
          import sys

          prefix = '> C compiler cmd: '
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          commands = [line[len(prefix):] for line in lines if line.startswith(prefix)]
          if len(commands) != 1:
              raise SystemExit(f'expected exactly one C compiler command, found {len(commands)}')
          try:
              argv = shlex.split(commands[0], posix=True)
          except ValueError as error:
              raise SystemExit(f'could not parse C compiler command: {error}')
          if not argv or argv[0] != os.environ['TCC_EXPECTED']:
              raise SystemExit(f'wrong C compiler argv[0]: {argv[0] if argv else "<empty>"}')

          counts = collections.Counter(argv)
          for token, label in (
              (os.environ['STORE_DYLIB'], 'store dylib'),
              (os.environ['STORE_RPATH'], 'store rpath'),
          ):
              if counts[token] != 1:
                  raise SystemExit(f'expected exactly one {label} token, found {counts[token]}')
          for token, label in (
              (os.environ['SOURCE_DYLIB'], 'source dylib'),
              (os.environ['SOURCE_RPATH'], 'source rpath'),
          ):
              if counts[token] != 0:
                  raise SystemExit(f'forbidden {label} token remains in compiler command')
          if any('libgc.a' in token for token in argv):
              raise SystemExit('compiler command contains libgc.a')
          if counts['-lgc'] != 0:
              raise SystemExit('compiler command contains -lgc')
          if any(token.startswith('@') for token in argv):
              raise SystemExit('compiler command contains a response-file token')

          binary = os.environ['SMOKE_BINARY']
          if counts['-o'] != 1:
              raise SystemExit(f'expected exactly one -o token, found {counts["-o"]}')
          joined_output_options = [token for token in argv if token != '-o' and token.startswith('-o')]
          if joined_output_options:
              raise SystemExit(f'joined -o option is forbidden: {joined_output_options}')
          output_index = argv.index('-o')
          if output_index + 1 >= len(argv) or argv[output_index + 1] != binary:
              raise SystemExit('the sole -o token does not target the exact smoke binary')
          compiler_names = {'cc', 'gcc', 'clang', 'clang++', 'tcc', 'tcc.exe'}
          unexpected = [token for token in argv[1:] if os.path.basename(token) in compiler_names]
          if unexpected:
              raise SystemExit(f'compiler command names a different compiler: {unexpected}')
          PY

          store_root="$XDG/v-tcc-libgc-v1"
          content_dir="$store_root/$TCCBIN_LIBGC_DYLIB_SHA256"
          store_object="$content_dir/libgc.dylib"
          source_target="$VROOT/thirdparty/tcc/lib/libgc.1.dylib"
          test -d "$store_root"
          test ! -L "$store_root"
          test -d "$content_dir"
          test ! -L "$content_dir"
          test -f "$store_object"
          test ! -L "$store_object"
          test "$(find "$content_dir" -mindepth 1 -maxdepth 1 -print | awk 'END { print NR + 0 }')" -eq 1
          test "$(stat -f '%u' "$store_root")" = "$(id -u)"
          test "$(stat -f '%u' "$content_dir")" = "$(id -u)"
          test "$(stat -f '%u' "$store_object")" = "$(id -u)"
          test "$(stat -f '%Lp' "$store_root")" = 700
          test "$(stat -f '%Lp' "$content_dir")" = 700
          test "$(stat -f '%Lp' "$store_object")" = 700
          test "$(shasum -a 256 "$store_object" | awk '{print $1}')" = "$TCCBIN_LIBGC_DYLIB_SHA256"
          test -f "$source_target"
          test ! -L "$source_target"
          test "$(shasum -a 256 "$source_target" | awk '{print $1}')" = "$TCCBIN_LIBGC_DYLIB_SHA256"
          cmp -s "$source_target" "$store_object"

          runtime_stdout="$RUNNER_TEMP/part-c-real-smoke.stdout"
          set +e
          env "${clean_env[@]}" \
            XDG_DATA_HOME="$XDG" \
            VCACHE="$SMOKE_VCACHE" \
            GIT_ALLOW_PROTOCOL=file \
            "$smoke_binary" > "$runtime_stdout"
          runtime_status=$?
          set -e
          test "$runtime_status" -eq 0
          test "$(LC_ALL=C wc -l < "$runtime_stdout" | tr -d ' ')" -eq 1
          test "$(sed -n '1p' "$runtime_stdout")" = part-c-ok:1023

          # The explicit XDG lane above must not touch the fresh HOME fallback.
          test ! -e "$SMOKE_HOME/.local"

          compile_home_lane() {
            local mode=$1
            local binary=$2
            local log=$3
            test ! -e "$binary"
            test ! -e "$log"
            set +e
            (
              cd "$VROOT"
              case "$mode" in
                unset)
                  env "${clean_env[@]}" \
                    -u XDG_DATA_HOME \
                    HOME="$SMOKE_HOME" \
                    VCACHE="$SMOKE_VCACHE" \
                    SMOKE_HOME_EXPECTED="$SMOKE_HOME" \
                    SMOKE_VCACHE_EXPECTED="$SMOKE_VCACHE" \
                    GIT_ALLOW_PROTOCOL=file \
                    bash -c '
                      set -euo pipefail
                      test "${XDG_DATA_HOME+x}" != x
                      test "$HOME" = "$SMOKE_HOME_EXPECTED"
                      test "$VCACHE" = "$SMOKE_VCACHE_EXPECTED"
                      unset SMOKE_HOME_EXPECTED
                      unset SMOKE_VCACHE_EXPECTED
                      exec "$@"
                    ' bash \
                    ./v -cc tcc -gc boehm -showcc \
                      -no-retry-compilation -no-rsp -nocache \
                      -o "$binary" "$smoke_source"
                  ;;
                empty)
                  env "${clean_env[@]}" \
                    XDG_DATA_HOME= \
                    HOME="$SMOKE_HOME" \
                    VCACHE="$SMOKE_VCACHE" \
                    SMOKE_HOME_EXPECTED="$SMOKE_HOME" \
                    SMOKE_VCACHE_EXPECTED="$SMOKE_VCACHE" \
                    GIT_ALLOW_PROTOCOL=file \
                    bash -c '
                      set -euo pipefail
                      test "${XDG_DATA_HOME+x}" = x
                      test -z "$XDG_DATA_HOME"
                      test "$HOME" = "$SMOKE_HOME_EXPECTED"
                      test "$VCACHE" = "$SMOKE_VCACHE_EXPECTED"
                      unset SMOKE_HOME_EXPECTED
                      unset SMOKE_VCACHE_EXPECTED
                      exec "$@"
                    ' bash \
                    ./v -cc tcc -gc boehm -showcc \
                      -no-retry-compilation -no-rsp -nocache \
                      -o "$binary" "$smoke_source"
                  ;;
                *)
                  echo "::error::unknown HOME fallback compile mode: $mode" >&2
                  exit 1
                  ;;
              esac
            ) 2>&1 | tee "$log"
            local statuses=("${PIPESTATUS[@]}")
            set -e
            test "${#statuses[@]}" -eq 2
            test "${statuses[0]}" -eq 0
            test "${statuses[1]}" -eq 0
            test -f "$binary"
            test ! -L "$binary"
            test -x "$binary"
            test -f "$log"
            test ! -L "$log"
            test -s "$log"
            if grep -Eiq 'fallback compiler|retrying|recompilation loop' "$log"; then
              echo "::error::$mode HOME lane observed compiler fallback/retry" >&2
              exit 1
            fi
          }

          attest_home_store() {
            local home_local="$SMOKE_HOME/.local"
            local data_base="$home_local/share"
            local root="$data_base/v-tcc-libgc-v1"
            local content="$root/$TCCBIN_LIBGC_DYLIB_SHA256"
            local object="$content/libgc.dylib"
            local directory
            for directory in "$SMOKE_HOME" "$home_local" "$data_base" "$root" "$content"; do
              test -d "$directory"
              test ! -L "$directory"
              test "$(stat -f '%u' "$directory")" = "$(id -u)"
              test "$(stat -f '%Lp' "$directory")" = 700
            done
            test "$(find "$SMOKE_HOME" -mindepth 1 -maxdepth 1 -print)" = "$home_local"
            test "$(find "$home_local" -mindepth 1 -maxdepth 1 -print)" = "$data_base"
            test "$(find "$data_base" -mindepth 1 -maxdepth 1 -print)" = "$root"
            test "$(find "$root" -mindepth 1 -maxdepth 1 -print)" = "$content"
            test "$(find "$content" -mindepth 1 -maxdepth 1 -print)" = "$object"
            test -f "$object"
            test ! -L "$object"
            test "$(stat -f '%u' "$object")" = "$(id -u)"
            test "$(stat -f '%Lp' "$object")" = 700
            test "$(shasum -a 256 "$object" | awk '{print $1}')" = \
              "$TCCBIN_LIBGC_DYLIB_SHA256"
            test -z "$(find "$SMOKE_HOME" -maxdepth 6 -type l -print -quit)"
            test -z "$(find "$root" -maxdepth 3 -name '.libgc.dylib.tmp.*' -print -quit)"
            cmp -s "$source_target" "$object"
          }

          inventory_home_store() {
            local root=$1
            local path relative mode uid inode mtime size digest
            local LC_ALL=C
            export LC_ALL
            test -d "$root"
            test ! -L "$root"
            find "$root" -print0 | LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                if [ "$path" = "$root" ]; then
                  relative=.
                else
                  relative=${path#"$root"/}
                fi
                if [ -L "$path" ]; then
                  printf '::error::unexpected symlink in HOME store inventory: %q\n' \
                    "$relative" >&2
                  exit 1
                fi
                mode=$(stat -f '%Lp' "$path")
                uid=$(stat -f '%u' "$path")
                inode=$(stat -f '%i' "$path")
                mtime=$(stat -f '%m' "$path")
                if [ -d "$path" ]; then
                  printf 'D mode=%q uid=%q inode=%q mtime=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$relative"
                elif [ -f "$path" ]; then
                  size=$(stat -f '%z' "$path")
                  digest=$(shasum -a 256 "$path" | awk '{print $1}')
                  printf 'F mode=%q uid=%q inode=%q mtime=%q size=%q sha256=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$size" "$digest" "$relative"
                else
                  printf '::error::unsupported HOME store inventory entry: %q\n' \
                    "$relative" >&2
                  exit 1
                fi
              done
          }

          source_target="$VROOT/thirdparty/tcc/lib/libgc.1.dylib"
          home_data_base="$SMOKE_HOME/.local/share"
          home_store_root="$home_data_base/v-tcc-libgc-v1"
          home_store_dir="$home_store_root/$TCCBIN_LIBGC_DYLIB_SHA256"
          home_store_object="$home_store_dir/libgc.dylib"
          home_unset_binary="$RUNNER_TEMP/home-fallback-unset-xdg-smoke"
          home_unset_log="$RUNNER_TEMP/home-fallback-unset-xdg-smoke.compile.log"
          home_empty_binary="$RUNNER_TEMP/home-fallback-empty-xdg-smoke"
          home_empty_log="$RUNNER_TEMP/home-fallback-empty-xdg-smoke.compile.log"
          test "$home_unset_binary" != "$home_empty_binary"
          test "$home_unset_log" != "$home_empty_log"

          compile_home_lane unset "$home_unset_binary" "$home_unset_log"
          attest_home_store
          home_store_inventory_before="$RUNNER_TEMP/home-fallback-store.before.inventory"
          test ! -e "$home_store_inventory_before"
          inventory_home_store "$home_store_root" > "$home_store_inventory_before"
          test -s "$home_store_inventory_before"
          home_object_inode=$(stat -f '%i' "$home_store_object")
          home_object_mtime=$(stat -f '%m' "$home_store_object")
          home_object_sha256=$(shasum -a 256 "$home_store_object" | awk '{print $1}')
          home_inventory_sha256=$(shasum -a 256 "$home_store_inventory_before" | awk '{print $1}')
          test "$home_object_sha256" = "$TCCBIN_LIBGC_DYLIB_SHA256"

          compile_home_lane empty "$home_empty_binary" "$home_empty_log"
          attest_home_store
          home_store_inventory_after="$RUNNER_TEMP/home-fallback-store.after.inventory"
          test ! -e "$home_store_inventory_after"
          inventory_home_store "$home_store_root" > "$home_store_inventory_after"
          test -s "$home_store_inventory_after"
          diff -u "$home_store_inventory_before" "$home_store_inventory_after"
          test "$(stat -f '%i' "$home_store_object")" = "$home_object_inode"
          test "$(stat -f '%m' "$home_store_object")" = "$home_object_mtime"
          test "$(shasum -a 256 "$home_store_object" | awk '{print $1}')" = \
            "$home_object_sha256"
          test "$(shasum -a 256 "$home_store_inventory_after" | awk '{print $1}')" = \
            "$home_inventory_sha256"

          env \
            TCC_EXPECTED="$tcc" \
            SOURCE_DYLIB="$source_dylib" \
            SOURCE_RPATH="$source_rpath" \
            STORE_DYLIB="$home_store_object" \
            STORE_RPATH="-Wl,-rpath,$home_store_dir" \
            UNSET_LOG="$home_unset_log" \
            UNSET_BINARY="$home_unset_binary" \
            EMPTY_LOG="$home_empty_log" \
            EMPTY_BINARY="$home_empty_binary" \
            python3 - <<'PY'
          import collections
          import os
          import pathlib
          import shlex

          prefix = '> C compiler cmd: '
          lanes = (
              ('unset XDG', os.environ['UNSET_LOG'], os.environ['UNSET_BINARY']),
              ('empty XDG', os.environ['EMPTY_LOG'], os.environ['EMPTY_BINARY']),
          )
          for lane, log, binary in lanes:
              lines = pathlib.Path(log).read_text(encoding='utf-8').splitlines()
              commands = [line[len(prefix):] for line in lines if line.startswith(prefix)]
              if len(commands) != 1:
                  raise SystemExit(f'{lane}: expected exactly one C compiler command, found {len(commands)}')
              try:
                  argv = shlex.split(commands[0], posix=True)
              except ValueError as error:
                  raise SystemExit(f'{lane}: could not parse compiler command: {error}')
              if not argv or argv[0] != os.environ['TCC_EXPECTED']:
                  raise SystemExit(f'{lane}: wrong compiler argv[0]: {argv[:1]}')
              counts = collections.Counter(argv)
              for token, label in (
                  (os.environ['STORE_DYLIB'], 'store dylib'),
                  (os.environ['STORE_RPATH'], 'store rpath'),
              ):
                  if counts[token] != 1:
                      raise SystemExit(f'{lane}: expected one {label}, found {counts[token]}')
              for token, label in (
                  (os.environ['SOURCE_DYLIB'], 'source dylib'),
                  (os.environ['SOURCE_RPATH'], 'source rpath'),
              ):
                  if counts[token] != 0:
                      raise SystemExit(f'{lane}: forbidden {label} remains')
              if any('libgc.a' in token for token in argv):
                  raise SystemExit(f'{lane}: compiler command contains libgc.a')
              if counts['-lgc'] != 0:
                  raise SystemExit(f'{lane}: compiler command contains -lgc')
              if any(token.startswith('@') for token in argv):
                  raise SystemExit(f'{lane}: response-file token is forbidden')
              if counts['-o'] != 1:
                  raise SystemExit(f'{lane}: expected one -o token, found {counts["-o"]}')
              joined = [token for token in argv if token != '-o' and token.startswith('-o')]
              if joined:
                  raise SystemExit(f'{lane}: joined -o option is forbidden: {joined}')
              output_index = argv.index('-o')
              if output_index + 1 >= len(argv) or argv[output_index + 1] != binary:
                  raise SystemExit(f'{lane}: -o does not target the exact binary')
              compiler_names = {'cc', 'gcc', 'clang', 'clang++', 'tcc', 'tcc.exe'}
              unexpected = [token for token in argv[1:] if os.path.basename(token) in compiler_names]
              if unexpected:
                  raise SystemExit(f'{lane}: command names a second compiler: {unexpected}')
          PY

          attest_home_binary() {
            local binary=$1
            local label=$2
            local file_text libraries_log load_commands_log
            local dependency_count libgc_dependency_count
            local total_rpath_count store_rpath_count source_rpath_count
            file_text=$(file "$binary")
            test "${file_text#*Mach-O 64-bit}" != "$file_text"
            test "${file_text#*x86_64}" != "$file_text"
            libraries_log="$RUNNER_TEMP/$label.otool-L.log"
            load_commands_log="$RUNNER_TEMP/$label.otool-l.log"
            test ! -e "$libraries_log"
            test ! -e "$load_commands_log"
            otool -L "$binary" > "$libraries_log"
            dependency_count=$(awk '$1 == "@rpath/libgc.dylib" { count++ } END { print count + 0 }' \
              "$libraries_log")
            libgc_dependency_count=$(awk 'NR > 1 && $1 ~ /libgc/ { count++ } END { print count + 0 }' \
              "$libraries_log")
            test "$dependency_count" -eq 1
            test "$libgc_dependency_count" -eq 1
            if grep -Fq "$source_dylib" "$libraries_log" \
              || grep -Fq "$source_target" "$libraries_log" \
              || grep -Fq "$home_store_object" "$libraries_log"; then
              echo "::error::$label leaked an absolute libgc path into LC_LOAD_DYLIB" >&2
              exit 1
            fi
            otool -l "$binary" > "$load_commands_log"
            read -r total_rpath_count store_rpath_count source_rpath_count < <(
              awk -v store="$home_store_dir" -v source="$source_lib_dir" '
                $1 == "cmd" { active = ($2 == "LC_RPATH"); next }
                active && $1 == "path" {
                  value = $0
                  sub(/^[[:space:]]*path[[:space:]]+/, "", value)
                  sub(/[[:space:]]+\(offset[[:space:]]+[0-9]+\)[[:space:]]*$/, "", value)
                  total_count++
                  if (value == store) store_count++
                  if (value == source) source_count++
                  active = 0
                }
                END { print total_count + 0, store_count + 0, source_count + 0 }
              ' "$load_commands_log"
            )
            test "$total_rpath_count" -eq 1
            test "$store_rpath_count" -eq 1
            test "$source_rpath_count" -eq 0
          }

          run_home_binary() {
            local mode=$1
            local binary=$2
            local stdout=$3
            test ! -e "$stdout"
            set +e
            case "$mode" in
              unset)
                env "${clean_env[@]}" -u XDG_DATA_HOME HOME="$SMOKE_HOME" \
                  VCACHE="$SMOKE_VCACHE" SMOKE_HOME_EXPECTED="$SMOKE_HOME" \
                  SMOKE_VCACHE_EXPECTED="$SMOKE_VCACHE" GIT_ALLOW_PROTOCOL=file \
                  bash -c '
                    set -euo pipefail
                    test "${XDG_DATA_HOME+x}" != x
                    test "$HOME" = "$SMOKE_HOME_EXPECTED"
                    test "$VCACHE" = "$SMOKE_VCACHE_EXPECTED"
                    unset SMOKE_HOME_EXPECTED
                    unset SMOKE_VCACHE_EXPECTED
                    exec "$@"
                  ' bash "$binary" > "$stdout"
                ;;
              empty)
                env "${clean_env[@]}" XDG_DATA_HOME= HOME="$SMOKE_HOME" \
                  VCACHE="$SMOKE_VCACHE" SMOKE_HOME_EXPECTED="$SMOKE_HOME" \
                  SMOKE_VCACHE_EXPECTED="$SMOKE_VCACHE" GIT_ALLOW_PROTOCOL=file \
                  bash -c '
                    set -euo pipefail
                    test "${XDG_DATA_HOME+x}" = x
                    test -z "$XDG_DATA_HOME"
                    test "$HOME" = "$SMOKE_HOME_EXPECTED"
                    test "$VCACHE" = "$SMOKE_VCACHE_EXPECTED"
                    unset SMOKE_HOME_EXPECTED
                    unset SMOKE_VCACHE_EXPECTED
                    exec "$@"
                  ' bash "$binary" > "$stdout"
                ;;
              *) exit 1 ;;
            esac
            local status=$?
            set -e
            test "$status" -eq 0
            test "$(LC_ALL=C wc -l < "$stdout" | tr -d ' ')" -eq 1
            test "$(sed -n '1p' "$stdout")" = part-c-ok:1023
          }

          attest_home_binary "$home_unset_binary" home-fallback-unset-xdg-smoke
          attest_home_binary "$home_empty_binary" home-fallback-empty-xdg-smoke
          home_unset_stdout="$RUNNER_TEMP/home-fallback-unset-xdg-smoke.stdout"
          home_empty_stdout="$RUNNER_TEMP/home-fallback-empty-xdg-smoke.stdout"
          run_home_binary unset "$home_unset_binary" "$home_unset_stdout"
          run_home_binary empty "$home_empty_binary" "$home_empty_stdout"

          {
            printf 'HOME_DATA_BASE=%q\n' "$home_data_base"
            printf 'HOME_STORE_ROOT=%q\n' "$home_store_root"
            printf 'HOME_STORE_DIR=%q\n' "$home_store_dir"
            printf 'HOME_STORE_OBJECT=%q\n' "$home_store_object"
            printf 'HOME_OBJECT_INODE=%q\n' "$home_object_inode"
            printf 'HOME_OBJECT_MTIME=%q\n' "$home_object_mtime"
            printf 'HOME_OBJECT_SHA256=%q\n' "$home_object_sha256"
            printf 'HOME_INVENTORY_SHA256=%q\n' "$home_inventory_sha256"
            printf 'HOME_UNSET_BINARY=%q\n' "$home_unset_binary"
            printf 'HOME_EMPTY_BINARY=%q\n' "$home_empty_binary"
          } > "$RUNNER_TEMP/home-fallback-smoke.env"

      - name: Prove no compiler fallback
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/part-c-smoke.env"
          source "$RUNNER_TEMP/tccbin-baseline.env"

          clean_env=(
            -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY
            -u http_proxy -u https_proxy -u all_proxy
          )
          while IFS= read -r variable; do
            case "$variable" in
              DYLD_*) clean_env+=(-u "$variable") ;;
            esac
          done < <(compgen -e)

          fake_tcc="$RUNNER_TEMP/fake-tcc-no-fallback"
          invocation_log="$RUNNER_TEMP/fake-tcc-no-fallback.invocations"
          argument_log="$RUNNER_TEMP/fake-tcc-no-fallback.arguments"
          test ! -e "$fake_tcc"
          test ! -e "$invocation_log"
          test ! -e "$argument_log"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            ': "${FAKE_TCC_INVOCATION_LOG:?}"' \
            ': "${FAKE_TCC_ARGUMENT_LOG:?}"' \
            'printf "invocation\\n" >> "$FAKE_TCC_INVOCATION_LOG"' \
            'printf "%s\\0" "$@" >> "$FAKE_TCC_ARGUMENT_LOG"' \
            'printf "%s\\n" "intentional no-fallback probe failure" >&2' \
            'exit 86' > "$fake_tcc"
          chmod 0700 "$fake_tcc"

          negative_source="$RUNNER_TEMP/part-c-no-fallback-probe.v"
          negative_binary="$RUNNER_TEMP/part-c-no-fallback-probe"
          negative_log="$RUNNER_TEMP/part-c-no-fallback-probe.log"
          printf '%s\n' 'fn main() {}' > "$negative_source"
          set +e
          (
            cd "$VROOT"
            env "${clean_env[@]}" \
              XDG_DATA_HOME="$XDG" \
              VCACHE="$SMOKE_VCACHE" \
              GIT_ALLOW_PROTOCOL=file \
              FAKE_TCC_INVOCATION_LOG="$invocation_log" \
              FAKE_TCC_ARGUMENT_LOG="$argument_log" \
              "$VROOT/v" -cc "$fake_tcc" -gc boehm -showcc \
              -no-retry-compilation -no-rsp -nocache \
              -o "$negative_binary" "$negative_source"
          ) 2>&1 | tee "$negative_log"
          negative_status=${PIPESTATUS[0]}
          set -e

          test "$negative_status" -ne 0
          test "$(awk '$0 == "invocation" { count++ } END { print count + 0 }' "$invocation_log")" -eq 1
          python3 - "$argument_log" <<'PY'
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1]).read_bytes()
          arguments = raw.split(b'\0')
          if arguments and arguments[-1] == b'':
              arguments.pop()
          if not any(argument.endswith(b'.c') for argument in arguments):
              raise SystemExit('fake TCC was not invoked with a generated .c argument')
          PY
          env \
            FAKE_TCC_EXPECTED="$fake_tcc" \
            NEGATIVE_BINARY="$negative_binary" \
            STORE_DYLIB="$XDG/v-tcc-libgc-v1/$TCCBIN_LIBGC_DYLIB_SHA256/libgc.dylib" \
            STORE_RPATH="-Wl,-rpath,$XDG/v-tcc-libgc-v1/$TCCBIN_LIBGC_DYLIB_SHA256" \
            SOURCE_DYLIB="$VROOT/thirdparty/tcc/lib/libgc.dylib" \
            SOURCE_RPATH="-Wl,-rpath,$VROOT/thirdparty/tcc/lib" \
            python3 - "$negative_log" <<'PY'
          import collections
          import os
          import pathlib
          import shlex
          import sys

          prefix = '> C compiler cmd: '
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          commands = [line[len(prefix):] for line in lines if line.startswith(prefix)]
          if len(commands) != 1:
              raise SystemExit(f'expected exactly one negative C compiler command, found {len(commands)}')
          try:
              argv = shlex.split(commands[0], posix=True)
          except ValueError as error:
              raise SystemExit(f'could not parse negative C compiler command: {error}')
          fake_tcc = os.environ['FAKE_TCC_EXPECTED']
          if not argv or argv[0] != fake_tcc:
              raise SystemExit(f'negative compiler argv[0] is not the exact fake TCC: {argv[:1]}')
          counts = collections.Counter(argv)
          for token, label in (
              (os.environ['STORE_DYLIB'], 'negative store dylib'),
              (os.environ['STORE_RPATH'], 'negative store rpath'),
          ):
              if counts[token] != 1:
                  raise SystemExit(f'expected exactly one {label} token, found {counts[token]}')
          for token, label in (
              (os.environ['SOURCE_DYLIB'], 'negative source dylib'),
              (os.environ['SOURCE_RPATH'], 'negative source rpath'),
          ):
              if counts[token] != 0:
                  raise SystemExit(f'forbidden {label} token remains in negative command')
          if counts['-o'] != 1:
              raise SystemExit(f'expected exactly one negative -o token, found {counts["-o"]}')
          joined_output_options = [token for token in argv if token != '-o' and token.startswith('-o')]
          if joined_output_options:
              raise SystemExit(f'joined negative -o option is forbidden: {joined_output_options}')
          output_index = argv.index('-o')
          if output_index + 1 >= len(argv) or argv[output_index + 1] != os.environ['NEGATIVE_BINARY']:
              raise SystemExit('the negative -o token does not target the exact negative binary')
          compiler_names = {'cc', 'gcc', 'clang', 'clang++', 'tcc', 'tcc.exe'}
          unexpected = [token for token in argv[1:] if os.path.basename(token) in compiler_names]
          if unexpected:
              raise SystemExit(f'negative command names a second compiler: {unexpected}')
          PY
          grep -Fq 'intentional no-fallback probe failure' "$negative_log"
          test ! -e "$negative_binary"
          test ! -L "$negative_binary"
          if grep -Eiq 'falling back|retrying|recompilation loop|fallback compiler' "$negative_log"; then
            echo '::error::negative probe observed a fallback/retry indication'
            exit 1
          fi

          home_fake_tcc="$RUNNER_TEMP/fake-tcc-home-fallback"
          home_invocation_log="$RUNNER_TEMP/fake-tcc-home-fallback.invocations"
          home_argument_log="$RUNNER_TEMP/fake-tcc-home-fallback.arguments"
          home_negative_binary="$RUNNER_TEMP/home-fallback-no-compiler-fallback-probe"
          home_negative_log="$RUNNER_TEMP/home-fallback-no-compiler-fallback-probe.log"
          for path in "$home_fake_tcc" "$home_invocation_log" "$home_argument_log" \
            "$home_negative_binary" "$home_negative_log"; do
            test ! -e "$path"
          done
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            ': "${FAKE_TCC_INVOCATION_LOG:?}"' \
            ': "${FAKE_TCC_ARGUMENT_LOG:?}"' \
            'printf "invocation\n" >> "$FAKE_TCC_INVOCATION_LOG"' \
            'printf "%s\0" "$@" >> "$FAKE_TCC_ARGUMENT_LOG"' \
            'printf "%s\n" "intentional HOME fallback fake TCC failure" >&2' \
            'exit 87' > "$home_fake_tcc"
          chmod 0700 "$home_fake_tcc"

          set +e
          (
            cd "$VROOT"
            env "${clean_env[@]}" \
              -u XDG_DATA_HOME \
              HOME="$SMOKE_HOME" \
              VCACHE="$SMOKE_VCACHE" \
              SMOKE_HOME_EXPECTED="$SMOKE_HOME" \
              SMOKE_VCACHE_EXPECTED="$SMOKE_VCACHE" \
              GIT_ALLOW_PROTOCOL=file \
              FAKE_TCC_INVOCATION_LOG="$home_invocation_log" \
              FAKE_TCC_ARGUMENT_LOG="$home_argument_log" \
              bash -c '
                set -euo pipefail
                test "${XDG_DATA_HOME+x}" != x
                test "$HOME" = "$SMOKE_HOME_EXPECTED"
                test "$VCACHE" = "$SMOKE_VCACHE_EXPECTED"
                unset SMOKE_HOME_EXPECTED
                unset SMOKE_VCACHE_EXPECTED
                exec "$@"
              ' bash \
              "$VROOT/v" -cc "$home_fake_tcc" -gc boehm -showcc \
                -no-retry-compilation -no-rsp -nocache \
                -o "$home_negative_binary" "$negative_source"
          ) 2>&1 | tee "$home_negative_log"
          home_negative_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${#home_negative_pipeline_status[@]}" -eq 2
          test "${home_negative_pipeline_status[0]}" -ne 0
          test "${home_negative_pipeline_status[1]}" -eq 0
          test -f "$home_negative_log"
          test ! -L "$home_negative_log"
          test -s "$home_negative_log"
          test "$(awk '$0 == "invocation" { count++ } END { print count + 0 }' \
            "$home_invocation_log")" -eq 1
          python3 - "$home_argument_log" <<'PY'
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1]).read_bytes()
          arguments = raw.split(b'\0')
          if arguments and arguments[-1] == b'':
              arguments.pop()
          if not any(argument.endswith(b'.c') for argument in arguments):
              raise SystemExit('HOME fallback fake TCC did not receive a generated .c argument')
          PY
          env \
            FAKE_TCC_EXPECTED="$home_fake_tcc" \
            NEGATIVE_BINARY="$home_negative_binary" \
            STORE_DYLIB="$SMOKE_HOME/.local/share/v-tcc-libgc-v1/$TCCBIN_LIBGC_DYLIB_SHA256/libgc.dylib" \
            STORE_RPATH="-Wl,-rpath,$SMOKE_HOME/.local/share/v-tcc-libgc-v1/$TCCBIN_LIBGC_DYLIB_SHA256" \
            SOURCE_DYLIB="$VROOT/thirdparty/tcc/lib/libgc.dylib" \
            SOURCE_RPATH="-Wl,-rpath,$VROOT/thirdparty/tcc/lib" \
            python3 - "$home_negative_log" <<'PY'
          import collections
          import os
          import pathlib
          import shlex
          import sys

          prefix = '> C compiler cmd: '
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          commands = [line[len(prefix):] for line in lines if line.startswith(prefix)]
          if len(commands) != 1:
              raise SystemExit(f'expected one HOME fallback fake command, found {len(commands)}')
          try:
              argv = shlex.split(commands[0], posix=True)
          except ValueError as error:
              raise SystemExit(f'could not parse HOME fallback fake command: {error}')
          if not argv or argv[0] != os.environ['FAKE_TCC_EXPECTED']:
              raise SystemExit(f'HOME fallback fake argv[0] is wrong: {argv[:1]}')
          counts = collections.Counter(argv)
          for token, label in (
              (os.environ['STORE_DYLIB'], 'HOME store dylib'),
              (os.environ['STORE_RPATH'], 'HOME store rpath'),
          ):
              if counts[token] != 1:
                  raise SystemExit(f'expected one {label}, found {counts[token]}')
          for token, label in (
              (os.environ['SOURCE_DYLIB'], 'source dylib'),
              (os.environ['SOURCE_RPATH'], 'source rpath'),
          ):
              if counts[token] != 0:
                  raise SystemExit(f'forbidden {label} remains in HOME fake command')
          if any('libgc.a' in token for token in argv):
              raise SystemExit('HOME fake command contains libgc.a')
          if counts['-lgc'] != 0:
              raise SystemExit('HOME fake command contains -lgc')
          if any(token.startswith('@') for token in argv):
              raise SystemExit('HOME fake command contains a response-file token')
          if counts['-o'] != 1:
              raise SystemExit(f'expected one HOME fake -o token, found {counts["-o"]}')
          joined = [token for token in argv if token != '-o' and token.startswith('-o')]
          if joined:
              raise SystemExit(f'joined HOME fake -o option is forbidden: {joined}')
          output_index = argv.index('-o')
          if output_index + 1 >= len(argv) or argv[output_index + 1] != os.environ['NEGATIVE_BINARY']:
              raise SystemExit('HOME fake -o does not target the exact negative binary')
          compiler_names = {'cc', 'gcc', 'clang', 'clang++', 'tcc', 'tcc.exe'}
          unexpected = [token for token in argv[1:] if os.path.basename(token) in compiler_names]
          if unexpected:
              raise SystemExit(f'HOME fake command names a second compiler: {unexpected}')
          PY
          grep -Fq 'intentional HOME fallback fake TCC failure' "$home_negative_log"
          test ! -e "$home_negative_binary"
          test ! -L "$home_negative_binary"
          if grep -Eiq 'falling back|retrying|recompilation loop|fallback compiler' \
            "$home_negative_log"; then
            echo '::error::HOME fake probe observed a fallback/retry indication' >&2
            exit 1
          fi
          home_store_object="$SMOKE_HOME/.local/share/v-tcc-libgc-v1/$TCCBIN_LIBGC_DYLIB_SHA256/libgc.dylib"
          test -f "$home_store_object"
          test ! -L "$home_store_object"
          test "$(shasum -a 256 "$home_store_object" | awk '{print $1}')" = \
            "$TCCBIN_LIBGC_DYLIB_SHA256"

          invocation_log_sha256=$(shasum -a 256 "$invocation_log" | awk '{print $1}')
          argument_log_sha256=$(shasum -a 256 "$argument_log" | awk '{print $1}')
          invocation_log_size=$(stat -f '%z' "$invocation_log")
          argument_log_size=$(stat -f '%z' "$argument_log")
          no_root_binary="$RUNNER_TEMP/home-fallback-no-data-root-probe"
          no_root_log="$RUNNER_TEMP/home-fallback-no-data-root-probe.log"
          test ! -e "$no_root_binary"
          test ! -e "$no_root_log"
          set +e
          (
            cd "$VROOT"
            env "${clean_env[@]}" \
              -u XDG_DATA_HOME \
              -u HOME \
              VCACHE="$SMOKE_VCACHE" \
              GIT_ALLOW_PROTOCOL=file \
              FAKE_TCC_INVOCATION_LOG="$invocation_log" \
              FAKE_TCC_ARGUMENT_LOG="$argument_log" \
              "$VROOT/v" -cc "$fake_tcc" -gc boehm -showcc \
              -no-retry-compilation -no-rsp -nocache \
              -o "$no_root_binary" "$negative_source"
          ) 2>&1 | tee "$no_root_log"
          no_root_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${#no_root_pipeline_status[@]}" -eq 2
          test "${no_root_pipeline_status[0]}" -ne 0
          test "${no_root_pipeline_status[1]}" -eq 0
          test -f "$no_root_log"
          test ! -L "$no_root_log"
          test -s "$no_root_log"
          grep -Fq 'XDG_DATA_HOME="" and HOME=""' "$no_root_log"
          grep -Fq 'no persistent data root is configured' "$no_root_log"
          test ! -e "$no_root_binary"
          test ! -L "$no_root_binary"
          test "$(awk '$0 == "invocation" { count++ } END { print count + 0 }' "$invocation_log")" -eq 1
          test "$(stat -f '%z' "$invocation_log")" = "$invocation_log_size"
          test "$(stat -f '%z' "$argument_log")" = "$argument_log_size"
          test "$(shasum -a 256 "$invocation_log" | awk '{print $1}')" = "$invocation_log_sha256"
          test "$(shasum -a 256 "$argument_log" | awk '{print $1}')" = "$argument_log_sha256"
          python3 - "$no_root_log" <<'PY'
          import pathlib
          import sys

          prefix = '> C compiler cmd: '
          commands = [
              line for line in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
              if line.startswith(prefix)
          ]
          if commands:
              raise SystemExit(f'no-data-root probe reached a C compiler command: {commands}')
          PY
          if grep -Fq 'intentional no-fallback probe failure' "$no_root_log"; then
            echo '::error::no-data-root probe unexpectedly invoked fake TCC' >&2
            exit 1
          fi
          if grep -Eiq 'falling back|retrying|recompilation loop|fallback compiler' "$no_root_log"; then
            echo '::error::no-data-root probe observed a fallback/retry indication' >&2
            exit 1
          fi

          real_tcc="$VROOT/thirdparty/tcc"
          test "$(shasum -a 256 "$real_tcc/bundle_checksums.txt" | awk '{print $1}')" = "$TCCBIN_BUNDLE_CHECKSUMS_SHA256"
          (cd "$real_tcc" && shasum -a 256 -c bundle_checksums.txt)
          test -z "$(git -C "$real_tcc" status --porcelain)"
          store_object="$XDG/v-tcc-libgc-v1/$TCCBIN_LIBGC_DYLIB_SHA256/libgc.dylib"
          source_target="$real_tcc/lib/libgc.1.dylib"
          test -f "$store_object"
          test ! -L "$store_object"
          test "$(shasum -a 256 "$store_object" | awk '{print $1}')" = "$TCCBIN_LIBGC_DYLIB_SHA256"
          cmp -s "$source_target" "$store_object"

          test -d "$SMOKE_VCACHE"
          test ! -L "$SMOKE_VCACHE"
          test "$(stat -f '%u' "$SMOKE_VCACHE")" = "$(id -u)"
          test "$(stat -f '%Lp' "$SMOKE_VCACHE")" = 700
          case "$SMOKE_VCACHE" in
            "$SMOKE_HOME"|"$SMOKE_HOME"/*|"$XDG"|"$XDG"/*|"$VROOT"|"$VROOT"/*)
              echo '::error::explicit VCACHE moved inside a protected smoke root' >&2
              exit 1
              ;;
          esac
          test "$(find "$SMOKE_HOME" -mindepth 1 -maxdepth 1 -print)" = "$SMOKE_HOME/.local"

          inventory_smoke_vcache() {
            local root=$1
            local path relative mode uid inode mtime size digest target
            local LC_ALL=C
            export LC_ALL
            find "$root" -print0 | LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                if [ "$path" = "$root" ]; then
                  relative=.
                else
                  relative=${path#"$root"/}
                fi
                mode=$(stat -f '%Lp' "$path")
                uid=$(stat -f '%u' "$path")
                inode=$(stat -f '%i' "$path")
                mtime=$(stat -f '%m' "$path")
                if [ -L "$path" ]; then
                  target=$(readlink "$path")
                  digest=$(printf '%s' "$target" | shasum -a 256 | awk '{print $1}')
                  printf 'L mode=%q uid=%q inode=%q mtime=%q target=%q target_sha256=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$target" "$digest" "$relative"
                elif [ -d "$path" ]; then
                  printf 'D mode=%q uid=%q inode=%q mtime=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$relative"
                elif [ -f "$path" ]; then
                  size=$(stat -f '%z' "$path")
                  digest=$(shasum -a 256 "$path" | awk '{print $1}')
                  printf 'F mode=%q uid=%q inode=%q mtime=%q size=%q sha256=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$size" "$digest" "$relative"
                else
                  printf '::error::unsupported explicit VCACHE entry: %q\n' "$relative" >&2
                  exit 1
                fi
              done
          }

