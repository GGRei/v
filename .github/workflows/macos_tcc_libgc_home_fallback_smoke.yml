          test "$(sed -n '1p' "$runtime_stdout")" = part-c-ok:1023

          postflight_home_binary() {
            local mode=$1
            local binary=$2
            local label=$3
            local file_text libraries_log load_commands_log stdout
            local dependency_count libgc_dependency_count
            local total_rpath_count store_rpath_count source_rpath_count status
            test -f "$binary"
            test ! -L "$binary"
            test -x "$binary"
            file_text=$(file "$binary")
