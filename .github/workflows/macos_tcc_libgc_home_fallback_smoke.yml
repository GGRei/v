            exit 1
          fi

          otool_load_commands_log="$RUNNER_TEMP/part-c-real-smoke.otool-l.log"
          otool -l "$smoke_binary" > "$otool_load_commands_log"
          read -r total_rpath_count store_rpath_count source_rpath_count < <(
