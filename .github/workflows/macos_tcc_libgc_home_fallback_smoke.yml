          test "$(find "$home_local" -mindepth 1 -maxdepth 1 -print)" = "$HOME_DATA_BASE"
          test "$(find "$HOME_DATA_BASE" -mindepth 1 -maxdepth 1 -print)" = "$HOME_STORE_ROOT"
          test "$(find "$HOME_STORE_ROOT" -mindepth 1 -maxdepth 1 -print)" = "$HOME_STORE_DIR"
          test "$(find "$HOME_STORE_DIR" -mindepth 1 -maxdepth 1 -print)" = "$HOME_STORE_OBJECT"
          test -f "$HOME_STORE_OBJECT"
          test ! -L "$HOME_STORE_OBJECT"
          test "$(stat -f '%u' "$HOME_STORE_OBJECT")" = "$(id -u)"
          test "$(stat -f '%Lp' "$HOME_STORE_OBJECT")" = 700
          test "$(stat -f '%i' "$HOME_STORE_OBJECT")" = "$HOME_OBJECT_INODE"
          test "$(stat -f '%m' "$HOME_STORE_OBJECT")" = "$HOME_OBJECT_MTIME"
          test "$(shasum -a 256 "$HOME_STORE_OBJECT" | awk '{print $1}')" = \
            "$HOME_OBJECT_SHA256"
          test "$HOME_OBJECT_SHA256" = "$TCCBIN_LIBGC_DYLIB_SHA256"
          test -z "$(find "$SMOKE_HOME" -maxdepth 6 -type l -print -quit)"
          test -z "$(find "$HOME_STORE_ROOT" -maxdepth 3 -name '.libgc.dylib.tmp.*' -print -quit)"
          home_inventory_before="$RUNNER_TEMP/home-fallback-store.before.inventory"
          home_inventory_after="$RUNNER_TEMP/home-fallback-store.after.inventory"
          test -f "$home_inventory_before"
          test ! -L "$home_inventory_before"
          test -s "$home_inventory_before"
          test -f "$home_inventory_after"
          test ! -L "$home_inventory_after"
          test -s "$home_inventory_after"
          diff -u "$home_inventory_before" "$home_inventory_after"
          test "$(shasum -a 256 "$home_inventory_before" | awk '{print $1}')" = \
            "$HOME_INVENTORY_SHA256"
          test "$(shasum -a 256 "$home_inventory_after" | awk '{print $1}')" = \
            "$HOME_INVENTORY_SHA256"
          test "$(shasum -a 256 "$source_target" | awk '{print $1}')" = \
            "$TCCBIN_LIBGC_DYLIB_SHA256"
          cmp -s "$source_target" "$HOME_STORE_OBJECT"
          test "$HOME_UNSET_BINARY" != "$HOME_EMPTY_BINARY"
          test "$HOME_UNSET_BINARY" != "$smoke_binary"
          test "$HOME_EMPTY_BINARY" != "$smoke_binary"

          test -f "$smoke_source"
          if grep -Fq '#flag' "$smoke_source"; then
            echo '::error::the integrated Part C source contains manual linker flags'
            exit 1
          fi
          otool_libraries_log="$RUNNER_TEMP/part-c-real-smoke.otool-L.log"
          otool -L "$smoke_binary" > "$otool_libraries_log"
          dependency_count=$(awk '$1 == "@rpath/libgc.dylib" { count++ } END { print count + 0 }' \
            "$otool_libraries_log")
          libgc_dependency_count=$(awk 'NR > 1 && $1 ~ /libgc/ { count++ } END { print count + 0 }' \
            "$otool_libraries_log")
          test "$dependency_count" -eq 1
          test "$libgc_dependency_count" -eq 1
          if grep -Fq "$source_dylib" "$otool_libraries_log" \
