          test -f "$SMOKE_VCACHE_INVENTORY"
          test ! -L "$SMOKE_VCACHE_INVENTORY"
          test -s "$SMOKE_VCACHE_INVENTORY"
          test "$(shasum -a 256 "$SMOKE_VCACHE_INVENTORY" | awk '{print $1}')" = \
