          test "$(git -C "$VROOT" rev-parse HEAD)" = "$parent"
          test "$(git -C "$VROOT" rev-parse 'HEAD^{tree}')" = \
            adcb611aea9bb8e6afdfc350cc4777116e3fa92f
          git -C "$VROOT" diff --quiet
          git -C "$VROOT" diff --cached --quiet
          test -z "$(git -C "$VROOT" status --porcelain --untracked-files=all)"
          test "$(shasum -a 256 "$VROOT/vlib/v/builder/cc.v" | awk '{print $1}')" = \
            17c85cfecb014eac0cd53d9407ef9018f106a9ad651910930073c5f0e0d10bc7
          test "$(shasum -a 256 "$VROOT/README.md" | awk '{print $1}')" = \
            6045333a6885c8bc02d8a664fe2dc878b44c75ce597c25a0c5e58f72ceca204a
          test "$(shasum -a 256 "$VROOT/vlib/v/builder/tcc_macos_libgc_store.v" | awk '{print $1}')" = \
            ad2063e8d0bd59ae109e71ab5251e7b67227f113c8409fef1771fc34deb26193
          test "$(shasum -a 256 "$VROOT/vlib/v/builder/tcc_macos_libgc_store_test.v" | awk '{print $1}')" = \
            b93ce05636bba4615f7a735331cd31083a7e32e1a880128322f0ba5cf1c8a8ab
          test "$(grep -c '^fn test_' "$VROOT/vlib/v/builder/tcc_macos_libgc_store_test.v")" -eq 47
          test "$(shasum -a 256 "$VROOT/.github/workflows/update_tccbin.yml" | awk '{print $1}')" = \
            3840d3478e30f849f4e738f2c99e595721d84928b5e418099c54eb3b4427a404
          test "$(shasum -a 256 "$VROOT/vlib/builtin/builtin_d_gcboehm.c.v" | awk '{print $1}')" = \
