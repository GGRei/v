          esac
          case "$(git remote get-url --push origin)" in
            https://github.com/GGRei/v|https://github.com/GGRei/v.git) ;;
            *) echo '::error::workflow checkout push URL is not the GGRei fork' >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 2
          test "$(git rev-parse HEAD^)" = "$parent"
          test "$(git show -s --format=%T HEAD^)" = adcb611aea9bb8e6afdfc350cc4777116e3fa92f
          part_c_commit=190564b33e563a4eeba1007f8172a03b3018f606
          part_c_base=58a8f2a6d4287667c5bc8a9875079a2364a6d45b
          upstream_base=59b4b01ad991101fafcfd4e91282b2a36995bd35
          test "$(git rev-parse "$parent^")" = "$part_c_commit"
          test "$(git rev-parse "$part_c_commit^")" = "$part_c_base"
          test "$(git rev-parse "$part_c_base^")" = "$upstream_base"
          expected_p2_files=$(printf '%s\n' \
            README.md \
