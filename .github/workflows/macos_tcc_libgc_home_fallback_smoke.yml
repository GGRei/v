          test -s "$smoke_vcache_inventory"
          smoke_vcache_inventory_sha256=$(shasum -a 256 "$smoke_vcache_inventory" | awk '{print $1}')
          {
            printf 'SMOKE_VCACHE_INODE=%q\n' "$(stat -f '%i' "$SMOKE_VCACHE")"
            printf 'SMOKE_VCACHE_INVENTORY=%q\n' "$smoke_vcache_inventory"
