            find "$root" -print0 | LC_ALL=C sort -z |
              while IFS= read -r -d '' path; do
                if [ "$path" = "$root" ]; then
                  relative=.
                else
                  relative=${path#"$root"/}
                fi
                mode=$(stat -f '%Lp' "$path")
                uid=$(stat -f '%u' "$path")
                inode=$(stat -f '%i' "$path")
                mtime=$(stat -f '%m' "$path")
                if [ -L "$path" ]; then
                  target=$(readlink "$path")
                  digest=$(printf '%s' "$target" | shasum -a 256 | awk '{print $1}')
                  printf 'L mode=%q uid=%q inode=%q mtime=%q target=%q target_sha256=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$target" "$digest" "$relative"
                elif [ -d "$path" ]; then
                  printf 'D mode=%q uid=%q inode=%q mtime=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$relative"
                elif [ -f "$path" ]; then
                  size=$(stat -f '%z' "$path")
                  digest=$(shasum -a 256 "$path" | awk '{print $1}')
                  printf 'F mode=%q uid=%q inode=%q mtime=%q size=%q sha256=%q path=%q\n' \
                    "$mode" "$uid" "$inode" "$mtime" "$size" "$digest" "$relative"
                else
