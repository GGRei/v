            stdout="$RUNNER_TEMP/$label.postflight.stdout"
            test ! -e "$libraries_log"
            test ! -e "$load_commands_log"
            test ! -e "$stdout"
            otool -L "$binary" > "$libraries_log"
            dependency_count=$(awk '$1 == "@rpath/libgc.dylib" { count++ } END { print count + 0 }' \
