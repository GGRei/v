name: Smoke Windows TCC header cascade

on:
  workflow_dispatch:
    inputs:
      tccbin_repository:
        description: tccbin repository containing the Windows bundle
        required: true
        default: GGRei/tccbin
        type: string
      tccbin_commit:
        description: Exact tccbin commit to consume
        required: true
        default: 115bf4c8c47749a8850986aa746af0e4be36f509
        type: string
      expect_inet_ntop_declared:
        description: Require the strict inet_ntop C probe to compile
        required: true
        default: true
        type: boolean
  push:
    branches:
      - smoke/windows-tcc-header-cascade-20260726

permissions:
  contents: read

env:
  TCCBIN_REPOSITORY: ${{ inputs.tccbin_repository || 'GGRei/tccbin' }}
  TCCBIN_COMMIT: ${{ inputs.tccbin_commit || '115bf4c8c47749a8850986aa746af0e4be36f509' }}
  EXPECT_INET_NTOP_DECLARED: ${{ inputs.expect_inet_ntop_declared || true }}

jobs:
  tcc-windows:
    name: tcc-windows
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VFLAGS: -cc tcc -no-retry-compilation
      VTEST_SHOW_LONGEST_BY_RUNTIME: 3
      VTEST_SHOW_LONGEST_BY_COMPTIME: 3
      VTEST_SHOW_LONGEST_BY_TOTALTIME: 3
    steps:
      - uses: actions/checkout@v7

      - name: Checkout pinned tccbin source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TCCBIN_REPOSITORY }}
          ref: ${{ env.TCCBIN_COMMIT }}
          path: .smoke-tccbin-source

      - name: Prepare pinned tccbin source
        shell: pwsh
        run: |
          $actual = (& git -C .smoke-tccbin-source rev-parse HEAD).Trim()
          if ($actual -ne $env:TCCBIN_COMMIT) {
            throw "Expected tccbin $env:TCCBIN_COMMIT, got $actual"
          }
          & git -C .smoke-tccbin-source switch -c thirdparty-windows-amd64
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the local pinned tccbin branch'
          }
          $source = (Resolve-Path .smoke-tccbin-source).Path
          "TCC_GIT=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned $env:TCCBIN_REPOSITORY at $actual"

      - name: Build with makev.bat -tcc
        run: |
          .\makev.bat -tcc
          .\v.exe symlink

      - name: Verify consumed tccbin revision
        shell: pwsh
        run: |
          $actual = (& git -C thirdparty/tcc rev-parse HEAD).Trim()
          if ($actual -ne $env:TCCBIN_COMMIT) {
            throw "V consumed tccbin $actual instead of $env:TCCBIN_COMMIT"
          }
          Write-Host "Consumed $env:TCCBIN_REPOSITORY at $actual"
          Get-FileHash -Algorithm SHA256 thirdparty/tcc/include/winapi/ws2tcpip.h

      - name: Pkg-config regression (TCC dynamic isolation)
        run: |
          .\v.exe -cc tcc -no-retry-compilation test vlib\v\checker\pkgconfig_static_mode_test.v
          if ($LASTEXITCODE -ne 0) {
            throw "pkg-config TCC isolation regression failed with exit code $LASTEXITCODE"
          }

      - name: All code is formatted
        run: v -silent test-cleancode

      - name: Test new v.c
        run: |
          v -o v.c cmd/v
          $direct_c_flags = @(
            '-Ithirdparty/zip'
            '-Ithirdparty/cJSON'
            '-Ithirdparty/mbedtls/library'
            '-Ithirdparty/mbedtls/include'
            '-Ithirdparty/mbedtls/3rdparty/everest/include'
            '-Ithirdparty/mbedtls/3rdparty/everest/include/everest'
            '-Ithirdparty/mbedtls/3rdparty/everest/include/everest/kremlib'
            '-Ithirdparty/vschannel'
          )
          # Match makev.bat's Windows stack reserve; the direct TCC-built
          # compiler can otherwise crash while compiling net.http-heavy scripts.
          .\thirdparty\tcc\tcc.exe -Werror -w @direct_c_flags -ladvapi32 -lws2_32 -bt10 '-Wl,-stack=33554432' v.c

      - name: Install dependencies
        run: |
          v retry -- v setup-freetype
          .\.github\workflows\windows-install-sqlite.bat

      - name: v -g self
        run: v -g self

      - name: v doctor
        run: |
          v doctor

      - name: Verify `v test` works
        run: |
          v cmd/tools/test_if_v_test_system_works.v
          .\cmd\tools\test_if_v_test_system_works.exe

      - name: Legacy gg import multiwindow isolation
        run: v test vlib/gg/legacy_import_multiwindow_isolation_test.v

      - name: Verify `v vlib/v/gen/c/coutput_test.v` works
        run: v vlib/v/gen/c/coutput_test.v

      - name: Make sure running TCC64 instead of TCC32
        run: v test .github\workflows\make_sure_ci_run_with_64bit_compiler_test.v

      - name: Test ./v doc -v clipboard *BEFORE building tools*
        run: v doc -v clipboard

      - name: Test v build-tools
        run: v -silent -W build-tools

      - name: Test pure V math module
        run: v -silent -exclude @vlib/math/*.c.v test vlib/math/

      - name: Multiwindow render runtime contract
        run: .\v.exe -silent vlib\gg\multiwindow_render_runtime_contract_test.v

      - name: Self tests
        run: v -silent test-self vlib

      - name: Test v->js
        run: v -o hi.js examples/js_hello_world.v && node hi.js

      - name: Test v binaries
        run: v build-vbinaries

      - name: Build examples
        run: v build-examples

      - name: Compile and run the veb example (fasthttp) and check its HTML
        run: v run .github/workflows/veb_example_windows_smoke.v

      - name: v2 self compilation
        run: v -o v2.exe cmd/v && .\v2.exe -o v3.exe cmd/v && .\v3.exe -o v4.exe cmd/v

  tools-windows-tcc:
    name: tools-windows (tcc)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      VFLAGS: -cc tcc
    steps:
      - uses: actions/checkout@v7

      - name: Checkout pinned tccbin source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TCCBIN_REPOSITORY }}
          ref: ${{ env.TCCBIN_COMMIT }}
          path: .smoke-tccbin-source

      - name: Prepare pinned tccbin source
        shell: pwsh
        run: |
          $actual = (& git -C .smoke-tccbin-source rev-parse HEAD).Trim()
          if ($actual -ne $env:TCCBIN_COMMIT) {
            throw "Expected tccbin $env:TCCBIN_COMMIT, got $actual"
          }
          & git -C .smoke-tccbin-source switch -c thirdparty-windows-amd64
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the local pinned tccbin branch'
          }
          $source = (Resolve-Path .smoke-tccbin-source).Path
          "TCC_GIT=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned $env:TCCBIN_REPOSITORY at $actual"

      - name: Build V
        run: ./makev.bat -tcc && ./v -o v2.exe cmd/v && ./v2 -showcc -o v.exe cmd/v && ./v symlink && ./v doctor

      - name: Verify consumed tccbin revision
        shell: pwsh
        run: |
          $actual = (& git -C thirdparty/tcc rev-parse HEAD).Trim()
          if ($actual -ne $env:TCCBIN_COMMIT) {
            throw "V consumed tccbin $actual instead of $env:TCCBIN_COMMIT"
          }
          Write-Host "Consumed $env:TCCBIN_REPOSITORY at $actual"
          Get-FileHash -Algorithm SHA256 thirdparty/tcc/include/winapi/ws2tcpip.h

      - name: Install SQLite (needed by vsqlite tool)
        run: .\.github\workflows\windows-install-sqlite.bat

      - name: Check build tools
        run: ./v build-tools

      - name: Test tools
        run: ./v -silent test-self cmd

  tools-windows-tcc-strict:
    name: tools-windows (tcc, no fallback proof)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      VFLAGS: -cc tcc -no-retry-compilation
    steps:
      - uses: actions/checkout@v7

      - name: Checkout pinned tccbin source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TCCBIN_REPOSITORY }}
          ref: ${{ env.TCCBIN_COMMIT }}
          path: .smoke-tccbin-source

      - name: Prepare pinned tccbin source
        shell: pwsh
        run: |
          $actual = (& git -C .smoke-tccbin-source rev-parse HEAD).Trim()
          if ($actual -ne $env:TCCBIN_COMMIT) {
            throw "Expected tccbin $env:TCCBIN_COMMIT, got $actual"
          }
          & git -C .smoke-tccbin-source switch -c thirdparty-windows-amd64
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create the local pinned tccbin branch'
          }
          $source = (Resolve-Path .smoke-tccbin-source).Path
          "TCC_GIT=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned $env:TCCBIN_REPOSITORY at $actual"

      - name: Build V
        run: ./makev.bat -tcc && ./v -o v2.exe cmd/v && ./v2 -showcc -o v.exe cmd/v && ./v symlink && ./v doctor

      - name: Verify consumed tccbin revision
        shell: pwsh
        run: |
          $actual = (& git -C thirdparty/tcc rev-parse HEAD).Trim()
          if ($actual -ne $env:TCCBIN_COMMIT) {
            throw "V consumed tccbin $actual instead of $env:TCCBIN_COMMIT"
          }
          Write-Host "Consumed $env:TCCBIN_REPOSITORY at $actual"
          Get-FileHash -Algorithm SHA256 thirdparty/tcc/include/winapi/ws2tcpip.h

      - name: Install SQLite (needed by vsqlite tool)
        run: .\.github\workflows\windows-install-sqlite.bat

      - name: Check build tools
        run: ./v build-tools

      - name: Test tools
        run: ./v -silent test-self cmd

  inet-ntop-header-proof:
    name: inet_ntop declaration proof
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout exact tccbin bundle
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TCCBIN_REPOSITORY }}
          ref: ${{ env.TCCBIN_COMMIT }}
          path: thirdparty/tcc

      - name: Verify exact bundle and header
        shell: pwsh
        run: |
          $actual = (& git -C thirdparty/tcc rev-parse HEAD).Trim()
          if ($actual -ne $env:TCCBIN_COMMIT) {
            throw "Expected tccbin $env:TCCBIN_COMMIT, got $actual"
          }
          $header = 'thirdparty/tcc/include/winapi/ws2tcpip.h'
          $declarations = @(Select-String -Path $header -Pattern '\binet_ntop\b')
          Write-Host "tccbin_repository=$env:TCCBIN_REPOSITORY"
          Write-Host "tccbin_commit=$actual"
          Write-Host "ws2tcpip.h inet_ntop matches=$($declarations.Count)"
          Get-FileHash -Algorithm SHA256 $header

      - name: Compile strict inet_ntop declaration probe
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'inet_ntop_header_probe.c'
          $object = Join-Path $env:RUNNER_TEMP 'inet_ntop_header_probe.o'
          @'
          #define WIN32_LEAN_AND_MEAN
          #define WINVER 0x0600
          #define _WIN32_WINNT 0x0600
          #include <winsock2.h>
          #include <ws2tcpip.h>

          int probe_inet_ntop(void) {
              struct in_addr address = {0};
              char buffer[INET_ADDRSTRLEN];
              return inet_ntop(AF_INET, &address, buffer, sizeof(buffer)) == 0;
          }
          '@ | Set-Content -Path $source -Encoding ascii

          $output = & .\thirdparty\tcc\tcc.exe `
            -Bthirdparty/tcc `
            -Werror=implicit-function-declaration `
            -c -o $object $source 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $diagnostic = $output | Out-String
          $expectDeclared = $env:EXPECT_INET_NTOP_DECLARED -eq 'true'

          if ($expectDeclared) {
            if ($exitCode -ne 0) {
              throw "Expected inet_ntop to be declared:`n$diagnostic"
            }
            Write-Host 'PROOF inet_ntop_declaration=present'
            exit 0
          }
          if ($exitCode -eq 0) {
            throw 'Expected the strict inet_ntop declaration probe to fail'
          }
          if ($diagnostic -notmatch 'inet_ntop') {
            throw "Unexpected first diagnostic:`n$diagnostic"
          }
          if ($diagnostic -match 'WSAConnectByNameW') {
            throw "The superseded WSAConnectByNameW failure resurfaced:`n$diagnostic"
          }
          Write-Host 'PROOF inet_ntop_declaration=missing'
