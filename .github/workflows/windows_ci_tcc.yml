name: Smoke Windows TCC wfreopen

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: windows-tcc-wfreopen-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tcc-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VFLAGS: -cc tcc -no-retry-compilation
      VTEST_SHOW_LONGEST_BY_RUNTIME: 3
      VTEST_SHOW_LONGEST_BY_COMPTIME: 3
      VTEST_SHOW_LONGEST_BY_TOTALTIME: 3
    steps:
      - uses: actions/checkout@v7

      - name: Build with makev.bat -tcc
        run: |
          .\makev.bat -tcc
          .\v.exe symlink

      - name: Build current v.c directly with TCC
        run: |
          v -o v.c cmd/v
          $direct_c_flags = @(
            '-Ithirdparty/zip'
            '-Ithirdparty/cJSON'
            '-Ithirdparty/mbedtls/library'
            '-Ithirdparty/mbedtls/include'
            '-Ithirdparty/mbedtls/3rdparty/everest/include'
            '-Ithirdparty/mbedtls/3rdparty/everest/include/everest'
            '-Ithirdparty/mbedtls/3rdparty/everest/include/everest/kremlib'
            '-Ithirdparty/vschannel'
          )
          # Match makev.bat's Windows stack reserve; the direct TCC-built
          # compiler can otherwise crash while compiling net.http-heavy scripts.
          .\thirdparty\tcc\tcc.exe -Werror -w @direct_c_flags -ladvapi32 -lws2_32 -bt10 '-Wl,-stack=33554432' v.c

      - name: Install upstream Windows test dependencies
        run: |
          v retry -- v setup-freetype
          .\.github\workflows\windows-install-sqlite.bat

      - name: Build the current compiler with TCC
        run: v -g self

      - name: 1. Verify manual stdlib declarations
        run: .\v.exe -cc tcc -no-retry-compilation test vlib\v\gen\c\cheaders_manual_stdlib_decls_test.v

      - name: 2. Run Windows-TCC runtime regressions
        run: .\v.exe -cc tcc -no-retry-compilation test vlib\v\gen\c\windows_tcc_file_reopen_test.v

      - name: 3. Compile and run embed_issue_12035 directly
        shell: pwsh
        run: |
          .\v.exe -cc tcc -no-retry-compilation -prod -no-skip-unused -o .\embed_issue_12035.exe vlib\v\gen\c\testdata\embed_issue_12035.vv
          if ($LASTEXITCODE -ne 0) {
            throw "embed_issue_12035 compilation failed with exit code $LASTEXITCODE"
          }
          $actual = & .\embed_issue_12035.exe
          if ($LASTEXITCODE -ne 0) {
            throw "embed_issue_12035 execution failed with exit code $LASTEXITCODE"
          }
          if (($actual -join "`n").Trim() -ne 'issue-12035') {
            throw "embed_issue_12035 output mismatch: $actual"
          }

      - name: 4. Run the complete C output regression suite
        run: .\v.exe -cc tcc -no-retry-compilation vlib\v\gen\c\coutput_test.v

      - name: 5. Assert generated C has no implicit CRT declarations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $collector_c_path = [IO.Path]::GetFullPath((Join-Path $PWD 'embed_issue_12035_collector.c'))
          $collector_object_path = [IO.Path]::GetFullPath((Join-Path $PWD 'embed_issue_12035_collector.obj'))
          $expected_tcc_path = [IO.Path]::GetFullPath((Join-Path $PWD 'thirdparty\tcc\tcc.exe'))
          $gc_include_path = [IO.Path]::GetFullPath((Join-Path $PWD 'thirdparty\libgc\include'))
          Remove-Item -LiteralPath $collector_c_path -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $collector_object_path -Force -ErrorAction SilentlyContinue

          $generator_output = @(& .\v.exe -prod -no-skip-unused -o .\embed_issue_12035_collector.c vlib\v\gen\c\testdata\embed_issue_12035.vv 2>&1)
          $generator_exit = $LASTEXITCODE
          $generator_output | ForEach-Object { Write-Host $_ }
          $collector_c_size = if (Test-Path -LiteralPath $collector_c_path -PathType Leaf) {
            (Get-Item -LiteralPath $collector_c_path).Length
          } else {
            0
          }
          Write-Host "PROOF collector_generator_exit=$generator_exit"
          Write-Host "PROOF collector_generated_c_size=$collector_c_size"
          if ($generator_exit -ne 0 -or $collector_c_size -le 0) {
            throw "V did not generate a nonempty collector C file"
          }

          if (-not (Test-Path -LiteralPath $expected_tcc_path -PathType Leaf)) {
            throw "Bundled TCC does not exist at $expected_tcc_path"
          }
          if (-not (Test-Path -LiteralPath $gc_include_path -PathType Container)) {
            throw "Bundled libgc include directory does not exist at $gc_include_path"
          }
          $resolved_tcc_path = (Resolve-Path -LiteralPath $expected_tcc_path).Path
          if (-not [string]::Equals($resolved_tcc_path, $expected_tcc_path, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Resolved TCC path differs from bundled TCC path: $resolved_tcc_path"
          }

          $tcc_args = @(
            '-DGC_THREADS=1'
            '-DTHREAD_LOCAL_ALLOC=1'
            '-DGC_NOT_DLL=1'
            '-DGC_WIN32_THREADS=1'
            '-DGC_BUILTIN_ATOMIC=1'
            "-I$gc_include_path"
            '-Wimplicit-function-declaration'
            '-Wno-error=implicit-function-declaration'
            '-std=c99'
            '-D_DEFAULT_SOURCE'
            '-bt25'
            '-c'
            '-o'
            $collector_object_path
            $collector_c_path
          )
          $library_args = @($tcc_args | Where-Object { $_ -match '(?i)(^-l|\.a$|\.lib$)' })
          $warning_index = [Array]::IndexOf($tcc_args, '-Wimplicit-function-declaration')
          $wnoerror_index = [Array]::IndexOf($tcc_args, '-Wno-error=implicit-function-declaration')
          $source_index = [Array]::IndexOf($tcc_args, $collector_c_path)
          if ($library_args.Count -ne 0) {
            throw "Direct TCC collector unexpectedly contains library arguments: $library_args"
          }
          if ($warning_index -lt 0 -or $wnoerror_index -le $warning_index -or $source_index -le $wnoerror_index) {
            throw "Direct TCC warning flags must precede the generated C source"
          }

          Write-Host "PROOF collector_tcc_path=$resolved_tcc_path"
          Write-Host "PROOF collector_fallback_possible=false"
          Write-Host "PROOF collector_library_arg_count=$($library_args.Count)"
          $tcc_output = @(& $resolved_tcc_path @tcc_args 2>&1)
          $tcc_exit = $LASTEXITCODE
          $tcc_output | ForEach-Object { Write-Host $_ }
          $tcc_text = $tcc_output -join "`n"
          $warning_matches = [regex]::Matches($tcc_text, "(?im)warning:\s+implicit declaration of function\s+'([^']+)'")
          $implicit_warning_symbols = @($warning_matches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          $collector_object_size = if (Test-Path -LiteralPath $collector_object_path -PathType Leaf) {
            (Get-Item -LiteralPath $collector_object_path).Length
          } else {
            0
          }

          Write-Host "PROOF collector_tcc_exit=$tcc_exit"
          Write-Host "PROOF collector_object_size=$collector_object_size"
          Write-Host "PROOF collector_implicit_warning_symbol_count=$($implicit_warning_symbols.Count)"
          $implicit_warning_symbols | ForEach-Object {
            Write-Host "PROOF collector_implicit_warning_symbol=$_"
          }
          if ($tcc_exit -ne 0) {
            throw "Direct bundled TCC object compilation failed with exit code $tcc_exit"
          }
          if ($collector_object_size -le 0) {
            throw "Direct bundled TCC did not produce a nonempty collector object"
          }
          if ($implicit_warning_symbols.Count -ne 0) {
            throw "Direct bundled TCC found implicit declarations: $($implicit_warning_symbols -join ', ')"
          }
